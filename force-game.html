<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Force Game · 팀 퀴즈 레이스</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dfe5ef;--brand:#2563eb;--good:#16803c;--bad:#b42318;--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1080px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #1720330d}
h1,h2,h3{margin:.2em 0 .6em}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer;background:#e9eef8;color:var(--ink)}
button.primary{background:var(--brand);color:#fff}button.good{background:var(--good);color:#fff}button.danger{background:#fee4e2;color:#912018}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hide{display:none!important}.pill{padding:6px 10px;border-radius:999px;background:#edf2ff;font-weight:700}.big{font-size:clamp(26px,5vw,48px);font-weight:900}
.option{display:block;width:100%;text-align:left;margin:8px 0;background:#f8fafc;border:2px solid var(--line)}.option.sel{border-color:var(--brand);background:#eff6ff}
.bar{height:22px;background:#e9eef8;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--brand);transition:.3s}.stat{font-size:28px;font-weight:900}
.qedit{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.small{font-size:13px}.ok{color:var(--good)}.err{color:var(--bad)}

.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.team{padding:14px;border-radius:16px;background:#fff;border:2px solid var(--line);text-align:center}.track{height:16px;background:#e9eef8;border-radius:99px;overflow:hidden}.runner{height:100%;background:var(--accent);transition:.4s}@media(max-width:650px){.teams{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Force Game</h1><div class="muted">팀 대항 마무리 퀴즈 · v1</div></div><span class="pill">Firebase</span></div>
<div id="home" class="card"><h2>게임 시작</h2><div class="row"><button class="primary" id="tb">교사 게임 만들기</button><button id="sb">학생 참가</button></div></div>
<section id="ts" class="hide"><div class="card"><h2>게임 설정</h2><label>게임 이름</label><input id="gn" value="과학에서의 힘 · 팀 레이스"><label style="margin-top:8px;display:block">문제 세트 JSON (Force Class 기본 문제가 들어 있습니다)</label><textarea id="qjson" rows="7"></textarea><button class="primary" id="mk" style="margin-top:10px">게임방 만들기</button><div class="small muted">Force Class에서 문제 세트를 JSON으로 내보내는 기능은 다음 확장 때 연결할 수 있습니다.</div></div></section>
<section id="tl" class="hide"><div class="card"><div class="top"><div><div class="muted">게임 코드</div><div class="big" id="rc"></div></div><img id="qr" width="150"></div></div><div class="card"><div class="teams" id="teams"></div></div><div class="card"><span class="pill" id="qn"></span><h2 id="tq"></h2><div id="to"></div><div class="row"><button id="rv">정답 공개</button><button class="primary" id="nx">다음 문제</button></div><div id="gs" class="muted"></div></div></section>
<section id="sj" class="hide"><div class="card"><h2>게임 참가</h2><label>방 코드</label><input id="jr" maxlength="6"><button class="primary" id="join">참가하기</button><div id="jm"></div></div></section>
<section id="sl" class="hide"><div class="card"><div id="myteam" class="pill"></div><span class="pill" id="sqn"></span><h2 id="sq"></h2><div id="so"></div><button class="primary" id="sub">답 제출</button><div id="sm"></div></div><div id="res" class="card hide"></div></section>
</div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getFirestore,doc,setDoc,getDoc,collection,getDocs,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={
 apiKey:"AIzaSyAis4MfE6-oamhQZ_iD7ND-qfcD2Dcr8BQ",
 authDomain:"sciencelab27-5b82f.firebaseapp.com",
 projectId:"sciencelab27-5b82f",
 storageBucket:"sciencelab27-5b82f.firebasestorage.app",
 messagingSenderId:"412075132650",
 appId:"1:412075132650:web:5630ae2484e7dcd1393993"
};
const db=getFirestore(initializeApp(firebaseConfig)),$=id=>document.getElementById(id),DEFAULT=[{"q": "과학에서 말하는 힘의 설명으로 옳은 것은?", "opts": ["사람의 능력이나 역량", "물체를 밀거나 당길 때 작용하며 물체의 모양이나 운동 상태를 변화시킬 수 있다.", "피곤하지 않은 상태", "다른 사람에게 미치는 영향력"], "a": 1, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘의 단위로 옳은 것은?", "opts": ["kg", "m", "N(뉴턴)", "℃"], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "다음 중 과학적 의미의 힘이 작용한 경우는?", "opts": ["아는 것이 힘이다.", "공부하니 힘들었다.", "책상을 밀었다.", "격려가 힘이 된다."], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘에 의해 주로 물체의 모양이 변한 예는?", "opts": ["수레를 밀었다.", "고무줄을 당겼다.", "농구공을 던졌다.", "창문을 밀어 열었다."], "a": 1, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘에 의해 주로 운동 상태가 변한 예는?", "opts": ["색종이를 접었다.", "밀가루 반죽을 눌렀다.", "수레를 밀었다.", "고무줄을 당겼다."], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘에 의해 모양과 운동 상태가 모두 변할 수 있는 예는?", "opts": ["책을 읽었다.", "물이 얼었다.", "테니스공을 쳤다.", "종이를 접었다."], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "다음 중 힘의 작용으로 보기 어려운 것은?", "opts": ["대리석을 깼다.", "수레를 밀었다.", "물이 얼었다.", "테니스공을 쳤다."], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘을 측정할 때 사용할 수 있는 도구는?", "opts": ["온도계", "용수철저울 또는 힘 센서", "초시계", "눈금실린더"], "a": 1, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "‘책을 들어 옮겼다.’에서 힘은 과학적 의미의 힘인가?", "opts": ["그렇다.", "아니다.", "상황에 따라 항상 다르다.", "판단할 수 없다."], "a": 0, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "야구공을 잡을 때 힘의 주요 효과는?", "opts": ["공의 온도가 변한다.", "공의 운동 상태가 변한다.", "공이 녹는다.", "공의 질량이 변한다."], "a": 1, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}],TN=["🔥 불팀","💧 물팀","🌱 풀팀","⚡ 번개팀"];let qs=DEFAULT,room="",qi=0,sel=null,team=0,sid=localStorage.fg_sid||crypto.randomUUID();localStorage.fg_sid=sid;
const sh=id=>$(id).classList.remove("hide"),hi=id=>$(id).classList.add("hide");$("qjson").value=JSON.stringify(DEFAULT,null,2);
$("tb").onclick=()=>{hi("home");sh("ts")};$("sb").onclick=()=>{hi("home");sh("sj")};
$("mk").onclick=async()=>{try{qs=JSON.parse($("qjson").value)}catch(e){return alert("문제 JSON 형식을 확인하세요.")}room=String(Math.floor(100000+Math.random()*900000));await setDoc(doc(db,"live_games",room),{room,name:$("gn").value,questions:qs,qIndex:0,revealed:false,active:true,createdAt:serverTimestamp()});hi("ts");sh("tl");$("rc").textContent=room;let u=location.href.split("?")[0]+"?room="+room;$("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+encodeURIComponent(u);renderT();setInterval(stats,1200)};
function renderT(){let x=qs[qi];$("qn").textContent=`${qi+1} / ${qs.length}`;$("tq").textContent=x.q;$("to").innerHTML=x.opts.map((o,i)=>`<div class="option">${i+1}. ${o}</div>`).join("")}
async function stats(){let s=await getDocs(collection(db,"live_game_scores")),d=s.docs.map(x=>x.data()).filter(x=>String(x.room)===room),score=TN.map((_,i)=>d.filter(x=>x.team===i&&x.correct).length);let mx=Math.max(1,...score);$("teams").innerHTML=TN.map((n,i)=>`<div class="team"><b>${n}</b><div class="stat">${score[i]}</div><div class="track"><div class="runner" style="width:${100*score[i]/mx}%"></div></div></div>`).join("");let cur=d.filter(x=>x.qIndex===qi);$("gs").textContent=`현재 문제 제출 ${cur.length}명 · 정답 ${cur.filter(x=>x.correct).length}명`}
$("rv").onclick=()=>setDoc(doc(db,"live_games",room),{revealed:true},{merge:true});$("nx").onclick=async()=>{if(qi<qs.length-1)qi++;await setDoc(doc(db,"live_games",room),{qIndex:qi,revealed:false},{merge:true});renderT()};
$("join").onclick=async()=>{room=$("jr").value.trim();let s=await getDoc(doc(db,"live_games",room));if(!s.exists())return $("jm").textContent="게임방을 찾을 수 없습니다.";qs=s.data().questions;let joins=await getDocs(collection(db,"live_game_players")),n=joins.docs.map(x=>x.data()).filter(x=>String(x.room)===room).length;team=n%4;await setDoc(doc(db,"live_game_players",room+"_"+sid),{room,sid,team,joinedAt:serverTimestamp()});hi("sj");sh("sl");$("myteam").textContent=TN[team];onSnapshot(doc(db,"live_games",room),x=>{let d=x.data();qi=d.qIndex||0;renderS(d.revealed)})};
function renderS(rev){let x=qs[qi];sel=null;$("sqn").textContent=`${qi+1} / ${qs.length}`;$("sq").textContent=x.q;$("so").innerHTML=x.opts.map((o,i)=>`<button class="option" data-i="${i}">${i+1}. ${o}</button>`).join("");$("so").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;$("so").querySelectorAll("button").forEach(z=>z.classList.remove("sel"));b.classList.add("sel")});$("sm").textContent="";hi("res");if(rev)showRes()}
$("sub").onclick=async()=>{if(sel===null)return $("sm").textContent="답을 선택하세요.";let x=qs[qi],correct=sel===x.a;await setDoc(doc(db,"live_game_scores",room+"_"+sid+"_"+qi),{room,sid,team,qIndex:qi,answer:sel,correct,submittedAt:serverTimestamp()});localStorage.setItem("fg_"+room+"_"+qi,JSON.stringify({correct,answer:sel}));$("sm").innerHTML='<span class="ok">제출 완료! 팀을 응원하세요 🎉</span>'};
function showRes(){let r=localStorage.getItem("fg_"+room+"_"+qi);if(!r)return;r=JSON.parse(r);let x=qs[qi];sh("res");$("res").innerHTML=r.correct?'<h2 class="ok">정답! +1 팀 포인트 🎉</h2>':`<h2>아쉽지만 괜찮아요!</h2><div>정답은 ${x.a+1}번 ${x.opts[x.a]}</div><div class="muted">${x.exp||""}</div>`}
let p=new URLSearchParams(location.search);if(p.get("room")){hi("home");sh("sj");$("jr").value=p.get("room")}
</script></body></html>
