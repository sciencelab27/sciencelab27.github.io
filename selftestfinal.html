<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스스로 채점 형성평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0EE;--paper:#FFFFFF;--ink:#1C2B2A;--muted:#5E6D6B;--line:#D3DDDA;--line2:#E6ECEA;
  --pick:#2D5BD7;--pick-soft:#E6ECFC;--red:#D62839;--red-soft:#FCE4E7;--ok:#24834F;--ok-soft:#E1F3E8;--chip:#F2F6F5;--hl:#FFF1A8;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A19;--paper:#1B2524;--ink:#E5EDEB;--muted:#9DB0AC;--line:#2E3D3B;--line2:#25312F;
  --pick:#86A6FF;--pick-soft:#1F2B4A;--red:#FF6B78;--red-soft:#3B1F25;--ok:#5BD08F;--ok-soft:#173326;--chip:#212D2B;--hl:#4F4512;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A19;--paper:#1B2524;--ink:#E5EDEB;--muted:#9DB0AC;--line:#2E3D3B;--line2:#25312F;
  --pick:#86A6FF;--pick-soft:#1F2B4A;--red:#FF6B78;--red-soft:#3B1F25;--ok:#5BD08F;--ok-soft:#173326;--chip:#212D2B;--hl:#4F4512;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.pen{font-family:"Nanum Pen Script","Gowun Dodum",cursive}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:14px 20px 40px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;min-height:52px}
.brand{font-size:36px;line-height:1;color:var(--red);cursor:pointer;background:none;border:0;padding:0}
.crumb{color:var(--muted);font-size:15px}
.top .sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;min-height:48px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
a.btn.blue{color:#fff}
.btn.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.blue{background:var(--pick);color:#fff;border-color:var(--pick)}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px;border-radius:10px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:var(--red)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* home */
.home h1{font-size:26px;margin:4px 0 4px;font-weight:400}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.qitem{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 22px;cursor:pointer;display:grid;gap:4px;min-height:140px}
.qitem:hover{border-color:var(--ink)}
.qitem .u{font-size:14px;color:var(--muted)}
.qitem .t{font-size:22px}
.qitem .m{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:15px}
.qitem .last{font-size:28px;color:var(--red);line-height:1}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

/* start */
.start{max-width:760px;margin:20px auto}
.start h2{font-size:28px;font-weight:400;margin:0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.mode:hover{border-color:var(--pick)}
.mode b{display:block;font-size:20px;font-weight:400;margin-bottom:4px}
.mode span{color:var(--muted);font-size:15px}

/* quiz */
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:15px;display:grid;place-items:center;padding:0;position:relative}
.dot.on{border-color:var(--ink);border-width:2.5px}
.dot.ans{background:var(--pick-soft);border-color:var(--pick)}
.dot.right{background:var(--ok-soft);border-color:var(--ok)}
.dot.wrong{background:var(--red-soft);border-color:var(--red)}
.qwrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.qwrap{grid-template-columns:1fr}}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.topic{display:inline-block;font-size:13.5px;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 12px;margin-bottom:10px}
.stem{font-size:19px;margin:0}
.stem .no{font-size:30px;color:var(--ink);margin-right:6px;line-height:1}
.fig{margin:16px 0 4px;text-align:center;background:#fff;border-radius:10px;padding:8px}
.fig img{max-height:340px;width:auto;max-width:100%}
.box{margin-top:14px;border:1.5px solid var(--ink);border-radius:10px;padding:12px 16px 10px;position:relative}
.box .bl{position:absolute;top:-12px;left:14px;background:var(--paper);padding:0 6px;font-size:14px}
.box p{margin:2px 0}
.choices{display:grid;gap:8px}
.ch{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;min-height:58px;width:100%}
.ch:hover{border-color:var(--pick)}
.ch .n{font-size:22px;color:var(--muted);text-align:center}
.ch.sel{border-color:var(--pick);background:var(--pick-soft)}
.ch.sel .n{color:var(--pick)}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--red);background:var(--red-soft)}
.ch[disabled]{cursor:default}
.ch .tag{font-size:13px;color:var(--muted)}
.cc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc span small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.short{display:grid;gap:8px}
.short input{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:18px;min-height:54px}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;background:var(--chip);display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.fb .mk svg,.mk svg{width:48px;height:48px;fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fb h3{margin:0 0 4px;font-size:18px;font-weight:400}
.fb p{margin:4px 0}
.fb .mine{background:var(--hl);border-radius:6px;padding:2px 6px;color:var(--ink)}
.warnline{color:var(--red);font-size:15px}

/* result */
.res-head{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.score{position:relative;display:inline-grid;place-items:center;width:170px;height:130px}
.score svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round}
.score .v{font-size:64px;color:var(--red);line-height:1}
.score .v small{font-size:32px}
.res-msg{font-size:22px}
.rlist{display:grid;gap:10px;margin-top:20px}
.ritem{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:grid;grid-template-columns:56px 1fr;gap:12px}
.ritem .mk svg{width:44px;height:44px}
.ritem .q{margin:0 0 6px}
.ritem .q b{font-weight:400;font-size:24px}
.ans-line{display:flex;gap:16px;flex-wrap:wrap;font-size:15.5px}
.ans-line span{background:var(--chip);border-radius:8px;padding:2px 10px}
.exp{margin:8px 0 0;font-size:16px}
details summary{cursor:pointer;color:var(--muted);font-size:15px;margin-top:6px}

/* teacher */
.tpanel{display:grid;gap:14px}
.tlist{display:grid;gap:8px}
.trow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line2);border-radius:12px}
.trow .t{margin-right:auto}
.drop{border:2px dashed var(--line);border-radius:14px;padding:16px;display:grid;gap:8px}
.drop h3{margin:0;font-size:18px;font-weight:400}
.files{display:flex;gap:6px;flex-wrap:wrap}
.files span{background:var(--chip);border-radius:8px;padding:2px 4px 2px 10px;font-size:14px;display:inline-flex;align-items:center;gap:2px}
.files .x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;width:32px;height:32px;border-radius:8px}
.files .x:hover{color:var(--red);background:var(--paper)}
textarea,.tf input,.tf select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:15.5px}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.eq{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;background:var(--paper)}
.eq.bad{border-color:var(--red)}
.prob:empty{display:none}
.eq h4{margin:0;font-size:18px;font-weight:400;display:flex;gap:10px;align-items:center}
.tf{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.tf > span{color:var(--muted)}
.chrow{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center}
.chrow .n{text-align:center;font-size:18px}
.figbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.figbox img{max-height:110px;border:1px solid var(--line);border-radius:8px;background:#fff}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 24px rgba(0,0,0,.08)}
/* paper */
.ptools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.tool{border:0;background:none;border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;color:var(--muted)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ptools .sp{margin-left:auto}
.ptools .hintx{font-size:14px;color:var(--muted);padding:0 6px}
.fit{position:relative;margin:0 auto 18px}
.sheet{width:900px;background:#fff;color:#1b1b1b;transform-origin:0 0;position:absolute;left:0;top:0;padding:34px 40px 46px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 12px 32px rgba(0,0,0,.1);font-family:"Noto Serif KR","AppleMyungjo","Batang",serif;font-size:15.5px;line-height:1.75;color-scheme:light}
.sh-head{border:2px solid #222;display:grid;grid-template-columns:1fr 170px}
.sh-head .l{padding:10px 18px 12px;border-right:1px solid #222}
.sh-unit{font-size:14px;color:#333}
.sh-title{font-size:27px;font-weight:700;letter-spacing:-.5px;line-height:1.3;margin-top:2px}
.sh-who{display:flex;gap:4px;align-items:flex-end;font-size:14px;margin-top:8px;flex-wrap:wrap}
.sh-who input{border:0;border-bottom:1px solid #222;width:46px;text-align:center;font-family:"Nanum Pen Script",cursive;font-size:25px;line-height:1;color:#3a3a46;background:transparent;padding:0 2px;border-radius:0}
.sh-who input.nm{width:130px}
.sh-score{display:grid;place-items:center;position:relative;color:#D62839}
.sh-score .lbl{position:absolute;top:6px;left:10px;font-size:12px;color:#777;font-family:"Gowun Dodum",sans-serif}
.sh-score .v{font-family:"Nanum Pen Script",cursive;font-size:62px;line-height:1;position:relative;z-index:1}
.sh-score .v small{font-size:32px}
.sh-score svg{position:absolute;width:140px;height:100px;fill:none;stroke:#D62839;stroke-width:2.4;stroke-linecap:round;overflow:visible}
.sh-score .ring{position:absolute;inset:0;display:grid;place-items:center}
.sh-score.has-first .ring,.sh-score.has-first .v{transform:translateY(-11px)}
.sh-score.has-first .ring svg{width:122px;height:84px}
.sh-score .first{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-family:"Nanum Pen Script",cursive;font-size:21px;line-height:1;color:#D62839;white-space:nowrap}
.sh-score .wip{font-family:"Gowun Dodum",sans-serif;font-size:13px;color:#777;transform:translateY(-8px)}
.sh-log{margin-top:10px;border-top:2px solid #222;padding-top:10px;font-family:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;font-size:14px;color:#333}
.sh-log .lt{font-weight:700;margin-bottom:4px;font-size:15px}
.sh-log table{border-collapse:collapse;width:100%}
.sh-log td{border-bottom:1px solid #e3e3e3;padding:4px 8px 4px 0;vertical-align:top}
.sh-log td.sc{font-family:"Nanum Pen Script",cursive;font-size:22px;color:#D62839;white-space:nowrap;line-height:1.1}
.sh-log td.w{color:#777;white-space:nowrap;text-align:right}
.sh-log p{margin:8px 0 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh-log .used{color:#D62839}
.sh-log .aft{color:#8a8a8a}
.gm.after svg{opacity:.38}
.aftertag{position:relative;display:inline-block;vertical-align:1px;margin:0 6px 0 8px;border:1px dashed #c2626d;border-radius:999px;padding:1px 7px;white-space:nowrap;font-family:"Nanum Pen Script",cursive;font-size:18px;color:#c2626d;line-height:1;pointer-events:none}
.sh-cols{column-count:2;column-gap:44px;column-rule:1px solid #cfcfcf;margin-top:24px}
.pq{break-inside:avoid;margin:0 0 28px;position:relative}
.pq .tg{font-size:12.5px;color:#444;border:1px solid #777;padding:0 7px;display:inline-block;margin-bottom:6px;font-family:"Gowun Dodum",sans-serif}
.pq .st{margin:0}
.pq .num{font-weight:700;position:relative;display:inline-block;margin-right:4px}
.gm{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-33px 0 0 -31px;cursor:pointer;z-index:2;border:0;background:none;padding:0;display:block;font:inherit}
.gm svg{width:100%;height:100%;fill:none;stroke:#D62839;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.pexp{margin:12px 0 0;border:1.5px solid #D62839;border-radius:4px 14px 14px 14px;padding:8px 12px 6px;font-family:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;font-size:14.5px;line-height:1.6;color:#2a2a2a;background:#fff7f8}
.pexp .h{font-family:"Nanum Pen Script",cursive;font-size:25px;line-height:1.1;color:#D62839;margin-bottom:2px}
.pexp p{margin:3px 0}
.pexp b{color:#D62839;font-weight:400}
.gm.soft{position:relative;display:inline-block;vertical-align:2px;width:auto;height:auto;margin:0 6px 0 6px;left:auto;top:auto;font-family:"Nanum Pen Script",cursive;font-size:22px;line-height:1;color:#2D5BD7;border:1.5px dashed #2D5BD7;border-radius:999px;padding:2px 8px;background:#fff;white-space:nowrap}
.gm:focus-visible{outline:2px solid #2D5BD7;border-radius:50%}
.pfig{text-align:center;margin:10px 0 6px}
.pfig img{max-width:100%;max-height:290px}
.pbox{border:1px solid #333;padding:10px 14px 6px;margin:10px 0 6px;position:relative}
.pbox .bl{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#fff;padding:0 8px;font-size:13px}
.pbox p{margin:0 0 2px}
.pch{display:grid;gap:2px 10px;margin-top:8px}
.pch.g3{grid-template-columns:repeat(3,auto);justify-content:start;column-gap:34px}
.pc{all:unset;cursor:pointer;display:flex;gap:6px;align-items:flex-start;padding:2px 4px;border-radius:6px;position:relative}
.pc:hover:not([disabled]){background:#f2f5fb}
.pc:focus-visible{outline:2px solid #2D5BD7}
.cn{position:relative;display:inline-block;min-width:1.15em;text-align:center}
svg.circ{position:absolute;left:50%;top:50%;width:2.5em;height:2.2em;transform:translate(-50%,-52%);fill:none;stroke:#3a3a46;stroke-width:1.8;stroke-linecap:round;overflow:visible;pointer-events:none}
svg.circ.red{stroke:#D62839;stroke-width:2.4;width:2.9em;height:2.5em}
table.pt{border-collapse:collapse;margin-top:8px;width:100%;font-size:15px}
table.pt th,table.pt td{border:1px solid #444;padding:3px 8px;text-align:center;font-weight:400}
table.pt th{background:#f4f4f4}
table.pt tr.pc-row{cursor:pointer}
table.pt tr.pc-row:hover td{background:#f2f5fb}
.pshort{border:0;border-bottom:1px solid #222;background:transparent;font-family:"Nanum Pen Script",cursive;font-size:26px;color:#3a3a46;width:200px;padding:0 4px;border-radius:0}
.redans{font-family:"Nanum Pen Script",cursive;font-size:26px;color:#D62839;margin-left:8px}
.ink{position:absolute;left:0;top:0;pointer-events:none;touch-action:none;z-index:3}
.ink.on{pointer-events:auto;cursor:crosshair}
.draw path,.draw ellipse{stroke-dasharray:100;stroke-dashoffset:100;animation:drw .5s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes drw{to{stroke-dashoffset:0}}
.draw-fade{opacity:0;animation:fadein .3s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.draw path,.draw ellipse{animation:none;stroke-dashoffset:0}.draw-fade{animation:none;opacity:1}}
.ov{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:20;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.ovc{background:var(--paper);border-radius:18px;max-width:680px;width:100%;max-height:100%;overflow:auto;padding:20px 22px}
.ovc .nt{border-left:4px solid var(--red);padding:4px 0 4px 14px;margin:0 0 18px}
.ovc .nt h3{margin:0;font-family:"Nanum Pen Script",cursive;font-weight:400;font-size:30px;color:var(--red);line-height:1.1}
.ovc .nt p{margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;font-size:15px;z-index:10}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app"></main>

<script type="application/json" id="quiz-data">{"quizzes": [{"id": "qzhzl9exrk", "title": "힘을 표현과 평형", "unit": "Ⅴ. 힘의 작용 형성 평가", "questions": [{"id": "q313oub36", "no": "1", "topic": "힘", "type": "mc", "stem": "밑줄 친 힘이 과학에서 말하는 힘을 의미하는 것은?", "box": [], "choiceCols": [], "choices": ["아는 것이 힘이다.", "왕에게는 막강한 힘이 있다.", "점심을 굶었더니 힘이 없다.", "배구공을 손으로 힘주어 쳤다.", "책을 읽으며 생각하는 힘을 키운다."], "answer": 4, "accept": [], "explanation": "배구공을 세게 치면 배구공의 모양과 운동 상태가 모두 변해요. 그래서 과학에서 말하는 힘이 작용한 예시예요. 나머지는 일상에서 능력이나 기운을 뜻하는 말로 쓴 거예요.", "choiceNotes": ["여기서 힘은 지식의 가치를 비유하는 말이에요. 물체의 모양이나 운동 상태를 바꾸는 과학적인 힘이 아니에요.", "왕의 힘은 권력을 뜻해요. 과학에서 말하는 힘과는 달라요.", "기운이나 체력을 뜻하는 일상적인 표현이에요. 물체에 작용하는 힘이 아니에요.", "맞아요! 손이 배구공에 힘을 작용해서 공의 모양과 운동 상태가 변해요.", "생각하는 능력을 뜻하는 말이에요. 과학에서 말하는 힘이 아니에요."], "img": null}, {"id": "q4sqwzir1", "no": "2", "topic": "힘", "type": "mc", "stem": "학생들이 힘에 대하여 설명하고 있다. 이 중 잘못된 생각을 가지고 있는 사람은?", "box": [], "choiceCols": [], "choices": ["지윤: 힘에 의해 물체의 운동 방향이 변해.", "은영: 물체에 힘이 작용하면 물체의 빠르기가 변할 수 있어.", "민영: 힘은 물체의 모양을 변화시키기도 해.", "민수: 힘의 단위는 kg(킬로그램)이야.", "연우: 힘은 물체의 모양과 운동 상태를 동시에 변화시킬 수 있어."], "answer": 4, "accept": [], "explanation": "힘의 단위는 N(뉴턴)이에요. kg(킬로그램)은 질량의 단위라서 힘의 단위로 쓰지 않아요.", "choiceNotes": ["맞는 설명이에요. 힘은 물체의 운동 방향을 바꿀 수 있어요.", "맞는 설명이에요. 힘을 받으면 물체의 속력이 변할 수 있어요.", "맞는 설명이에요. 힘은 물체의 모양을 변하게 해요.", "정답이에요! 힘의 단위는 N(뉴턴)이고, kg은 질량의 단위예요.", "맞는 설명이에요. 배구공을 칠 때처럼 모양과 운동 상태가 동시에 변할 수 있어요."], "img": null}, {"id": "qxnllazmr", "no": "3", "topic": "힘", "type": "mc", "stem": "다음 중 물체에 힘을 작용하였을 때 일어나는 현상이 아닌 것은?", "box": [], "choiceCols": [], "choices": ["고무줄의 길이가 점점 늘어났다.", "자동차의 속력이 점점 증가하였다.", "날아오는 축구공을 헤딩하여 방향을 바꾸었다.", "막대자석을 지우개에 가까이 했더니 지우개가 가만히 있었다.", "책상 위에서 책을 밀었더니 책이 조금 움직이다가 정지하였다."], "answer": 4, "accept": [], "explanation": "물체가 힘을 받으면 모양이 변하거나 속력이나 운동 방향이 바뀌어요. 지우개는 자석에 힘을 받지 않아서 아무 변화 없이 가만히 있는 거예요.", "choiceNotes": ["고무줄이 늘어난 것은 모양이 변한 것이라 힘의 작용 결과예요.", "속력이 변했으니 힘이 작용한 결과예요.", "운동 방향이 바뀐 것이라 힘의 작용 결과예요.", "정답이에요! 지우개는 자석에 힘을 받지 않아 변화가 없었어요.", "책이 움직이다 멈춘 것은 운동 상태가 변한 것이에요. 밀기와 마찰력 같은 힘의 작용 결과예요."], "img": null}, {"id": "qj020txva", "no": "4", "topic": "힘", "type": "mc", "stem": "과학에서 말하는 힘의 작용에 의해 나타나는 현상으로 옳은 것을 보기에서 모두 고른 것은?", "box": ["ㄱ. 물이 얼어서 얼음이 되었다.", "ㄴ. 달리던 자동차가 멈춰 섰다.", "ㄷ. 물을 끓였더니 수증기가 되었다.", "ㄹ. 빗면 위에 놓은 공이 굴러 내려갔다."], "choiceCols": [], "choices": ["ㄱ, ㄴ", "ㄱ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], "answer": 4, "accept": [], "explanation": "물이 얼음이나 수증기로 바뀌는 것은 물의 상태 변화예요. 힘의 작용과는 관계없어요. 자동차가 멈추거나 공이 굴러 내려가는 것은 운동 상태가 변한 것이라 힘의 작용 때문이에요.", "choiceNotes": ["ㄱ은 상태 변화예요. 힘 때문에 생긴 현상이 아니에요.", "ㄱ은 상태 변화라서 힘의 작용과 관계없어요.", "ㄷ은 물이 수증기로 되는 상태 변화예요. 힘의 작용이 아니에요.", "정답이에요! ㄴ과 ㄹ은 운동 상태가 변하는 현상이라 힘이 작용한 거예요.", "ㄷ은 상태 변화라서 힘의 작용과 관계없어요."], "img": null}, {"id": "q7snualik", "no": "5", "topic": "힘의 표현", "type": "mc", "stem": "그림과 같은 화살표를 이용하여 힘을 나타냈다. 이때 힘의 방향과 크기를 옳게 짝 지은 것은? (단, 1 cm는 5 N의 힘을 의미한다.)", "box": [], "choiceCols": ["힘의 방향", "힘의 크기"], "choices": [["북동쪽", "5 N"], ["북동쪽", "25 N"], ["남서쪽", "25 N"], ["남서쪽", "5 N"], ["남쪽", "5 N"]], "answer": 3, "accept": [], "explanation": "화살표가 남서쪽을 가리키고 있으므로 힘의 방향은 남서쪽이에요. 1 cm가 5 N이고 화살표 길이가 5 cm이므로 힘의 크기는 25 N이에요.", "choiceNotes": ["화살표가 가리키는 방향은 북동쪽이 아니라 남서쪽이에요. 크기도 다시 계산해 봐요.", "크기는 맞지만 방향이 달라요. 화살표는 남서쪽을 가리켜요.", "정답이에요! 방향은 남서쪽이고 5 cm × 5 N = 25 N이에요.", "방향은 맞지만 크기가 틀렸어요. 화살표 길이 5 cm에 5 N을 곱해야 해요.", "방향도 크기도 맞지 않아요. 화살표의 방향과 길이를 다시 확인해 봐요."], "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCsAAANDCAYAAACEy5XoAAAQAElEQVR4AeydB2BUVfbGvxd67wiioCIodlSaSpPeBVfdYtddddVdXaUI0gVprrrqf91V1+4qq/Tee+9deu8lCelt/ve74YVJSCCBSTLlG+e8d++557bfI+PcM7eEefQSAREQAREQAREQAREQAREQAREQAREIdgIB1b8w6CUCIiACIiACIiACIiACIiACIiACInAZBJQltwjIWZFbZFWuCIiACIiACIiACIiACIiACIhAzgkohwgYAnJWGAh6i4AIiIAIiIAIiIAIiIAIiEAwE1DfRCDQCMhZEWhPTO0VAREQAREQAREQAREQARHwBwJqgwiIQC4SkLMiF+GqaBEQAREQAREQAREQAREQgZwQkK0IiIAIpBKQsyKVg64iIAIiIAIiIAIiIAIiEJwE1CsREAERCEACclYE4ENTk0VABERABERABERABPKXgGoXAREQARHIXQJyVuQuX5UuAiIgAiIgAiIgAiKQPQKyEgEREAEREIE0AnJWpKFQQAREQAREQAREQASCjYD6IwIiIAIiIAKBSUDOisB8bmq1CIiACIiACIhAfhFQvSIgAiIgAiIgArlOQM6K , "answer": null, "accept": [], "explanation": "⑴ 질량은 물체의 고유한 양이라 달에 가도 변하지 않으므로 6 kg이에요. 지구에서 6 kg인 물체의 무게는 6 × 9.8 = 58.8 N이고, 달에서는 그 1/6이므로 9.8 N이 돼요.\n⑵ 지구에서의 무게는 달에서의 약 6배예요. 달에서 9.8 N인 (나)를 지구로 가져오면 58.8 N이 되니, 지구에서 9.8 N인 (가)보다 무거워요. 따라서 (나)의 질량이 더 커요. ((가)는 1 kg, (나)는 6 kg)", "choiceNotes": [], "img": null, "parts": [{"label": "⑴", "accept": ["질량 6 kg, 무게 9.8 N", "질량 6kg 무게 9.8N", "질량은 6 kg, 무게는 9.8 N", "질량 6 kg 무게 9.8 N", "6 kg, 9.8 N", "6kg 9.8N", "6kg/9.8N", "질량:6kg, 무게:9.8N"]}, {"label": "⑵", "accept": ["(나)", "나", "물체 (나)", "(나)가 더 크다", "나가 더 크다", "(나)의 질량이 더 크다", "(나)가 크다"]}]}, {"id": "q4", "no": "4", "topic": "중력", "type": "mc", "stem": "무게와 질량에 대한 설명으로 옳은 것은?", "box": [], "choiceCols": [], "choices": ["질량은 중력의 크기이다.", "무게의 단위는 kg을 사용한다.", "용수철저울은 질량을 측정한다.", "지구에서 한 물체의 무게와 질량은 값이 서로 같다.", "한 물체를 지구에서 측정한 질량과 달에서 측정한 질량이 서로 같다."], "answer": 5, "accept": [], "explanation": "무게는 중력의 크기이고 단위는 N이며 용수철저울로 측정해요. 질량은 물체의 고유한 양이라 장소가 바뀌어도 변하지 않아요. 지구에서 질량이 1 kg인 물체의 무게는 약 9.8 N이에요.", "choiceNotes": ["중력의 크기는 질량이 아니라 무게예요.", "무게의 단위는 N(뉴턴)이에요. kg은 질량의 단위예요.", "용수철저울은 무게를 재요. 질량은 양팔저울이나 윗접시저울로 재요.", "지구에서 질량 1 kg인 물체의 무게는 9.8 N이라 값이 달라요.", "맞아요. 질량은 어디에서 재도 변하지 않아요."], "img": null}, {"id": "q5", "no": "5", "topic": "탄성력", "type": "mc", "stem": "다음 중 탄성을 이용하는 예로 적절하지 않은 것은?", "box": [], "choiceCols": [], "choices": ["양팔저울", "트램펄린", "몸 풀기용 고무 띠", "자전거의 안장", "장대높이뛰기"], "answer": 1, "accept": [], "explanation": "탄성은 모양이 변한 물체가 원래 모양으로 돌아가려는 성질이에요. 트램펄린의 용수철, 몸 풀기용 고무 띠, 자전거 안장의 용수철, 장대높이뛰기용 장대는 모두 탄성을 이용해요. 양팔저울은 양쪽 질량을 비교하는 도구라 탄성을 이용하지 않아요.", "choiceNotes": ["맞아요. 양팔저울은 두 물체의 질량을 비교하는 도구로, 탄성을 이용하지 않아요.", "트램펄린은 용수철의 탄성을 이용해요.", "고무 띠는 늘어났다가 돌아오는 탄성을 이용해요.", "자전거 안장 아래 용수철의 탄성이 충격을 줄여 줘요.", "장대가 휘었다가 펴지는 탄성을 이용해요."], "img": null}, {"id": "q6", "no": "6", "topic": "탄성력", "type": "mc", "stem": "동일한 용수철을 사용하여 그림 (가)는 2 cm만큼, 그림 (나)는 4 cm만큼 각각 당긴 모습이고, 그림 (다)는 이 용수철을 2 cm만큼 압축시킨 모습을 나타낸 것이다. 이에 대한 설명으로 옳은 것은?", "box": [], "choiceCols": [], "choices": ["물체에 작용하는 탄성력의 <script>
(() => {
const TEMPLATE = '<!doctype html>\n' + document.documentElement.outerHTML;
let DATA;
try { DATA = JSON.parse(document.getElementById('quiz-data').textContent); } catch (e) { DATA = null; }
if (!DATA || !Array.isArray(DATA.quizzes)) DATA = { quizzes: [] };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const uid = () => Math.random().toString(36).slice(2, 10);
const CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧'];
const MARK = {
  ok: '<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="20" rx="14" ry="13" transform="rotate(-10 20 20)"/></svg>',
  no: '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M11 31 L30 8"/></svg>'
};
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800); }
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const quizById = id => DATA.quizzes.find(q => q.id === id);

/* ---------------- student ---------------- */
let view = 'home';
let sess = null; // {quizId, mode, ids, idx, ans, locked, done}
let submitArmed = false;

function norm(s) { return String(s ?? '').normalize('NFKC').toLowerCase().replace(/\s+/g, '').replace(/[.,·。．、，()（）]/g, ''); }
const hasParts = q => q.type === 'short' && Array.isArray(q.parts) && q.parts.length > 0;
function isEmptyAns(a) { return a == null || a === '' || (Array.isArray(a) && a.every(x => !String(x ?? '').trim())); }
function partOk(p, v) { return (p.accept || []).some(x => norm(x) === norm(v)) && String(v ?? '').trim() !== ''; }
function partsMsg(q, a) {
  if (!hasParts(q) || !Array.isArray(a)) return '';
  const ok = q.parts.filter((p, i) => partOk(p, a[i])).map(p => p.label), no = q.parts.filter((p, i) => !partOk(p, a[i])).map(p => p.label);
  return ok.length ? `${ok.join(', ')}은(는) 맞았어요. ${no.join(', ')}을(를) 다시 생각해 보세요.` : '';
}
function isRight(q, a) {
  if (isEmptyAns(a)) return false;
  if (hasParts(q)) return Array.isArray(a) && q.parts.every((p, i) => partOk(p, a[i]));
  if (q.type === 'short') return (q.accept || []).some(x => norm(x) === norm(a)) || norm(q.answerText) === norm(a);
  return Number(a) === Number(q.answer);
}
const choiceText = c => Array.isArray(c) ? c.join(', ') : (c ?? '');
function ord(q) { const o = sess && sess.order && sess.order[q.id]; return o && o.length === q.choices.length ? o : q.choices.map((_, i) => i + 1); }
function posOf(q, n) { const k = ord(q).indexOf(n); return k < 0 ? n : k + 1; }
function reshuffle(q, lastPick) {
  if (q.type === 'short' || !q.choices || q.choices.length < 3) return;
  const prev = ord(q), N = prev.length;
  const prevAnsPos = prev.indexOf(q.answer), prevPickPos = lastPick ? prev.indexOf(lastPick) : -1;
  let best = null;
  for (let t = 0; t < 40; t++) {
    const o = prev.slice();
    for (let i = N - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    const moved = o.indexOf(q.answer) !== prevAnsPos && (prevPickPos < 0 || o[prevPickPos] !== lastPick);
    const same = o.filter((v, i) => v === prev[i]).length;
    if (moved && same <= 1) { best = o; break; }
    if (moved && !best) best = o;
  }
  sess.order = sess.order || {}; sess.order[q.id] = best || prev.slice().reverse();
}
function answerLabel(q, a) {
  if (isEmptyAns(a)) return '안 풀었음';
  if (hasParts(q)) return q.parts.map((p, i) => `${p.label} ${String((Array.isArray(a) ? a[i] : '') || '').trim() || '(빈칸)'}`).join(', ');
  if (q.type === 'short') return a;
  return CIRC[posOf(q, a) - 1] + ' ' + choiceText(q.choices[a - 1]);
}
function correctLabel(q) { if (hasParts(q)) return q.parts.map(p => `${p.label} ${(p.accept || [])[0] || ''}`).join(', '); return q.type === 'short' ? (q.accept || [])[0] || q.answerText || '' : answerLabel(q, q.answer); }
function saveSess() { if (sess) store.set('sq-sess:' + sess.quizId, sess); }

function startQuiz(id, mode, ids) {
  const qz = quizById(id); if (!qz) return;
  sess = { quizId: id, mode, ids: ids || qz.questions.map(q => q.id), idx: 0, ans: {}, locked: {}, done: false, retry: !!ids, graded: false, fixed: {}, strokes: [], attempt: 1 };
  ptool = 'select'; noteIds = null;
  view = 'quiz'; submitArmed = false; saveSess(); render(); scrollTo(0, 0);

        choiceCols: Array.isArray(x.choiceCols) ? x.choiceCols.map(String) : [], choices,
        answer: type === 'mc' ? parseAns(x.answer, choices) : null,
        accept: Array.isArray(x.accept) ? x.accept.map(String).filter(Boolean) : [],

function problems(q) {
  const p = [];
  if (!q.stem.trim()) p.push('문제 문장이 비어 있어요');
  if (q.type === 'mc') { if (!q.answer) p.push('정답이 정해지지 않았어요'); if (q.choices.length < 2) p.push('선택지가 부족해요'); }
  else if (hasParts(q)) { if (q.parts.some(pp => !(pp.accept || []).length)) p.push('답 칸마다 인정할 답이 있어야 해요'); }
  else if (!q.accept.length) p.push('인정할 답이 없어요');
  if (!q.explanation.trim()) p.push('해설이 비어 있어요');
  return p;
}

    case 'pretry': qs.forEach(q => { if (isRight(q, sess.ans[q.id])) sess.fixed[q.id] = true; else { if (!revealed(q)) reshuffle(q, sess.ans[q.id]); delete sess.ans[q.id]; } }); sess.graded = false; sess.done = false; sess.attempt = (sess.attempt || 1) + 1; noteIds = null; const hadInk = (sess.strokes || []).length > 0; sess.strokes = []; ptool = 'select'; saveSess(); render(); toast(`틀린 문제만 다시 풀어 보세요. 선택지 순서가 바뀌었어요.${hadInk ? ' 낙서는 깨끗이 지웠어요.' : ''}`); break;
    case 'pagain': startQuiz(sess.quizId, 'paper'); break;
    case 'note': noteIds = [t.dataset.id]; render(); break;
    case 'pnotes': noteIds = qs.filter(q => !isRight(q, sess.ans[q.id]) && revealed(q)).map(q => q.id); render(); break;
    case 'preveal': if (!pArmed.reveal) { pArmed.reveal = true; render(); break; } pArmed.reveal = false; sess.revealAll = true; sess.log = sess.log || []; sess.log.push({ t: 'v', at: Date.now(), r: sess.log.filter(x => x.t === 'g').length }); saveSess(); render(); break;
    case 'rreveal': if (!pArmed.rreveal) { pArmed.rreveal = true; render(); break; } pArmed.rreveal = false; sess.revealAll = true; saveSess(); render(); break;
    case 'ovClose': noteIds = null; imgView = null; imgCanvas = null; render(); break;
    case 'pimg': savePaperImage(); break;
    case 'pdl': downloadImage(); break;
    case 'pshare': shareImage(); break;
    case 'sumCopy': copySummary(); break;
    case 'sumSave': if (dl && sumImg) dl.save({ filename: imgName().replace(/\.png$/, '_점수요약.png'), data: uriToBlob(sumImg) }).then(() => toast('점수 요약표를 저장했어요.')).catch(() => {}); break;
    case 'sumShare': if (sumImg) navigator.share({ files: [new File([uriToBlob(sumImg)], imgName().replace(/\.png$/, '_점수요약.png'), { type: 'image/png' })] }).catch(e => { if (!e || e.name !== 'AbortError') toast("점수 요약표를 길게 눌러 '이미지 저장'을 골라 주세요."); }); break;
    case 'ppdf': savePdf(); break;
    case 'padAdd': padDraft = (padDraft || (DATA.padlets || []).map(x => ({ ...x }))); padDraft.push({ ban: '', url: '' }); render(); break;
    case 'padDel': padDraft = (padDraft || (DATA.padlets || []).map(x => ({ ...x }))); padDraft.splice(+t.dataset.i, 1); render(); break;
    case 'padSave': { const bad = (padDraft || []).filter(x => x.url.trim() && !cleanPads([x]).length); if (bad.length) { toast('패들렛 주소는 https://padlet.com/ 으로 시작해야 해요.'); break; } publish(DATA.quizzes, '패들렛 주소를 저장했습니다.'); break; }
    /* teacher */
    case 'teacher': view = 'teacher'; tStep = 'list'; render(); scrollTo(0, 0); break;
    case 'tList': tStep = 'list'; tErr = ''; if (!busy) tMsg = ''; render(); break;
    case 'tHtml': {
      try {
        const doc = new DOMParser().parseFromString(TEMPLATE, 'text/html');
        doc.getElementById('quiz-data').textContent = JSON.stringify({ quizzes: DATA.quizzes, padlets: cleanPads(DATA.padlets || []) }).replace(/</g, '\\u003c');
        const html = '<!doctype html>\n' + doc.documentElement.outerHTML;
        if (dl) { dl.save({ filename: 'index.html', data: new Blob([html], { type: 'text/html' }) }).then(() => toast('index.html 파일을 내려받았어요.')).catch(e => { if (!e || e.code !== 'declined') toast('내려받지 못했어요. 다시 눌러 주세요.'); }); }
        else toast('여기서는 내려받을 수 없어요. 클로드에 로그인해서 열어 주세요.');
      } catch (e) { toast('파일을 만들지 못했어요.'); }
      break;
    }
    case 'tNew': tStep = 'import'; tErr = ''; tMsg = ''; render(); break;
    case 'tResume': tStep = 'edit'; render(); break;
    case 'tDiscard': draft = null; store.del('sq-draft'); render(); break;
    case 'tBlank': draft = { id: 'qz' + uid(), title: '새 형성평가', unit: '', questions: [blankQ(1)], isNew: true, spare: [] }; saveDraft(); tStep = 'edit'; tMsg = ''; render(); break;
    case 'tGen': generate(); break;
    case 'impDel': { if (busy) break; const arr = imp[t.dataset.which]; if (arr) { arr.splice(+t.dataset.i, 1); render(); } break; }
    case 'tEdit': { const qz = quizById(t.dataset.id); if (!qz) break; draft = JSON.parse(JSON.stringify(qz)); draft.isNew = false; draft.spare = []; draft.questions.forEach(q => { q.choiceNotes = q.choices.map((_, k) => (q.choiceNotes || [])[k] || ''); q.accept = q.accept || []; q.box = q.box || []; q.choiceCols = q.choiceCols || []; }); saveDraft(); tStep = 'edit'; tMsg = ''; tErr = ''; render(); scrollTo(0, 0); break; }
    case 'tDel': { const id = t.dataset.id; if (!tArmed[id]) { tArmed[id] = true; render(); break; } publish(DATA.quizzes.filter(q => q.id !== id), '형성평가를 내렸습니다.'); break; }
    case 'tPublish': {
      const badI = draft.questions.findIndex(q => problems(q).length);
      if (badI >= 0) { const el = document.getElementById('eq' + badI); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); toast(`${draft.questions[badI].no}번을 먼저 확인해 주세요: ${problems(draft.questions[badI]).join(', ')}`); break; }
      const clean = cleanQuiz(draft);
      const exists = DATA.quizzes.some(q => q.id === clean.id);
      const next = exists ? DATA.quizzes.map(q => q.id === clean.id ? clean : q) : [clean, ...DATA.quizzes];
      publish(next, exists ? '고친 내용을 올렸습니다.' : '학생 화면에 올렸습니다.'); break;
    }
    case 'eAddQ': draft.questions.push(blankQ(draft.questions.length + 1)); saveDraft(); render(); break;
    case 'eDelQ': { const qi = +t.dataset.q; if (!tArmed['q' + qi]) { tArmed['q' + qi] = true; render(); break; } draft.questions.splice(qi, 1); delete tArmed['q' + qi]; saveDraft(); render(); break; }
    case 'ePartAdd': { const q = draft.questions[+t.dataset.q]; const L = ['⑴','⑵','⑶','⑷','⑸','⑹']; if (!hasParts(q)) q.parts = [{ label: '⑴', accept: q.accept.slice() }, { label: '⑵', accept: [] }]; else q.parts.push({ label: L[q.parts.length] || `(${q.parts.length + 1})`, accept: [] }); saveDraft(); render(); break; }
    case 'ePartDel': { const q = draft.questions[+t.dataset.q]; if (hasParts(q)) { q.parts.pop(); if (q.parts.length < 2) { q.accept = (q.parts[0] && q.parts[0].accept) || q.accept; delete q.parts; } } saveDraft(); render(); break; }
    case 'eAddCh': { const q = draft.questions[+t.dataset.q]; q.choices.push(q.choiceCols.length ? q.choiceCols.map(() => '') : ''); q.choiceNotes.push(''); saveDraft(); render(); break; }
    case 'eDelCh': { const q = draft.questions[+t.dataset.q]; q.choices.pop(); q.choiceNotes.pop(); if (q.answer > q.choices.length) q.answer = null; saveDraft(); render(); break; }
    case 'eNoImg': draft.questions[+t.dataset.q].img = null; saveDraft(); render(); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pad) { padDraft = padDraft || (DATA.padlets || []).map(x => ({ ...x })); const x = padDraft[+t.dataset.i]; if (x) x[t.dataset.pad] = t.value; const b = document.querySelector('[data-act="padSave"]'); if (b && !busy) b.disabled = false; return; }
  if (t.dataset.who) { const w = store.get('sq-who') || {}; w[t.dataset.who] = t.value; store.set('sq-who', w); refreshSummary(); return; }
  if (t.dataset.pshort) { setAns(t.dataset.pshort, t.dataset.part, t.value); saveSess(); return; }
  if (t.dataset.short) { const id = t.dataset.short; setAns(id, t.dataset.part, t.value); if (sess.hint && sess.hint[id] != null && JSON.stringify(sess.hint[id]) !== JSON.stringify(sess.ans[id])) { delete sess.hint[id]; const hb = document.getElementById('hintBox'); if (hb) hb.remove(); } saveSess(); const b = document.querySelector('[data-act="check"]'); if (b) b.disabled = isEmptyAns(sess.ans[id]); return; }
  if (t.dataset.imp) { imp[t.dataset.imp] = t.value; const b = document.querySelector('[data-act="tGen"]'); if (b && !busy) b.disabled = !(aiOk() && imp.sheet.length && (imp.key.length || imp.keyText.trim())); return; }
  if (t.dataset.dt) { draft[t.dataset.dt] = t.value; saveDraft(); return; }
  if (t.dataset.q == null || !draft) return;
  const q = draft.questions[+t.dataset.q]; if (!q) return;
  if (t.dataset.ch != null) { const ci = +t.dataset.ch; q.choices[ci] = q.choiceCols.length ? t.value.split('|').map(s => s.trim()) : t.value; }
  else if (t.dataset.cn != null) q.choiceNotes[+t.dataset.cn] = t.value;
  else if (t.dataset.f === 'box') q.box = t.value.split('\n');
  else if (t.dataset.f === 'accept') q.accept = t.value.split('/').map(s => s.trim()).filter(Boolean);
  else if (t.dataset.pl != null && q.parts) q.parts[+t.dataset.pl].label = t.value;
  else if (t.dataset.pa != null && q.parts) q.parts[+t.dataset.pa].accept = t.value.split('/').map(s => s.trim()).filter(Boolean);
  else if (['no','topic','stem','explanation'].includes(t.dataset.f)) q[t.dataset.f] = t.value;
  saveDraft(); refreshStatus();
});
function refreshStatus() {
  if (!draft || view !== 'teacher' || tStep !== 'edit') return;
  draft.questions.forEach((q, qi) => { const el = document.getElementById('eq' + qi); if (!el) return; const pr = problems(q); el.classList.toggle('bad', pr.length > 0); const m = el.querySelector('.prob'); if (m) m.textContent = pr.join(', '); });
  const bad = draft.questions.filter(q => problems(q).length).length;
  const b = document.querySelector('[data-act="tPublish"]'); if (b) b.disabled = busy || !draft.questions.length;
  const c = document.getElementById('badCount'); if (c) c.textContent = bad ? `, 확인할 문항 ${bad}개` : '';
}

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.short) return;
  if (t.matches('input[type=file]')) {
    const files = [...(t.files || [])]; t.value = ''; if (!files.length) return;
    if (t.dataset.act === 'impSheet' || t.dataset.act === 'impKey') {
      const which = t.dataset.act === 'impSheet' ? 'sheet' : 'key';
      const ok = files.filter(f => isHwp(f) || isPdf(f) || isImg(f));
      if (ok.length < files.length) toast('한글(.hwp), PDF, 사진 파일만 올릴 수 있어요.');
      for (const f of ok) if (!imp[which].some(x => x.name === f.name && x.size === f.size)) imp[which].push(f);
      render(); return;
    }
    if (t.dataset.act === 'eImg') { try { const u = await blobToUri(files[0], 1400, true); if (u) { draft.questions[+t.dataset.q].img = u; saveDraft(); render(); } } catch (err) { toast('그림을 열지 못했습니다.'); } return; }
  }
  if (!draft || t.dataset.q == null) return;
  const q = draft.questions[+t.dataset.q]; if (!q) return;
  if (!['answer','type','spare'].includes(t.dataset.f)) { refreshStatus(); return; }
  if (t.dataset.f === 'answer') q.answer = t.value ? +t.value : null;
  else if (t.dataset.f === 'type') { q.type = t.value; if (q.type === 'mc' && q.choices.length < 2) { q.choices = ['', '', '', '', '']; q.choiceNotes = ['', '', '', '', '']; } }
  else if (t.dataset.f === 'spare') { const k = parseInt(t.value, 10); if (Number.isInteger(k) && draft.spare[k]) q.img = draft.spare[k]; }
  saveDraft(); render();
});

document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.pc-row')) { e.preventDefault(); e.target.click(); } });
try { const f = sessionStorage.getItem('sq-flash'); if (f) { sessionStorage.removeItem('sq-flash'); setTimeout(() => toast(f), 300); } } catch (e) {}
render();
})();
</script>
