<body>
<div id="wrap" class="title">
  <canvas id="cv"></canvas>

    <div class="hl">
      <button id="pauseBtn" class="hbtn" aria-label="일시정지">II</button>
      <div><div id="hearts"></div><div class="enrow"><span>EN</span><div class="bar"><i id="enFill"></i></div></div></div>
    </div>
    <div id="stageBox"><b id="stTitle"></b><small id="stSub"></small><div id="scoreBox">점수 <b id="scoreVal">0</b></div></div>
    <div id="massBox">
      <div class="mrow"><span>질량</span><b>60 kg</b><em>장소와 관계없이 그대로</em></div>
      <div class="mrow"><span>무게</span><b id="wtVal">588 N</b><em id="placeVal">지구 중력</em></div>

    <div class="pad"><button class="btn" data-k="left" aria-label="왼쪽">◀</button><button class="btn" data-k="right" aria-label="오른쪽">▶</button></div>
    <div class="pad"><button class="btn jump" data-k="jump">점프</button><button class="btn atk" data-k="atk">공격</button></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const W=480,H=270,G_E=0.4,JV=5,PXM=62.5;
const WT={earth:588,moon:98};
const gOf=pl=>pl==='moon'?G_E/6:G_E;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const FONT="'Galmuri11','Malgun Gothic',sans-serif";
const cv=$('#cv'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const wrap=$('#wrap'),modal=$('#modal');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.width=Math.floor(W*s)+'px';wrap.style.height=Math.floor(H*s)+'px';wrap.style.setProperty('--u',s+'px');}
addEventListener('resize',fit);fit();

 ['중력: 지구가 물체를 지구 중심 방향으로 당기는 힘 (공중에서도 작용)','질량(kg)은 장소가 바뀌어도 일정, 무게(N)는 중력의 크기라서 장소에 따라 달라짐','달의 중력은 지구의 약 1/6 → 달에서의 무게 = 지구에서의 무게 × 1/6'].forEach((t,j)=>x.fillText('■ '+t,60,580+j*32));
 x.font=F(24);x.fillStyle='#ffd23f';x.fillText('오늘 알게 된 점',60,700);x.font=F(20);x.fillStyle='#f4e9c8';
 const lines=wrapText(x,G.reflect.trim()||'(작성하지 않음)',820);lines.slice(0,2).forEach((l,j)=>x.fillText(l,260,700+j*30));
 const name=`중력배틀_${inf.cls||'0'}반_${inf.num||'0'}번_${inf.name||'학생'}.png`;
 const dl=href=>{const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();};
 c.toBlob(async b=>{
  if(DL){try{await DL.save({filename:name,data:b||c.toDataURL('image/png')});toast('보고서 이미지를 저장했어요. 다운로드 폴더를 확인하세요.');}catch(e){toast(e&&e.code==='declined'?'저장을 취소했어요.':'저장하지 못했어요. 다시 눌러 주세요.');}return;}
  if(!b){dl(c.toDataURL('image/png'));}else{const u=URL.createObjectURL(b);dl(u);setTimeout(()=>URL.revokeObjectURL(u),4000);}
  toast('보고서 이미지를 저장했어요. 다운로드 폴더를 확인하세요.');},'image/png');}
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});}catch(_){}

/* ===== 루프 ===== */
function step(){G.frame++;
 if(G.state==='play'){G.playFrames++;updPlayer();if(G.state==='play'){updMons();updCubes();updShots();if(G.boss)updBoss();updMeteors();checkDoor();}}
 updParts();
 if(G.state==='victory'&&G.victoryT>0){G.victoryT--;if(G.victoryT%6===0){const b=G.boss;burst(b.x+rand(0,48),b.y+rand(0,40),'#c04cff',10);sfx('boom');}if(G.victoryT===0)startReview();}
 if(shake>0)shake--;}
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60;}ctx.imageSmoothingEnabled=false;render();updHUD();requestAnimationFrame(loop);}

/* ===== 실시간 순위판 (파이어베이스) ===== */
const COL='gravity_battle';
const NET={db:null,id:null,best:0,last:'',runAt:0};
try{if(window.firebase){let app=firebase.apps.length?firebase.app():null;
 const cfg=(typeof firebaseConfig!=='undefined')?firebaseConfig:window.firebaseConfig;
 if(!app&&cfg)app=firebase.initializeApp(cfg);if(app)NET.db=firebase.firestore();}}catch(e){console.warn('순위판 연결 실패',e);}
function todayStart(){const d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function netStatus(){const el=$('#netStat');if(!el)return;
 if(NET.db){el.className='small netstat ok';el.textContent='● 선생님 순위판에 연결됨';}
 else{el.className='small netstat no';el.textContent='순위판 연결 안 됨 · 게임은 그대로 할 수 있어요';}}
function netStart(){if(!NET.db)return;const i=G.info;const c=String(parseInt(i.cls,10)||i.cls),n=String(parseInt(i.num,10)||i.num);
 i.cls=c;i.num=n;const id=('c'+c+'_n'+n+'_'+i.name).replace(/[\/\\.#$\[\]\s]/g,'_');
 if(NET.id!==id){NET.id=id;NET.best=0;NET.db.collection(COL).doc(id).get().then(d=>{const v=d.exists&&d.data();if(v&&v.clientAt>=todayStart())NET.best=Math.max(NET.best,v.best||0);}).catch(()=>{});}
 NET.last='';NET.runAt=Date.now();netPush(true);}
function netData(){const s=G.stats,sc=calcScore(),done=G.state==='result';NET.best=Math.max(NET.best,sc.total);
 const li=G.L?G.li:0;return{cls:G.info.cls,num:G.info.num,name:G.info.name,stage:li+1,stageTitle:LEVELS[li].title,
  score:sc.total,best:NET.best,kills:s.kills||0,missions:s.missions||0,qFirst:s.qFirst||0,qTotal:s.qTotal||0,acc:sc.acc,
  faints:s.faints||0,boss:G.boss&&!G.boss.dead?Math.round(G.boss.hp/G.boss.max*100):(s.bossDone?0:100),
  done,grade:done?sc.g[0]:'',playing:G.state!=='title'};}
function netPush(force){if(!NET.db||!NET.id||G.state==='title')return;const d=netData();const key=JSON.stringify(d);
 if(!force&&key===NET.last)return;NET.last=key;d.clientAt=Date.now();d.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
 NET.db.collection(COL).doc(NET.id).set(d,{merge:true}).catch(e=>console.warn(e));}
function netRank(cb){if(!NET.db||!NET.id)return cb(null);const t=todayStart();
 NET.db.collection(COL).where('cls','==',G.info.cls).get().then(q=>{const arr=[];q.forEach(d=>{const v=d.data();if(v.clientAt>=t)arr.push({id:d.id,b:d.id===NET.id?NET.best:(v.best||0)});});
  if(!arr.some(a=>a.id===NET.id))arr.push({id:NET.id,b:NET.best});arr.sort((a,b)=>b.b-a.b);
  cb({rank:arr.findIndex(a=>a.id===NET.id)+1,n:arr.length});}).catch(()=>cb(null));}
setInterval(()=>netPush(false),3000);
showTitle();requestAnimationFrame(loop);
})();
</script>
