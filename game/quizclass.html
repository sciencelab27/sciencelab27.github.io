<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizClass</title>
<style>

:root{--navy:#102747;--blue:#2879f4;--bg:#eaf4ff;--line:#c4dcf5;--muted:#60748b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:linear-gradient(135deg,#f1f8ff,#dcecff);color:#10203b}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.top{min-height:78px;background:#f8fbff;display:flex;align-items:center;gap:14px;padding:10px 24px;border-bottom:1px solid #cfe1f5}.logo{font-size:29px;font-weight:950}.logo b{color:#4c55ff}.spacer{flex:1}.pill,.ctl{padding:12px 16px;border-radius:13px;font-weight:850}.pill{background:#e7f0fb}.room{background:white;border:2px solid #9bc2ef;padding:7px 15px;border-radius:15px;text-align:center}.pin{font-size:23px;font-weight:950;color:#315fe7}
.layout{display:grid;grid-template-columns:210px minmax(480px,1fr) 340px;gap:13px;padding:13px;max-width:1600px;margin:auto}.side{background:var(--navy);color:white;border-radius:19px;padding:17px;min-height:760px}.mode{width:100%;padding:13px;margin:4px 0;border-radius:12px;background:transparent;color:white;text-align:left;font-weight:850}.mode.active{background:linear-gradient(90deg,#5b50ff,#7166ff)}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 8px 24px #204a7712;padding:17px;margin-bottom:13px}.question{min-height:470px}.qmeta{display:flex;gap:9px;align-items:center}.qnum{background:#2d7df4;color:#fff;padding:9px 14px;border-radius:12px;font-size:21px;font-weight:950}.question h1{text-align:center;font-size:29px;margin:32px 8px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ans{padding:21px;border-radius:15px;font-size:18px;font-weight:850}.a1{background:#ff8f94}.a2{background:#69aafa}.a3{background:#ffd85e}.a4{background:#69da92}.correct{outline:5px solid #0fa85a}
.primary{background:#2879f4;color:#fff}.success{background:#17ad61;color:#fff}.warn{background:#f0a31a;color:#fff}.danger{background:#ef5350;color:#fff}.gray{background:#e7eef6;color:#1e3552}.controls{display:flex;gap:8px;flex-wrap:wrap}.timer{display:flex;justify-content:space-between;align-items:center}.circle{width:90px;height:90px;border-radius:50%;border:9px solid #1bb564;display:grid;place-items:center;font-size:32px;font-weight:950}
.barrow{display:flex;align-items:flex-end;gap:13px;height:205px;padding:18px 7px 0}.barcol{flex:1;text-align:center;font-weight:900}.bar{border-radius:9px 9px 0 0;min-height:7px}.barcol:nth-child(1) .bar{background:#ff6598}.barcol:nth-child(2) .bar{background:#4e98f6}.barcol:nth-child(3) .bar{background:#ffc93d}.barcol:nth-child(4) .bar{background:#37c97a}.rankrow{display:flex;justify-content:space-between;border-bottom:1px solid #e7edf5;padding:8px}.small{color:var(--muted);font-size:14px}
.setup{max-width:1080px;margin:28px auto;padding:0 17px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{width:100%;padding:12px;border:1px solid #c9d5e5;border-radius:10px;margin:5px 0 11px}.qitem{padding:12px;border:1px solid #dce5ef;border-radius:12px;margin:8px 0}.student{max-width:560px;margin:28px auto;padding:15px}.student .card{text-align:center}.sopt{display:block;width:100%;padding:19px;margin:9px 0;border-radius:15px;font-size:18px;font-weight:850}.bigresult{font-size:48px;font-weight:950;margin:18px}.hearts{font-size:25px}.hidden{display:none!important}.statusdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#18b467;margin-right:6px}
@media(max-width:1100px){.layout{grid-template-columns:175px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:13px}.right .card{margin:0}}@media(max-width:760px){.top .pill,.room{display:none}.layout{display:block}.side{min-height:auto;margin-bottom:12px}.answers,.grid2,.right{display:block}.right .card{margin-bottom:12px}.question h1{font-size:23px}}

/* QuizClass 2.1 monitor layout fixes */
html,body{max-width:100%;overflow-x:hidden}
.layout{grid-template-columns:190px minmax(420px,1fr) minmax(280px,330px)}
.side{min-width:0}
main,.right{min-width:0}
@media(max-width:1250px){
 .layout{grid-template-columns:180px minmax(0,1fr)}
 .right{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .right .card:last-child{grid-column:1/-1}
}
@media(max-width:900px){
 .layout{grid-template-columns:160px minmax(0,1fr);padding:8px;gap:8px}
 .right{grid-column:1/-1}
 .top{padding:8px 12px}
 .logo{font-size:23px}
 .question h1{font-size:23px;margin:20px 5px}
 .ans{padding:15px;font-size:16px}
}


/* ---- 한 파일 버전 추가 스타일 ---- */
.top{flex-wrap:wrap}.tab.active{background:#4c55ff;color:#fff}
.errbox{max-width:1500px;margin:12px auto 0;padding:14px 18px;background:#fff0f0;border:2px solid #ef5350;border-radius:14px;color:#9b1c1c;font-weight:800}
.conn{font-size:13px;font-weight:800;color:#60748b}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50}
.modalbox{text-align:center;padding:30px 40px}#qrcode{display:inline-block;padding:14px;background:#fff}#qrcode img,#qrcode canvas{display:block}
.qrpin{font-size:44px;font-weight:950;color:#315fe7;margin:10px 0 4px;letter-spacing:4px}
.student{max-width:900px}.sopt:disabled{opacity:.5;cursor:default}.sopt.picked{opacity:1;outline:5px solid #10203b}
@media(min-width:700px){#sopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}#sopts .sopt{margin:0}}
@media(max-width:760px){.top .tab,#qrBtn{display:inline-block}}
</style></head><body>

<!-- ================= 교사 화면 (주소 끝에 ?t) ================= -->
<div id="teacherView" class="hidden">
<header class=top><div class=logo>⚗ Quiz<b>Class</b></div>
<button class="pill tab active" data-pane="playPane">🎮 수업 진행</button>
<button class="pill tab" data-pane="managePane">📝 문제 관리</button>
<button class="pill" id="qrBtn">📱 학생 입장 QR</button>
<div class=spacer></div><div class=conn id=conn>연결 확인 중…</div>
<div class=room>과학 수업<br>PIN <span class=pin id=pin>------</span></div></header>
<div id="errorBox" class="errbox hidden"></div>

<div id=playPane><div class=layout><aside class=side><h3>게임 모드</h3><button class="mode active" data-m="기본 퀴즈">🎯 기본 퀴즈</button><button class=mode data-m="스피드 퀴즈">⚡ 스피드 퀴즈</button><button class=mode data-m="골든벨">🔔 골든벨</button><button class=mode data-m="서바이벌">❤️ 서바이벌</button><button class=mode data-m="익명 형성평가">📊 익명 형성평가</button><hr><p>현재 문제</p><h2 id=progress>0 / 0</h2><button class="ctl gray" id="newRoomBtn">새 방 만들기<br><span style="font-size:12px;font-weight:700">(반이 바뀔 때)</span></button></aside>
<main><section class="card question"><div class=qmeta><span class=qnum id=qnum>Q</span><span class=pill>중학교 과학</span></div><h1 id=qtext>학생 입장을 확인한 뒤 문제를 시작하세요.</h1><div class=answers id=answers></div></section>
<section class=card><div class=controls><button class="ctl primary" id=prevBtn>◀ 이전</button><button class="ctl danger" id=startBtn>▶ 문제 시작</button><button class="ctl primary" id=nextBtn>다음 ▶</button><button class="ctl success" id=revealBtn>👁 정답 공개</button><button class="ctl warn" id=exBtn>📖 해설</button></div></section>
<section class=card><h3>🏆 실시간 순위</h3><div id=ranking></div></section></main>
<aside class=right><section class="card timer"><div><h3>⌛ 남은 시간</h3><div class=small id=modeLabel></div></div><div class=circle id=time>--</div></section>
<section class=card><h3>응답 현황 <span id=submitted></span></h3><div class=barrow id=bars></div><p class=small id=waiting></p></section>
<section class=card><h3>참여 학생 <span id=pcount></span></h3><div id=players></div></section></aside></div></div>

<div id=managePane class="setup hidden"><p class=small>여기서 고친 문제는 새 방을 만들어도 그대로 이어집니다.</p><div class=grid2>
<div class=card><h2>문제 추가</h2><textarea id=mq class=field placeholder="문제"></textarea><input id=o0 class=field placeholder="① 보기"><input id=o1 class=field placeholder="② 보기"><input id=o2 class=field placeholder="③ 보기"><input id=o3 class=field placeholder="④ 보기"><select id=mans class=field><option value=0>정답 ①</option><option value=1>정답 ②</option><option value=2>정답 ③</option><option value=3>정답 ④</option></select><label class=small>제한 시간(초)</label><input id=msec type=number class=field value=15 min=5><textarea id=mex class=field placeholder="해설"></textarea><button class="ctl success" id=addBtn>+ 문제 추가</button></div>
<div class=card><h2>문제 목록 <span id=cnt></span></h2><div id=list></div></div></div></div>

<div id=qrModal class="modal hidden"><div class="card modalbox"><h2>📱 태블릿으로 찍고 입장하세요</h2><div id=qrcode></div><div class=qrpin id=qrPin></div><p class=small id=qrUrl></p><button class="ctl primary" id=qrClose>닫기</button></div></div>
</div>

<!-- ================= 학생 화면 (기본) ================= -->
<div id="studentView" class="student hidden">
<div class=card id=joinbox><div class=logo>Quiz<b>Class</b></div><h2>수업 참여</h2>
<div id=joinError class=hidden style="margin:10px 0;padding:10px;background:#fff0f0;border:1px solid #ef5350;border-radius:10px;color:#9b1c1c;font-weight:750"></div>
<input id=room class=field inputmode=numeric maxlength=6 placeholder="6자리 PIN"><input id=name class=field placeholder="번호와 이름 (예: 3 김과학)">
<button class="ctl primary" id=joinBtn type=button>입장하기</button>
<p class=small id=jscheck>페이지 준비 중...</p></div>
<div class="card hidden" id=game><div class=small id=status></div><div class=hearts id=hearts></div><h2 id=sq>교사가 문제를 시작할 때까지 기다려 주세요.</h2><div id=sopts></div><div class=bigresult id=result></div><p id=explain></p></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<!-- 같은 폴더(game)에 있는 firebase-config.js를 자동으로 읽습니다 -->
<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* firebase-config.js를 못 찾을 때만 여기에 직접 붙여 넣으세요. 예) const QC_CONFIG_MANUAL={apiKey:"...",projectId:"...",...}; */
const QC_CONFIG_MANUAL=null;
const QC_ROOT="quizclass_v2";
const DEFAULT_Q=[
 {q:"다음 중 기체의 성질로 옳은 것은?",opts:["일정한 모양과 부피가 있다.","흐르지 않는다.","쉽게 압축할 수 있다.","부피가 변하지 않는다."],ans:2,sec:15,ex:"기체는 입자 사이의 거리가 멀어 비교적 쉽게 압축됩니다."},
 {q:"물이 끓을 때 일어나는 변화로 가장 알맞은 것은?",opts:["액체가 기체로 변한다.","기체가 액체로 변한다.","고체가 액체로 변한다.","액체가 고체로 변한다."],ans:0,sec:20,ex:"끓음은 액체가 기체로 변하는 기화 현상입니다."}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FP=(...p)=>new firebase.firestore.FieldPath(...p);
const params=new URLSearchParams(location.search);
const isTeacher=params.has("t");
let db=null;

function showErr(e){console.error(e);let m=(e&&e.message)?e.message:String(e);
 if(/permission/i.test(m))m+=" → 파이어베이스 보안 규칙이 막고 있어요.";
 const b=$(isTeacher?"errorBox":"joinError");b.classList.remove("hidden");b.textContent="⚠️ "+m}

function findConfig(){
 if(QC_CONFIG_MANUAL)return QC_CONFIG_MANUAL;
 const names=["firebaseConfig","FIREBASE_CONFIG","firebase_config","FB_CONFIG","fbConfig","config","CONFIG","GAME_CONFIG","gameConfig","QC_CONFIG"];
 for(const n of names){try{const v=(0,eval)(n);if(v&&v.apiKey&&v.projectId)return v}catch(e){}}
 for(const k of Object.getOwnPropertyNames(window)){try{const v=window[k];if(v&&typeof v==="object"&&typeof v.apiKey==="string"&&typeof v.projectId==="string")return v}catch(e){}}
 return null}

function initDB(){try{
 if(!window.firebase)throw new Error("Firebase를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.");
 let app;
 if(firebase.apps.length)app=firebase.apps[0];
 else{const c=findConfig();if(!c)throw new Error("firebase-config.js를 찾지 못했어요. 이 파일을 firebase-config.js가 있는 game 폴더에 올렸는지 확인해 주세요.");app=firebase.initializeApp(c)}
 db=app.firestore();return app.options.projectId}catch(e){showErr(e);return null}}

/* ======================= 교사 ======================= */
function teacher(){
 $("teacherView").classList.remove("hidden");document.title="QuizClass 교사";
 const pid=initDB();$("conn").textContent=pid?"🟢 "+pid:"🔴 연결 안 됨";if(!db)return;
 let state=null,questions=[],players={},unsub=null,stopping=false,room=localStorage.getItem("qc2_room")||"";
 const ref=()=>db.collection(QC_ROOT).doc(room);
 const savedQ=()=>{try{const a=JSON.parse(localStorage.getItem("qc2_questions"));return Array.isArray(a)&&a.length?a:null}catch(e){return null}};

 async function newRoom(){try{
  const qs=questions.length?questions:(savedQ()||DEFAULT_Q);
  room=String(Math.floor(100000+Math.random()*900000));localStorage.setItem("qc2_room",room);
  await ref().set({mode:state?.mode||"기본 퀴즈",idx:-1,running:false,reveal:false,endAt:0,createdAt:Date.now(),players:{},questions:qs});listen()}catch(e){showErr(e)}}
 async function ensure(){try{if(!room)return newRoom();const s=await ref().get();if(!s.exists)return newRoom();listen()}catch(e){showErr(e)}}
 function listen(){if(unsub)unsub();unsub=ref().onSnapshot(s=>{if(!s.exists)return;state=s.data();questions=state.questions||[];players=state.players||{};
  if(questions.length)localStorage.setItem("qc2_questions",JSON.stringify(questions));render();renderManage()},showErr)}
 async function patch(o){try{await ref().update(o)}catch(e){showErr(e)}}
 // 학생 '답' 칸만 비우기 (명단 전체를 덮어쓰지 않음)
 async function patchReset(o){try{const a=[];Object.entries(o).forEach(([k,v])=>a.push(k,v));
  Object.keys(players).forEach(k=>["answer","correct","answeredAt"].forEach(f=>a.push(FP("players",k,f),null)));
  await ref().update(...a)}catch(e){showErr(e)}}

 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));["playPane","managePane"].forEach(p=>$(p).classList.toggle("hidden",p!==b.dataset.pane))});
 $("qrBtn").onclick=()=>{if(!room)return;const url=location.origin+location.pathname+"?pin="+room;$("qrcode").innerHTML="";
  if(window.QRCode)new QRCode($("qrcode"),{text:url,width:300,height:300});else $("qrcode").textContent="(QR을 불러오지 못했어요 — 아래 주소와 PIN을 알려 주세요)";
  $("qrPin").textContent="PIN "+room;$("qrUrl").textContent=url;$("qrModal").classList.remove("hidden")};
 $("qrClose").onclick=()=>$("qrModal").classList.add("hidden");
 $("newRoomBtn").onclick=()=>{if(!state||confirm("새 방을 만들면 PIN이 바뀌고 학생 명단·점수가 비워집니다.\n(문제는 그대로 이어집니다) 만들까요?"))newRoom()};
 document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>patch({mode:b.dataset.m}));
 $("startBtn").onclick=()=>{const q=questions[state?.idx];if(!q)return alert("먼저 '다음'을 눌러 문제를 선택하세요.");patchReset({running:true,reveal:false,endAt:Date.now()+(q.sec||15)*1000})};
 $("nextBtn").onclick=()=>state&&state.idx<questions.length-1&&patchReset({idx:state.idx+1,running:false,reveal:false,endAt:0});
 $("prevBtn").onclick=()=>state&&state.idx>0&&patchReset({idx:state.idx-1,running:false,reveal:false,endAt:0});
 $("revealBtn").onclick=()=>state&&questions[state.idx]&&patch({reveal:true,running:false});
 $("exBtn").onclick=()=>alert(questions[state?.idx]?.ex||"등록된 해설이 없습니다.");

 function render(){
  if(!state)return;const anon=state.mode==="익명 형성평가";
  $("pin").textContent=room;$("modeLabel").textContent=state.mode;$("progress").textContent=`${Math.max(0,state.idx+1)} / ${questions.length}`;
  document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("active",x.dataset.m===state.mode));
  const q=questions[state.idx];
  if(q){$("qnum").textContent="Q "+(state.idx+1);$("qtext").textContent=q.q;$("answers").innerHTML=q.opts.map((x,i)=>`<div class="ans a${i+1} ${state.reveal&&i===q.ans?'correct':''}">${i+1}　${esc(x)}</div>`).join("")}
  else{$("qnum").textContent="Q";$("qtext").textContent="학생 입장을 확인한 뒤 '다음 ▶'으로 문제를 선택하세요.";$("answers").innerHTML=""}
  const arr=Object.entries(players),counts=[0,0,0,0];arr.forEach(([k,p])=>{if(Number.isInteger(p.answer))counts[p.answer]++});
  const mx=Math.max(1,...counts),sub=counts.reduce((a,b)=>a+b,0);
  $("submitted").textContent=`${sub} / ${arr.length}명 제출`;
  $("bars").innerHTML=counts.map((n,i)=>`<div class=barcol><b>${n}명</b><div class=bar style="height:${Math.max(7,n/mx*145)}px"></div>${i+1}</div>`).join("");
  $("waiting").textContent=!arr.length?"":arr.length-sub?`미제출 ${arr.length-sub}명`:"모두 제출했습니다.";$("pcount").textContent=`${arr.length}명`;
  $("players").innerHTML=arr.map(([k,p])=>`<div class=rankrow><span>${anon?"학생":esc(p.name||k)}</span><span>${p.answer==null?"대기":"제출 ✓"}${p.alive===false?" · 탈락":""}</span></div>`).join("")||"<span class=small>아직 입장한 학생이 없습니다.</span>";
  $("ranking").innerHTML=anon?"<span class=small>익명 모드에서는 순위를 표시하지 않습니다.</span>":
   arr.slice().sort((a,b)=>(b[1].score||0)-(a[1].score||0)).slice(0,5).map(([k,p],i)=>`<div class=rankrow><b>${i+1}. ${esc(p.name||k)}</b><b>${p.score||0}점</b></div>`).join("")||"<span class=small>응답 후 순위가 표시됩니다.</span>";
  const remain=state.running?Math.max(0,Math.ceil((state.endAt-Date.now())/1000)):0;
  $("time").textContent=q?(state.running?remain:"Ⅱ"):"--";
  if(state.running&&remain<=0&&!stopping){stopping=true;patch({running:false}).finally(()=>stopping=false)}
 }

 function renderManage(){
  $("cnt").textContent=questions.length+"개";
  $("list").innerHTML=questions.map((x,i)=>`<div class=qitem><b>${i+1}. ${esc(x.q)}</b><div class=small>${x.opts.map((o,j)=>(j===x.ans?"✅ ":"")+esc(o)).join(" / ")} · ${x.sec||15}초</div><button class="ctl danger" data-del="${i}">삭제</button></div>`).join("")||"<span class=small>문제가 없습니다.</span>";
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(!confirm("이 문제를 삭제할까요?"))return;const a=questions.slice();a.splice(+b.dataset.del,1);saveQ(a)})}
 async function saveQ(a){try{const o={questions:a};if(state&&state.idx>=a.length)Object.assign(o,{idx:a.length-1,running:false,reveal:false});await ref().update(o);if(a.length)localStorage.setItem("qc2_questions",JSON.stringify(a))}catch(e){showErr(e);alert("저장 오류: "+e.message)}}
 $("addBtn").onclick=()=>{const opts=["o0","o1","o2","o3"].map(id=>$(id).value.trim()),q=$("mq").value.trim();
  if(!q||opts.some(x=>!x))return alert("문제와 보기 4개를 모두 입력하세요.");
  saveQ(questions.concat([{q,opts,ans:+$("mans").value,sec:Math.max(5,+$("msec").value||15),ex:$("mex").value.trim()}]));
  ["mq","o0","o1","o2","o3","mex"].forEach(id=>$(id).value="")};

 setInterval(render,500);ensure();
}

/* ======================= 학생 ======================= */
function student(){
 $("studentView").classList.remove("hidden");document.title="QuizClass 학생";
 initDB();if(db){$("jscheck").textContent="✓ 참여 준비 완료";$("jscheck").style.color="#159447"}else $("jscheck").textContent="⚠️ 연결 실패 — 새로고침해 주세요";
 let who="",room="",state=null,player=null,last=-99,busy=false,key="",sending=false;
 const saved=(()=>{try{return JSON.parse(localStorage.getItem("qc_student"))||{}}catch(e){return {}}})();
 $("room").value=params.get("pin")||saved.room||"";$("name").value=saved.name||"";
 const safeKey=x=>x.replace(/[.~*/\[\]`]/g,"_");

 async function join(){
  if(busy)return;room=$("room").value.trim();who=$("name").value.trim();
  if(!/^\d{6}$/.test(room)){showErr("PIN 6자리 숫자를 입력해 주세요.");return}
  if(!who){showErr("번호와 이름을 입력해 주세요.");return}
  if(!db){showErr("파이어베이스 연결이 안 됐어요. 새로고침해 주세요.");return}
  busy=true;$("joinBtn").textContent="입장 중...";
  try{
   const ref=db.collection(QC_ROOT).doc(room),snap=await ref.get();
   if(!snap.exists)throw new Error("방을 찾을 수 없습니다. PIN을 확인해 주세요.");
   key=safeKey(who);
   if(!(snap.data().players||{})[key])await ref.update(FP("players",key),{name:who,score:0,answer:null,correct:null,alive:true,lives:3,joinedAt:Date.now()});
   localStorage.setItem("qc_student",JSON.stringify({room,name:who}));
   $("joinbox").classList.add("hidden");$("game").classList.remove("hidden");
   ref.onSnapshot(s=>{if(s.exists){state=s.data();player=(state.players||{})[key]||null;render()}},showErr);
  }catch(e){showErr(e);busy=false;$("joinBtn").textContent="입장하기"}
 }
 $("joinBtn").onclick=join;
 $("name").addEventListener("keydown",e=>{if(e.key==="Enter")join()});

 async function answer(i){
  if(sending||!state||!state.running||!player||player.answer!=null||player.alive===false)return;
  const q=state.questions[state.idx],correct=i===q.ans;let score=player.score||0,lives=player.lives==null?3:player.lives,alive=player.alive!==false;
  if(correct){const bonus=state.mode==="스피드 퀴즈"?Math.max(0,Math.ceil((state.endAt-Date.now())/1000))*5:0;score+=100+bonus}
  if(!correct&&state.mode==="골든벨")alive=false;
  if(!correct&&state.mode==="서바이벌"){lives=Math.max(0,lives-1);if(lives===0)alive=false}
  sending=true;
  try{await db.collection(QC_ROOT).doc(room).update(
   FP("players",key,"answer"),i,FP("players",key,"correct"),correct,FP("players",key,"score"),score,
   FP("players",key,"lives"),lives,FP("players",key,"alive"),alive,FP("players",key,"answeredAt"),Date.now())}
  catch(e){alert("답 제출 오류: "+e.message)}finally{sending=false}
 }
 $("sopts").onclick=e=>{const b=e.target.closest("button[data-i]");if(b&&!b.disabled)answer(+b.dataset.i)};

 function render(){
  if(!state)return;
  if(!player){$("sq").textContent="명단에서 빠졌어요. 새로고침 후 다시 입장해 주세요.";$("sopts").innerHTML="";return}
  const q=state.questions&&state.questions[state.idx];
  $("status").textContent=state.mode+" · "+who+" · "+(player.score||0)+"점";
  $("hearts").textContent=state.mode==="서바이벌"?"내 생명 "+"❤️".repeat(player.lives==null?3:player.lives):state.mode==="골든벨"?(player.alive===false?"🔔 탈락":"🔔 생존 중"):"";
  if(!q){$("sq").textContent="교사가 문제를 시작할 때까지 기다려 주세요.";$("sopts").innerHTML="";$("result").textContent="";$("explain").textContent="";return}
  if(state.idx!==last){last=state.idx;$("result").textContent=""}
  $("sq").textContent=q.q;
  const lock=player.alive===false||!state.running||player.answer!=null;
  $("sopts").innerHTML=q.opts.map((x,i)=>`<button class="sopt a${i+1}${player.answer===i?" picked":""}" data-i="${i}" ${lock?"disabled":""}>${i+1}. ${esc(x)}</button>`).join("");
  $("result").textContent=player.alive===false?(state.mode==="서바이벌"?"💔 탈락":"❌ 골든벨 탈락"):
   (state.reveal&&player.answer!=null)?(player.correct?"⭕ 정답!":"❌ 오답"):player.answer!=null?"제출 완료 ✓":"";
  $("explain").textContent=(state.reveal&&player.answer!=null)?(q.ex||""):
   (!state.running&&!state.reveal&&player.answer==null&&player.alive!==false)?"⏸ 선생님이 ‘문제 시작’을 누르면 답을 고를 수 있어요.":"";
 }
}

if(isTeacher)teacher();else student();
</script></body></html>
