<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선생님용 · 합력과 평형으로 지키는 내 지갑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAF4EF; --ink:#18324A; --soft:#4F6B7E; --card:#FFFFFF; --line:#C3DCD1; --grid:#D6E8DF;
  --in:#0F8B6E; --in-bg:#DDF2EA; --out:#D9483B; --out-bg:#FBE3DF; --need:#8C2A20; --coin:#E9A51F; --coin-bg:#FCEFCF;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10221D; --ink:#E3F1EA; --soft:#9DB8AC; --card:#18302A; --line:#2D4A40; --grid:#1D352E;
    --in:#3CC59E; --in-bg:#163A30; --out:#F07164; --out-bg:#41221F; --need:#C24A3E; --coin:#F5C451; --coin-bg:#3B3218;
  }
}
:root[data-theme="dark"]{
  --paper:#10221D; --ink:#E3F1EA; --soft:#9DB8AC; --card:#18302A; --line:#2D4A40; --grid:#1D352E;
  --in:#3CC59E; --in-bg:#163A30; --out:#F07164; --out-bg:#41221F; --need:#C24A3E; --coin:#F5C451; --coin-bg:#3B3218;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:2px solid var(--line)}
.top h1{font-family:var(--display);font-weight:400;font-size:21px;margin:0;white-space:nowrap}
.dots{display:flex;gap:8px;margin:0 auto}
.dot{width:34px;height:8px;border-radius:4px;background:var(--line)}
.dot.done{background:var(--in)}
.dot.now{background:var(--coin)}
.team{font-family:var(--display);font-size:20px;white-space:nowrap}
.score{font-family:var(--display);font-size:20px;background:var(--coin-bg);border-radius:20px;padding:2px 14px;white-space:nowrap}
.ghost.armed{border-color:var(--out);color:var(--out);background:var(--out-bg)}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px;color:var(--soft)}

/* main */
main{min-height:0;display:grid;grid-template-columns:1.4fr 1fr}
.stage-wrap{min-height:0;overflow:auto;padding:18px 18px 18px 20px;display:flex;flex-direction:column}
.stage-cap{display:flex;justify-content:space-between;font-family:var(--display);font-size:18px;padding:0 6px 6px}
.stage-cap .l{color:var(--out)} .stage-cap .r{color:var(--in)}
.stage{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px;flex:1;display:flex;align-items:center;min-height:300px}
.stage svg{width:100%;height:auto;display:block}
.legend{font-size:14px;color:var(--soft);padding:8px 6px 0}

.panel{min-height:0;overflow:auto;padding:18px 20px 24px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.3}
.panel p{margin:0}
.muted{color:var(--soft);font-size:15px}
.mission{background:var(--coin-bg);border-radius:16px;padding:14px 16px}
.mission .k{font-size:14px;color:var(--soft)}
.mission .t{font-family:var(--display);font-size:24px;line-height:1.3}
.event{display:flex;gap:14px;align-items:center;border-radius:16px;padding:14px 16px;border:2px dashed currentColor}
.event.out{color:var(--out);background:var(--out-bg)} .event.in{color:var(--in);background:var(--in-bg)}
.event .e{font-size:40px;line-height:1}
.event .n{font-family:var(--display);font-size:22px}
.event .d{color:var(--ink);font-size:15px}
.flip{animation:flip .5s ease-out}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}

.btn{border:none;border-radius:14px;padding:14px 18px;font-family:var(--display);font-size:21px;background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}

/* prediction */
.pred{display:grid;gap:10px}
.mag{display:flex;align-items:center;gap:10px}
.mag button{width:56px;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-size:28px}
.mag output{flex:1;text-align:center;font-family:var(--display);font-size:40px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:2px 0}
.dirs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dirs button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;font-family:var(--display);font-size:19px}
.dirs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.fb{border-radius:14px;padding:12px 14px;font-size:16px}
.fb.ok{background:var(--in-bg)} .fb.no{background:var(--out-bg)}
.fb b{font-family:var(--display);font-weight:400;font-size:20px;display:block}

/* cards */
.hand{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardb{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;min-height:68px}
.cardb .ce{font-size:28px;grid-row:span 2}
.cardb .cn{font-family:var(--display);font-size:18px;line-height:1.2}
.cardb .cd{font-size:14px;color:var(--soft)}
.hi-in{color:var(--in);background:var(--in-bg);border-radius:6px;padding:0 4px;font-weight:700}
.hi-out{color:var(--out);background:var(--out-bg);border-radius:6px;padding:0 4px;font-weight:700}
.hi-need{color:var(--need);border-bottom:2px solid var(--need);font-weight:700}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px}
.sizes button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 0;font-family:var(--display);font-size:20px}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.roles{background:var(--coin-bg);border:3px solid var(--coin);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.roles .k{font-family:var(--display);font-size:22px;color:var(--ink)}
.role{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4}
.role .re{font-size:40px;line-height:1}
.role b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1}
.rolechip{display:flex;align-items:center;gap:10px;background:var(--coin-bg);border:2px solid var(--coin);border-radius:14px;padding:8px 14px;font-family:var(--display);font-size:22px;color:var(--ink)}
.rolechip b{font-weight:400;font-size:36px;line-height:1}
.timer{position:sticky;top:-18px;z-index:5;display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--in);border-radius:16px;padding:12px 16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.timer .tt{font-family:var(--display);font-size:22px;white-space:nowrap}
.timer .tt b{font-weight:400;font-size:44px;line-height:1}
.tbar{flex:1;height:16px;background:var(--line);border-radius:5px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--in);transition:width .25s linear}
.timer.hurry{border-color:var(--out);background:var(--out-bg)}
.timer.hurry .tbar i{background:var(--out)}
.timer.hurry .tt{color:var(--out);animation:beat 1s infinite}
@keyframes beat{50%{opacity:.5}}
.formula{display:flex;align-items:stretch;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.fx{flex:1;min-width:120px;background:var(--card);border:2px solid var(--coin);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.25}
.fx .fn{font-family:var(--display);font-size:19px}
.fx .fv{font-family:var(--display);font-size:34px;color:var(--coin);line-height:1.1;margin:2px 0}
.fx .fs{font-size:13px;color:var(--soft)}
.fx.total{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fx.total .fs{color:var(--paper);opacity:.8}
.fo{align-self:center;font-family:var(--display);font-size:32px}
.pigchip{font-family:var(--display);font-size:18px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:1px 12px;white-space:nowrap}
.pigbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--coin-bg);border-radius:14px;padding:10px 14px;font-size:16px}
.pigbox b{font-family:var(--display);font-weight:400;font-size:24px}
.pigbox.warn{background:var(--out-bg)}
.cat{display:inline-block;font-family:var(--body);font-size:12px;border:1.5px solid var(--line);border-radius:8px;padding:0 6px;vertical-align:middle;color:var(--soft)}
.ways{display:grid;gap:8px}
.way{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.way .wk{font-family:var(--display);font-size:20px}
.way .wh{font-size:14px;color:var(--soft)}
.way .wg{font-size:15px;color:var(--in)} .way .wb{font-size:15px;color:var(--out)}
.way.ours{border-color:var(--coin)}
.way[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.ourtag{font-family:var(--body);font-size:12px;background:var(--coin-bg);border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:middle}
.eff{display:inline-block;font-family:var(--display);font-size:14px;border-radius:8px;padding:0 6px;margin-left:2px}
.eff.p{background:var(--in-bg);color:var(--in)} .eff.m{background:var(--out-bg);color:var(--out)}
.cardb[aria-pressed="true"]{border-color:var(--coin);background:var(--coin-bg);box-shadow:0 0 0 2px var(--coin) inset}
.cardb:disabled{opacity:.35;cursor:default}
.cardb:disabled .cd::after{content:" · 사용함"}
.toast{min-height:22px;font-size:15px;color:var(--out)}

.result{border-radius:16px;padding:14px 16px;text-align:center}
.result.ok{background:var(--in-bg)} .result.no{background:var(--out-bg)}
.result .big{font-family:var(--display);font-size:30px}
.pts{font-family:var(--display);font-size:20px}

/* start / end */
.center{grid-column:1/-1;overflow:auto;display:flex;justify-content:center;padding:28px 20px}
.box{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}
.title{font-family:var(--display);font-size:clamp(40px,7vw,64px);line-height:1.1;margin:0}
.title span{display:block;font-size:.42em;color:var(--soft);margin-bottom:6px}
.teams{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media (max-width:820px){.teams{grid-template-columns:repeat(4,1fr)}}
.teams button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 0;font-family:var(--display);font-size:22px}
.teams button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rules{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 18px}
.rules ol{margin:6px 0 0;padding-left:22px}
.rules li{margin:3px 0}
.tablewrap{overflow-x:auto;background:var(--card);border:2px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:16px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:400;font-size:17px;color:var(--soft)}
tr:last-child td{border-bottom:none}
.tot{display:flex;gap:10px;flex-wrap:wrap}
.tot div{flex:1;min-width:140px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
.tot .v{font-family:var(--display);font-size:34px}
.tutstep{font-size:15px;color:var(--soft)}
.calc{display:flex;flex-direction:column;gap:2px;border-radius:14px;padding:10px 14px;font-size:16px}
.calc b{font-family:var(--display);font-weight:400;font-size:28px}
.calc.in{background:var(--in-bg)} .calc.in b{color:var(--in)}
.calc.out{background:var(--out-bg)} .calc.out b{color:var(--out)}
.calc.net{background:var(--coin-bg)}
.tutnav{display:flex;gap:10px}
.tutnav .btn{flex:1}
.pig{font-size:72px;text-align:center;line-height:1}
.coins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.coin{width:34px;height:34px;border-radius:50%;background:var(--coin);color:#3A2A00;font-family:var(--display);display:grid;place-items:center;font-size:15px;animation:pop .35s both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}

/* svg */
.g-grid line{stroke:var(--grid);stroke-width:1}
.a-in{stroke:var(--in);fill:var(--in)} .a-out{stroke:var(--out);fill:var(--out)} .a-net{stroke:var(--coin);fill:var(--coin)}
.a-need{stroke:var(--need);fill:var(--need)}
.sw{display:inline-block;width:14px;height:8px;border-radius:2px;vertical-align:middle;margin:0 4px 0 10px}
.chips{display:grid;gap:8px}
.chips button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.think{border-left:5px solid var(--coin);padding:6px 0 6px 12px;font-size:16px}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.term{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
.term .did{font-size:15px;color:var(--soft)}
.term .word{font-family:var(--display);font-size:24px;line-height:1.3}
.term .mean{font-size:15px}
.step{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.step h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.final{background:var(--ink);color:var(--paper);border-radius:18px;padding:18px 22px;font-size:18px;line-height:1.7}
details{border-top:1.5px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:17px}
summary b{font-family:var(--display);font-weight:400;font-size:20px;margin-right:6px}
.tin input{width:100%;max-width:120px;font:inherit;font-family:var(--display);font-size:20px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.ranks{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 18px;font-family:var(--display);font-size:22px}
.rk .rn{width:56px;color:var(--soft)} .rk .rs{margin-left:auto;font-family:var(--body);font-size:15px;color:var(--soft)}
.rk.open{animation:pop .35s both}
.rk.gold{background:var(--coin-bg);border-color:var(--coin);font-size:28px}
.champ{text-align:center}
.trophy{font-size:96px;line-height:1;animation:pop .6s both}
.cw{font-family:var(--display);font-size:28px;color:var(--soft)}
.cn2{font-family:var(--display);font-size:clamp(48px,9vw,80px);line-height:1.1}
.final b{font-family:var(--display);font-weight:400;font-size:24px;display:block;margin-bottom:4px}
.ghostline{stroke:var(--soft);stroke-dasharray:5 5;stroke-width:2;fill:none;opacity:.6}
.lbl{font-family:var(--display);font-size:16px;fill:var(--ink)}
.lbl.faint{fill:var(--soft)}
.tag{font-family:var(--body);font-size:12px;fill:var(--soft)}
.wallet{fill:var(--ink)}
.wtext{font-family:var(--display);font-size:24px;fill:var(--paper)}
.netlbl{font-family:var(--display);font-size:20px;fill:var(--ink)}
#mover{transition:transform 1.1s cubic-bezier(.3,.7,.3,1)}
@media (prefers-reduced-motion: reduce){#mover{transition:none}.flip,.coin{animation:none}}

@media (max-width:820px){
  main{grid-template-columns:1fr}
  .panel{border-left:none;border-top:2px solid var(--line)}
  #app{height:auto;min-height:100%}
  html,body{height:auto}
  .dots{display:none}
  .top h1{font-size:20px}
}
.cls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:560px}
.cls button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 0;font-family:var(--display);font-size:20px}
.cls button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sent{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:16px;padding:12px 16px;font-size:16px}
.sent b{font-family:var(--display);font-weight:400;font-size:22px}
.sent.ok{background:var(--in-bg)} .sent.ok b{color:var(--in)}
.sent.wait{background:var(--coin-bg)}
.sent.fail{background:var(--out-bg)} .sent.fail b{color:var(--out)}
.sent .btn{padding:8px 14px;font-size:17px;margin-left:auto}
.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px}
.live .on{color:var(--in);font-family:var(--display);font-size:19px}
.live .offl{color:var(--out);font-family:var(--display);font-size:19px}
.stt{font-size:15px;white-space:nowrap}
.stt.ok{color:var(--in);font-family:var(--display);font-size:18px}
.stt.play{color:var(--coin)}
.box>*{flex-shrink:0}
.numin{display:flex;align-items:center;gap:10px}
.numin input{width:120px;font:inherit;font-family:var(--display);font-size:26px;text-align:center;padding:6px 10px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.numin input:focus{outline:3px solid var(--coin);outline-offset:1px}
.mem{display:block;font-size:13px;color:var(--soft);white-space:normal;margin-top:2px;max-width:260px}
.avg{font-family:var(--display);font-size:22px}
.tin td:first-child{white-space:nowrap}
.mem{white-space:normal}
.tin input.auto{border-color:var(--in);background:var(--in-bg)}
.dots{visibility:hidden}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var S = 4.4; // px per coin; 5 coins = one grid square (22px)
  var BASE = {
    ins:[{id:'allow',name:'용돈',v:50}],
    outs:[{id:'bus',name:'교통비',v:10,need:true},{id:'snack',name:'간식',v:10},{id:'game',name:'게임',v:10},{id:'play',name:'친구와 놀기',v:15},{id:'save',name:'저축',v:5}]
  };
  var PIG_START = 10;
  var WAYS = [
    {k:'소비 줄이기',e:'🍪',how:'나가는 화살표(쓰고 싶은 돈)를 짧게',good:'저금통을 지킬 수 있어요.',bad:'지금 하고 싶은 것을 참아야 해요.'},
    {k:'저축 줄이기',e:'🐷',how:'저축 화살표를 짧게, 또는 저금통에서 꺼내기',good:'지금 생활은 그대로 할 수 있어요.',bad:'나중을 위한 돈이 줄어서, 또 급한 일이 생기면 곤란해요.'},
    {k:'수입 늘리기',e:'🧹',how:'들어오는 화살표를 새로 만들기',good:'쓰는 것과 모으는 것을 둘 다 지킬 수 있어요.',bad:'시간과 노력이 들고, 매번 할 수는 없어요.'}
  ];
  var ROLE_ALL = {
    '조작':{e:'📱',d:'태블릿을 잡고, 모둠이 정한 대로 입력해요.'},

  function sideSums(f){var a=0,b=0;f.ins.forEach(function(x){a+=x.v;});f.outs.forEach(function(x){b+=x.v;});return {r:a,l:b};}
  function predControls(f){
    var hint='';
    if(st.hint){var ss=sideSums(f);hint='<div class="fb ok"><b>힌트</b>오른쪽 화살표의 합 = '+ss.r+', 왼쪽 화살표의 합 = '+ss.l+'. 큰 쪽에서 작은 쪽을 빼면 합력의 크기, 큰 쪽이 합력의 방향이에요.</div>';}
    else hint='<button class="btn alt" data-a="hint">힌트 보기</button>';
    return '<div class="pred"><div class="muted">합력의 크기</div>'+
      '<div class="mag"><button data-a="mag" data-v="-5" aria-label="5 줄이기">−</button><output>'+st.mag+'</output><button data-a="mag" data-v="5" aria-label="5 늘리기">+</button></div>'+
      '<div class="muted">합력의 방향</div><div class="dirs">'+
      '<button data-a="dir" data-v="L" aria-pressed="'+(st.dir==='L')+'">← 왼쪽</button>'+
      '<button data-a="dir" data-v="Z" aria-pressed="'+(st.dir==='Z')+'">합력 0</button>'+
      '<button data-a="dir" data-v="R" aria-pressed="'+(st.dir==='R')+'">오른쪽 →</button></div>'+
      '<p class="muted">한 칸은 5예요. 오른쪽 화살표의 합과 왼쪽 화살표의 합을 비교해 보세요.</p>'+hint+
      '<button class="btn" data-a="check"'+(st.dir?'':' disabled')+'>예측 확인</button></div>';
  }
  function predCorrect(n){
    if(n===0)return st.dir==='Z';
    return st.mag===Math.abs(n)&&st.dir===(n>0?'R':'L');
  }

    if(pick==='t3'){f.outs[1].orig=10;f.outs[1].v=0;f.outs[1].tag='카드';}

  function ranking(){
    var list=[];
    function f1(v){return Math.round((parseFloat(v)||0)*10)/10;}
    board.forEach(function(r,i){if(r.s!==''&&r.s!=null)list.push({t:i+1,s:f1(r.s),m:f1(r.m),c:f1(r.c),x:f1(r.x),n:(live[i+1]||[]).filter(function(v){return v.final;}).length});});
    list.sort(function(a,b){return b.s-a.s||b.m-a.m||b.c-a.c||b.x-a.x;});
    list.forEach(function(r,i){
      var p=list[i-1];
      r.rank=(p&&p.s===r.s&&p.m===r.m&&p.c===r.c&&p.x===r.x)?p.rank:i+1;
    });
    return list;
  }

  function draw(){
    var v;
    if(st.phase==='start')v=startView();
    else if(st.phase==='tutorial')v=tutorialView();
    else if(st.phase==='practice')v=practiceView();
    else if(st.phase==='round')v=roundView();
    else if(st.phase==='bank')v=bankView();
    else if(st.phase==='end')v=endView();
    else if(st.phase==='teacher')v=teacherView();
    else v=wrapView();
    var key=st.phase+'|'+st.round+'|'+st.step+'|'+(st.predOk===null?'n':'y');
    var pnl=document.querySelector('.panel'), stg=document.querySelector('.stage-wrap');
    var keep={p:pnl?pnl.scrollTop:0,s:stg?stg.scrollTop:0,w:window.scrollY||0};
    document.getElementById('app').innerHTML=header()+v;
    justDrew=false;
    if(key===lastKey){
      var p2=document.querySelector('.panel'), s2=document.querySelector('.stage-wrap');
      if(p2)p2.scrollTop=keep.p; if(s2)s2.scrollTop=keep.s; window.scrollTo(0,keep.w);
    }
    lastKey=key;
    var mover=document.getElementById('mover');
    var showMove=(st.phase==='round'&&st.step==='result');
    if(mover&&showMove){
      var n=st.log[st.log.length-1].net;
      var dx=Math.max(-60,Math.min(60,n*2.4));
      requestAnimationFrame(function(){requestAnimationFrame(function(){mover.style.transform='translateX('+dx+'px)';});});
    }
    save();
  }

  document.addEventListener('click',function(e){

  function doAction(a,v,auto){
    if(!auto&&(a==='check'||a==='submit'||a==='tochoose'||a==='next'||a==='aftercompare'||a==='draw'))st.timeout=null;
    if(a==='team'){st.team=+v;}
    else if(a==='cls'){st.cls=+v;}
    else if(a==='resend'){sendFinal();}
    else if(a==='tcls'){if(st.tcls!==+v){st.tcls=+v;board=freshBoard();saveBoard();}rev=null;st.toast='';listen();}
    else if(a==='begin'){st.phase='tutorial';st.tut=0;st.tpick=null;st.sent=null;pushProgress();}
    else if(a==='tnext'){st.tut=Math.min(4,(st.tut||0)+1);}
    else if(a==='tprev'){st.tut=Math.max(0,(st.tut||0)-1);}
    else if(a==='tpick'){st.tpick=v;}
    else if(a==='tdone'){st.phase='practice';st.mag=0;st.dir=null;st.predOk=null;st.hint=false;}
    else if(a==='hint'){st.hint=true;}
    else if(a==='tmode'){st.tmode=v;}
    else if(a==='teacher'){st.phase='teacher';rev=null;st.toast='';listen();}
    else if(a==='home'){st.phase='start';st.toast='';stopListen();}
    else if(a==='clearboard'){
      if(!armClear){armClear=true;clearTimeout(armClearT);armClearT=setTimeout(function(){armClear=false;render();},4000);}
      else{armClear=false;clearTimeout(armClearT);board=freshBoard();saveBoard();clearRemote(st.tcls);live={};}
    }
    else if(a==='showrank'){if(ranking().length<2){st.toast='두 모둠 이상 점수를 입력하세요.';}else{st.toast='';rev=0;}}
    else if(a==='revnext'){rev++;}
    else if(a==='backinput'){rev=null;}
    else if(a==='mag'){st.mag=Math.max(0,Math.min(100,st.mag+(+v)));if(st.mag>0&&st.dir==='Z')st.dir=null;}
    else if(a==='dir'){st.dir=v;if(v==='Z')st.mag=0;}
    else if(a==='check'){
      var f=st.phase==='practice'?flows(null,[],false):flows(st.round,[],true);
      if(st.phase==='round'&&st.deadline)st.tsave=(st.tsave||0)+Math.max(0,Math.ceil((st.deadline-Date.now())/1000));
      st.predOk=predCorrect(netOf(f));st.deadline=null;
      if(st.phase==='round'&&st.predOk)st.score+=1;
    }
    else if(a==='go1'){st.phase='round';st.round=0;st.step='mission';pushProgress();}
    else if(a==='draw'){justDrew=true;st.step='predict';st.mag=0;st.dir=null;st.predOk=null;st.hint=false;startTimer('p');}
    else if(a==='tochoose'){st.step='choose';st.sel=[];st.toast='';startTimer('c');}
    else if(a==='card'){
      var i=st.sel.indexOf(v);st.toast='';
      if(i>=0)st.sel.splice(i,1);
      else if((v==='F'&&st.sel.indexOf('G')>=0)||(v==='G'&&st.sel.indexOf('F')>=0))st.toast='저축 줄이기와 저축 늘리기는 함께 낼 수 없어요.';
      else if(st.sel.length>=2)st.toast='카드는 한 라운드에 2장까지 낼 수 있어요.';
      else st.sel.push(v);
    }
    else if(a==='submit'){
      if(st.deadline)st.tsave=(st.tsave||0)+Math.max(0,Math.ceil((st.deadline-Date.now())/1000));
      var ff=flows(st.round,st.sel,true), n=netOf(ff), ok=ROUNDS[st.round].check(n);
      if(ok)st.score+=2;
      st.log.push({cards:st.sel.slice(),net:n,ok:ok,pred:!!st.predOk,save:saveVal(st.sel),give:null});
      st.used=st.used.concat(st.sel);st.sel=[];st.step='result';st.deadline=null;
    }
    else if(a==='give'){st.log[st.log.length-1].give=v;}
    else if(a==='wrap'){st.phase='wrap';}
    else if(a==='back'){st.phase='end';}
    else if(a==='way'){st.way=v;}
    else if(a==='why'){st.why=v;}
    else if(a==='aftercompare'){st.round=1;st.step='mission';st.predOk=null;pushProgress();}
    else if(a==='next'){
      if(st.round<3){st.round++;st.step='mission';st.predOk=null;}
      else{st.phase='bank';}
      pushProgress();
    }
    else if(a==='finish'){st.score+=bankTotals().bonus;st.phase='end';sendFinal();}
    else if(a==='reset'){
      if(st.phase!=='end'&&st.phase!=='wrap'&&!armReset){
        armReset=true;clearTimeout(armTimer);
        armTimer=setTimeout(function(){armReset=false;render();},4000);
        render();return;
      }
      armReset=false;clearTimeout(armTimer);
      var kc=st.cls,kn=st.num,kt=st.team,km=st.tmode;st=fresh();st.cls=kc;st.num=kn;st.team=kt;st.tmode=km;
    }
    render();
  }
  setInterval(function(){
    if(st.phase!=='round'||!st.deadline)return;
    var left=Math.ceil((st.deadline-Date.now())/1000);
    if(left<=0){
      var kind=st.step==='predict'?'p':st.step==='choose'?'c':null;
      st.deadline=null;
      if(kind==='p'&&st.predOk===null){st.timeout='p';doAction('check',null,true);return;}
      if(kind==='c'){st.timeout='c';doAction('submit',null,true);return;}
      render();return;
    }
    var t=document.getElementById('tmr'),sEl=document.getElementById('tmrs'),bEl=document.getElementById('tmrb');
    if(!t)return;
    sEl.textContent=left;bEl.style.width=(left/st.tlen*100)+'%';
    if(left<=10)t.classList.add('hurry');
  },250);
  document.addEventListener('input',function(e){
    var t=e.target; if(!t.hasAttribute)return;
    if(t.hasAttribute('data-num')){var nv=parseInt(t.value,10);st.num=(nv>=1&&nv<=40)?nv:null;save();var bb=document.getElementById('beginBtn');if(bb)bb.disabled=!ready();return;}
    if(!t.hasAttribute('data-in'))return;
    var r=board[+t.getAttribute('data-in')]; r[t.getAttribute('data-k')]=t.value; r.manual=true; t.classList.remove('auto'); saveBoard();
  });
  st.phase='teacher';rev=null;
  if(st.tcls)listen();
  if((st.phase==='end'||st.phase==='wrap')&&st.sent!=='ok'&&db)sendFinal();
  render();
})();
</script>
