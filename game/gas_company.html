<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기체 주식회사를 살려라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#e4ece9; --grout:#d0dbd7; --paper:#fffdf5; --ink:#1f2a2e; --muted:#5b6a6f;
  --steel:#2f5d73; --steel-d:#234859; --steel-l:#4b7d94; --hazard:#f4c430;
  --danger:#c9452f; --ok:#2b8f60; --line:#ddd5bf; --soft:#f3efe2;
  --wheel:#f7f4ea; --wheel-ink:#1f2a2e; --on-steel:#f2f6f7;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --tile:#172023; --grout:#202c30; --paper:#242e32; --ink:#edf1f0; --muted:#a6b3b7;
    --steel:#2a5265; --steel-d:#1d3d4b; --steel-l:#3e6e85; --line:#3a474c; --soft:#2c373b;
    --danger:#ef7a62; --ok:#3fae7c;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  font-family:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  color:var(--ink); background-color:var(--tile);
  background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);
  background-size:56px 56px; font-size:17px; line-height:1.55;
}
h1,h2,h3{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}

/* 상단 바 */
.bar{display:flex;align-items:center;gap:18px;padding:10px 22px;background:var(--steel-d);color:var(--on-steel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar h1{font-size:23px}
.doors{display:flex;gap:8px;list-style:none;margin:0 auto;padding:0}
.doors li{width:38px;height:46px;border-radius:6px 6px 2px 2px;background:var(--steel-l);display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:18px;color:var(--on-steel);opacity:.5}
.doors li.now{opacity:1;background:var(--hazard);color:#1f2a2e}
.doors li.done{opacity:1;background:var(--ok)}
.power{display:flex;align-items:center;gap:10px}
.cell{width:96px;height:22px;border:2px solid var(--on-steel);border-radius:4px;padding:2px;position:relative}
.cell::after{content:"";position:absolute;right:-7px;top:5px;width:4px;height:8px;background:var(--on-steel);border-radius:0 2px 2px 0}
.cell i{display:block;height:100%;width:100%;background:var(--hazard);border-radius:2px}
.cell.low i{background:#ff6b52}
.timer{font-family:'Jua',sans-serif;font-size:22px;min-width:78px}
.timer.over{color:#ff9d88}
.power.blink .cell{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.net{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--steel-l)}
.net.on{background:var(--ok)}.net.offline{background:#7a5a52}
.team{margin:18px 0 0;padding:16px 18px;background:var(--soft);border-radius:8px;text-align:left}
.team h3{font-size:22px;margin-bottom:6px}
.team ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.team li{padding:6px 10px;border-radius:6px;background:var(--paper)}
.team li.done{color:var(--ok)}
.team .rule{margin:10px 0 0;color:var(--danger)}
.mute{background:none;border:2px solid var(--steel-l);color:var(--on-steel);border-radius:20px;padding:4px 12px;font-size:14px}

main{max-width:1240px;margin:0 auto;padding:22px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:22px 26px;box-shadow:0 2px 0 var(--line)}
.room-name{color:var(--muted);font-size:15px;margin:0}
.paper h2{font-size:30px;margin-bottom:8px}
.story{margin:0 0 14px}

/* 시작 */
.start{max-width:780px;margin:24px auto}
.start h2{font-size:46px}
.alarm-strip{background:var(--danger);color:#fff;font-family:'Jua',sans-serif;font-size:20px;padding:8px 14px;border-radius:4px;margin:10px 0 14px;animation:blink 1.4s steps(2) 3}
.fields{display:grid;grid-template-columns:100px 100px 110px 1fr;gap:14px;margin:18px 0}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted)}
input,select,textarea{font-family:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:var(--soft);color:var(--ink)}
.rules{margin:0 0 18px;padding-left:20px}
.rules li{margin:4px 0}

.btn{border:none;border-radius:8px;padding:14px 26px;font-family:'Jua',sans-serif;font-size:21px;background:var(--hazard);color:#1f2a2e;box-shadow:0 4px 0 #b48c14}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b48c14}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5}

/* 방 */
.room{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
.door{background:var(--steel);border-radius:10px 10px 4px 4px;color:var(--on-steel);overflow:hidden;position:relative;box-shadow:inset 0 0 0 6px var(--steel-d);min-height:360px}
.hazard{height:22px;background:repeating-linear-gradient(45deg,var(--hazard) 0 16px,#1f2a2e 16px 32px)}
.door-in{padding:22px 22px 26px;display:flex;flex-direction:column;align-items:center;gap:14px}
.door-in h3{font-size:24px}
.lock-guide{margin:0;text-align:center;font-size:15px;opacity:.9}
.wheels{display:flex;gap:10px;padding:14px 16px;background:var(--steel-d);border-radius:12px}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel button{width:58px;height:40px;border:none;border-radius:8px;background:var(--steel-l);color:var(--on-steel);font-size:20px}
.wheel .val{width:58px;height:70px;border-radius:8px;background:var(--wheel);color:var(--wheel-ink);display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:42px;box-shadow:inset 0 6px 8px rgba(0,0,0,.18),inset 0 -6px 8px rgba(0,0,0,.18)}
.wheel-sep{align-self:center;font-family:'Jua',sans-serif;font-size:26px;opacity:.7}
.msg{min-height:26px;margin:0;text-align:center;font-size:17px}
.msg.bad{color:#ffd0c4}
.off{position:absolute;inset:0;background:rgba(18,32,38,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;font-family:'Jua',sans-serif;font-size:21px;color:var(--on-steel);padding:20px}
.off b{font-weight:400;font-size:48px;color:var(--hazard)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.opened{position:absolute;inset:0;background:var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;animation:open .5s ease-out;z-index:2}
.opened h3{font-size:38px}
@keyframes open{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}
.flash{animation:flash .6s}
@keyframes flash{0%,100%{box-shadow:inset 0 0 0 6px var(--steel-d)}30%{box-shadow:inset 0 0 0 14px #ff5a3c}}

/* 실험 장치 */
.lab{display:grid;grid-template-columns:minmax(220px,330px) 1fr;gap:18px;align-items:start}
.lab canvas,.cv{display:block;border-radius:8px}
.readouts{display:flex;gap:10px;margin-bottom:10px}
.readout{flex:1;background:var(--steel-d);color:var(--on-steel);border-radius:8px;padding:8px 12px}
.readout span{font-size:13px;opacity:.85;display:block}
.readout b{font-family:'Jua',sans-serif;font-weight:400;font-size:30px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tool{border:2px solid var(--steel);background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 14px;font-family:'Jua',sans-serif;font-size:18px}
.tool.main{background:var(--steel);color:var(--on-steel)}
.tool:disabled{opacity:.35}
.note{font-size:14px;color:var(--muted);margin:0 0 8px}
.setT{display:flex;align-items:center;gap:10px}
.setT b{font-family:'Jua',sans-serif;font-weight:400;font-size:34px;min-width:90px;text-align:center}
.data{border-collapse:collapse;margin:6px 0;font-size:17px}
.data th,.data td{border:2px solid var(--line);padding:5px 12px;text-align:center}
.data th{background:var(--soft);font-weight:400}

.bulbs{display:flex;flex-direction:column;gap:10px;width:100%}
.bulb{display:flex;align-items:center;gap:12px;background:var(--steel-d);padding:10px 14px;border-radius:8px;font-size:17px}
.bulb i{flex:none;width:26px;height:26px;border-radius:50%;background:#55666c}
.bulb.on i{background:#ffe066;box-shadow:0 0 18px #ffe066}
.bulb.now{outline:2px dashed var(--hazard)}

/* 카드 */
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0}
.card{width:min(100%,560px);min-height:160px;background:var(--soft);border:3px solid var(--line);border-radius:14px;padding:22px;font-size:25px;display:grid;place-items:center;text-align:center;font-family:'Jua',sans-serif;line-height:1.45}
.card.in{animation:cardin .3s ease-out}
@keyframes cardin{from{transform:translateY(-36px) rotate(-4deg);opacity:0}}
.choose{display:flex;gap:16px;width:min(100%,560px)}
.choose button{flex:1;padding:16px;border:none;border-radius:12px;font-family:'Jua',sans-serif;font-size:28px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.choose button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.choose .b{background:#2f6fa0}.choose .c{background:#cf5f27}
.choose small{display:block;font-size:14px;font-family:'Gowun Dodum',sans-serif}
.choose button:disabled{opacity:.6}
.why{min-height:54px;text-align:center;margin:0;font-size:18px}
.why.bad{color:var(--danger)}
.big{font-family:'Jua',sans-serif;font-size:58px;line-height:1;color:var(--hazard)}

/* 현미경 */
.scope{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0}
.opt{border:3px solid var(--line);border-radius:10px;padding:6px;text-align:center;background:var(--soft);color:var(--ink)}
.opt b{font-family:'Jua',sans-serif;font-weight:400;font-size:20px;display:block}
.opt canvas{width:100%;height:auto}
button.opt:hover{border-color:var(--steel-l)}
.opt.ref{border-style:dashed}
button.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--soft))}
button.opt.nope{border-color:var(--danger);opacity:.6}
.q{font-size:19px;margin:6px 0}

/* 탈출구·증명서 */
.final{max-width:860px;margin:0 auto}
.final textarea{width:100%;min-height:130px;resize:vertical}
.final label{display:block;margin:14px 0 6px}
.final select{width:100%}
.count{font-size:14px;color:var(--muted);text-align:right}
.hints{margin-top:16px;border-top:2px dashed var(--line);padding-top:12px}
.hint-btn{background:none;border:2px solid var(--line);border-radius:20px;padding:6px 16px;color:var(--ink);font-size:15px}
.hint{margin:10px 0 0;padding:10px 14px;background:var(--soft);border-left:5px solid var(--hazard);border-radius:4px}
.cert{max-width:900px;margin:0 auto;text-align:center}
.cert canvas{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);margin:10px 0 18px}
.cert .actions{display:flex;gap:14px;justify-content:center}

@media (max-width:960px){
  .room{grid-template-columns:1fr}
  .lab{grid-template-columns:1fr}
  .scope{grid-template-columns:repeat(3,1fr)}
  .fields{grid-template-columns:1fr 1fr}
  .fields label:last-child{grid-column:1/-1}
  .bar{flex-wrap:wrap;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.cashbox{position:relative;display:flex;align-items:baseline;gap:8px;background:var(--steel);border-radius:8px;padding:4px 14px}
.cashbox span.l{font-size:13px;opacity:.85}
.cashbox b{font-family:'Jua',sans-serif;font-weight:400;font-size:24px;color:var(--hazard)}
.cashbox.neg b{color:#ff9d88}
.pop{position:absolute;right:6px;top:100%;font-family:'Jua',sans-serif;font-size:22px;animation:rise 1.4s forwards;pointer-events:none;white-space:nowrap}
.pop.up{color:#7be3a9}.pop.down{color:#ff9d88}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(26px);opacity:0}}
.timer{font-family:'Jua',sans-serif;font-size:20px;min-width:64px}
.orders{display:flex;flex-direction:column;gap:12px;width:100%}
.order{background:var(--steel-d);border-radius:8px;padding:12px 14px}
.order p{margin:0 0 10px;font-size:16px}
.opt-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick-btn{border:none;border-radius:8px;padding:10px 6px;background:var(--wheel);color:var(--wheel-ink);font-family:'Jua',sans-serif;font-size:20px}
.pick-btn small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:12px;opacity:.75}
.pick-btn:disabled{opacity:.4}
.pick-btn.chosen{opacity:1;background:var(--hazard);box-shadow:0 0 0 3px #fff}
.result{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:15px;background:rgba(255,255,255,.12);border-left:5px solid #ff9d88}
.result.ok{border-left-color:#7be3a9}
.big-num{font-family:'Jua',sans-serif;font-size:46px;margin:0}
.opt .ad{display:block;font-size:13px;line-height:1.35;margin-top:4px;min-height:36px}
.ledger{margin:16px 0 0;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.ledger summary{cursor:pointer;font-family:'Jua',sans-serif;font-size:18px}
.ledger table{width:100%}
.ledger td.neg{color:var(--danger)}.ledger td.pos{color:var(--ok)}
.fields{grid-template-columns:90px 90px 100px 1fr}

.mode-badge{display:inline-block;margin:4px 0 0;padding:2px 12px;border-radius:20px;background:var(--steel);color:var(--on-steel);font-size:14px}
.term-card{background:rgba(255,255,255,.16);border-radius:10px;padding:12px 16px;max-width:88%;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.45}
.term-card b{font-family:'Gowun Dodum',sans-serif;font-weight:400;font-size:13px;opacity:.85}
.term-card .tname{font-family:'Jua',sans-serif;font-size:24px}
.opened{overflow:auto;padding:16px}
.calc{margin-top:6px;font-size:15px}
.pl{border-collapse:collapse;margin:8px 0 4px;font-size:13px;width:100%}
.pl th,.pl td{border:1px solid rgba(255,255,255,.25);padding:3px 5px;text-align:center}
.pl tr.me td{background:rgba(244,196,48,.3)}
.pl td.neg{color:#ffb3a3}.pl td.pos{color:#9ff0c3}
.tip{display:block;margin-top:6px;font-size:14px;opacity:.95}
.app-card{background:var(--soft);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.app-card p{margin:0 0 8px}
.app-card .pick-btn{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.app-card .pick-btn.chosen{background:var(--hazard);color:#1f2a2e}
.app-card .result{background:var(--paper);color:var(--ink)}
.invest{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.inv-row{display:grid;grid-template-columns:1fr 52px 120px 52px;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 12px}
.inv-row .inv-name{font-family:'Jua',sans-serif;font-size:21px}
.inv-row b{font-family:'Jua',sans-serif;font-weight:400;font-size:24px;text-align:center}
.inv-row .tool{font-size:22px;padding:6px 0}
.reason-l{font-size:15px;margin-top:4px}
#reason{width:100%}
.event{font-family:'Jua',sans-serif;font-size:30px;color:var(--hazard);text-align:center}
.event small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:14px;color:var(--on-steel)}
.pl.wide{font-size:14px}
.evwhy{list-style:none;padding:0;margin:8px 0;font-size:14px;line-height:1.45;text-align:left}
.evwhy li{margin:4px 0}
#invRes{width:100%}
.term{margin:14px 0 0;padding:10px 14px;background:var(--soft);border-left:5px solid var(--steel);border-radius:4px}
.room .door{min-height:430px}
.risk{margin-top:10px;padding:10px 12px;border-radius:8px;background:rgba(244,196,48,.18);border:2px dashed var(--hazard)}
.risk p{margin:0 0 8px;font-size:15px}
.forecast{background:var(--soft);border-left:5px solid var(--steel);border-radius:6px;padding:10px 14px;margin:6px 0 10px;font-size:15px}
.fc-bars{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.fc-row{display:grid;grid-template-columns:110px 1fr 48px;align-items:center;gap:8px}
.fc-row i{display:block;height:16px;background:var(--steel-l);border-radius:4px}
.fc-row em{font-style:normal;font-family:'Jua',sans-serif;font-size:18px}
.pred{background:var(--soft);border-radius:8px;padding:8px 12px;margin:6px 0}
.pred-q{font-family:'Jua',sans-serif;font-size:19px;display:block;margin-bottom:6px}
.pred-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pred .pick-btn{background:var(--paper);color:var(--ink);border:2px solid var(--line);font-size:17px}
.pred .pick-btn.chosen{background:var(--hazard);color:#1f2a2e}
.pred-fb{margin:6px 0 0;font-size:14px}.pred-fb.ok{color:var(--ok)}.pred-fb.no{color:var(--danger)}
.hidden{display:none}
.ins-box{background:var(--soft);border:2px dashed var(--steel-l);border-radius:8px;padding:10px 12px}
.ins-box p{margin:0 0 8px;font-size:14px}
.ins-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ins-btn{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px;font-family:'Jua',sans-serif;font-size:18px}
.ins-btn small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:12px;opacity:.8}
.ins-btn.on{background:var(--steel);border-color:var(--steel);color:var(--on-steel)}
.pl.wide{font-size:12px}
.impact{border-collapse:collapse;width:100%;font-size:15px;margin:4px 0 10px}
.impact th,.impact td{border:1px solid var(--line);padding:6px;text-align:center}
.impact th{background:var(--soft);font-weight:400}
.impact .dn{color:var(--danger)}.impact .up{color:var(--ok)}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.frame-btn{border:2px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:10px;text-align:left}
.frame-btn b{font-family:'Jua',sans-serif;font-weight:400;font-size:17px;display:block}
.frame-btn small{font-size:12px;color:var(--muted)}
.frame-btn.on{border-color:var(--steel);background:var(--steel);color:var(--on-steel)}.frame-btn.on small{color:var(--on-steel)}
.frame-btn:disabled:not(.on){opacity:.45}
.fill{margin-top:12px;padding:12px 14px;background:var(--soft);border-radius:8px}
.fill-s{font-size:20px;line-height:2.1}
.blank{font-size:18px;padding:4px 8px;margin:0 2px;border:2px solid var(--steel-l);border-radius:6px;background:var(--paper);color:var(--ink)}
.blank.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 15%,var(--paper))}
.blank.right{border-color:var(--ok)}
.fill textarea{width:100%;min-height:100px}
.actions-row{display:flex;gap:10px;flex-wrap:wrap}
.team-pitch{margin-top:10px;padding:10px 12px;background:var(--paper);border-radius:6px;border-left:5px solid var(--steel)}
.team-pitch p{margin:6px 0 0;font-size:15px}
.final select.blank{width:auto;display:inline-block}
.guide-wrap{max-width:980px;margin:0 auto}
.guide h2{font-size:34px}
.guide h3{font-size:22px;margin:16px 0 8px}
.g-lead{font-size:17px}
.biz{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.biz div{background:var(--steel);color:var(--on-steel);border-radius:10px;padding:12px 14px}
.biz b{font-family:'Jua',sans-serif;font-weight:400;font-size:22px;display:block}
.biz span{font-size:14px;opacity:.9}

</head>
<body>
<header class="bar">
  <h1>기체 주식회사를 살려라</h1>
  <ol class="doors" id="doors"></ol>
  <div class="cashbox" id="cashBox"><span class="l">회사 자산</span><b id="cash">10,000원</b></div>
  <span class="timer" id="timer">00:00</span>
  <span class="net" id="net">순위판 연결 중</span>
  <button class="mute hidden" id="guideBtn">안내서</button>
  <button class="mute" id="mute">소리 켬</button>
</header>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const COL='gasCompany';
const Net={ok:false,mode:'',db:null,err:'',
  async init(){
    try{
      if(typeof firebase==='undefined'){this.err='SDK 없음';return}
      if(!firebase.apps.length){
        let cfg=null;
        for(const n of ['firebaseConfig','FIREBASE_CONFIG','firebase_config','fbConfig','firebaseCfg','config','CONFIG']){
          try{const v=window[n]!==undefined?window[n]:(0,eval)(n);if(v&&v.apiKey){cfg=v;break}}catch(e){}
        }
        if(!cfg){
          try{const m=await import('./firebase-config.js');
            for(const v of [m.default,...Object.values(m)]){if(!v)continue;if(v.apiKey){cfg=v;break}if(v.options&&v.options.apiKey){cfg=v.options;break}}
          }catch(e){this.err='설정 파일을 읽지 못함: '+e.message}
        }
        if(!cfg){this.err=this.err||'설정 파일에서 firebaseConfig를 찾지 못함';return}
        firebase.initializeApp(cfg);
      }
      const opt=firebase.app().options;
      if(opt.databaseURL&&firebase.database){this.mode='rtdb';this.db=firebase.database()}
      else if(firebase.firestore){this.mode='fs';this.db=firebase.firestore()}
      this.ok=!!this.db;
    }catch(e){this.err=e.message;console.warn(e)}
  },
  col(session){return this.db.collection(COL).doc(session).collection('players')},
  save(session,id,data){
    if(!this.ok)return Promise.resolve();
    try{
      data=JSON.parse(JSON.stringify(data));
      return this.mode==='rtdb'?this.db.ref(`${COL}/${session}/players/${id}`).update(data):this.col(session).doc(String(id)).set(data,{merge:true});
    }catch(e){return Promise.reject(e)}
  },
  remove(session,id){
    if(!this.ok)return Promise.resolve();
    return this.mode==='rtdb'?this.db.ref(`${COL}/${session}/players/${id}`).remove():this.col(session).doc(String(id)).delete();
  },
  watch(session,cb,onErr){
    if(!this.ok)return()=>{};
    if(this.mode==='rtdb'){const r=this.db.ref(`${COL}/${session}/players`);const f=s=>cb(Object.values(s.val()||{}));r.on('value',f,onErr);return()=>r.off('value',f)}
    return this.col(session).onSnapshot(q=>cb(q.docs.map(d=>d.data())),onErr);
  }
};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sessionId=(cls,date=today())=>`${date}_${cls}반`;
/* ===== 수업 모드 ===== */
const MODE=new URLSearchParams(location.search).get('t')==='20'?20:30;
const PLAN=MODE===30?['factory','balloon','insure','ad','invest','pitch']:['factory','balloon','insure','ad','invest'];
const NAMES={factory:'과자 포장 공장',balloon:'열기구 관광',insure:'보험 심사실',ad:'광고 심사실',invest:'투자 결정',pitch:'모둠 투자 설명회'};
const TERMS={
  factory:['원가와 이익','이익 = 매출 - 비용이에요. 질소 값(원가)과 배상금도 모두 비용이라, 많이 넣는다고 무조건 좋은 게 아니에요.'],
  balloon:['손익 따져 보기','같은 매출이라면 비용을 줄일수록 이익이 커져요. 꼭 필요한 만큼만 쓰는 게 합리적인 선택이에요.'],
  insure:['보험료와 보험금','보험료는 미리 내는 돈, 보험금은 사고가 났을 때 받는 돈이에요. 사고 위험이 클수록 보험료가 비싸요.'],
  ad:['허위·과장 광고','사실과 다르거나 부풀린 광고예요. 근거를 따져 보고, 피해를 입으면 소비자상담센터(1372)에 상담할 수 있어요.'],
  invest:['위험 분산','미래는 아무도 몰라요. 한 곳에 몰지 않고 나눠 투자하면 크게 잃을 위험을 줄일 수 있어요.'],
  pitch:['투자 유치','사업이 믿을 만한 근거를 설명해 다른 사람의 돈을 투자받는 거예요.']
};
const ROOM_NAMES=PLAN.map(k=>NAMES[k]);
const N=PLAN.length;
const ROOMS=PLAN.map(k=>({factory:roomFactory,balloon:roomBalloon,insure:roomInsure,ad:roomAd,invest:roomInvest,pitch:roomPitch})[k]);
function go(i){if(i>=N)return finish();ROOMS[i](i)}
function finish(){if(!S.explain){S.explain=S.reason;S.product='투자 이유 ('+S.event+')'}S.end=Date.now();clearInterval(tick);$('timer').textContent=fmt(S.end-S.start);S.room=N;renderDoors();sfx.open();sync(true);certificate()}

/* ===== 과자 포장 공장 (보일) ===== */
function roomFactory(i){
  const ORDERS=[{place:'산 정상 휴게소',ratio:2,txt:'공장 <b>2기압</b> → 휴게소 <b>1기압</b>'},{place:'고산 마을',ratio:3,txt:'공장 <b>3기압</b> → 마을 <b>1기압</b>'}];
  const MAX=120,OPTS=[20,40,60,80],PRICE=4000,UNIT=100; // 질소 10mL당 100원
  scaffold(i,`<p class="story">우리 회사 과자 봉지는 질소를 넣어 과자가 부서지지 않게 해요. 그런데 높은 곳으로 배송하면 봉지가 부풀어 터지는 사고가 났어요! 먼저 주사기 실험으로 압력과 부피의 관계를 알아낸 뒤, 주문을 처리하세요.</p>
   <div class="lab"><canvas id="c1"></canvas><div>
    <div class="readouts"><div class="readout"><span>압력</span><b id="rP">2기압</b></div><div class="readout"><span>공기의 부피</span><b id="rV">60 mL</b></div></div>
    <div class="ctrls"><button class="tool" id="up">추 올리기</button><button class="tool" id="dn">추 내리기</button><button class="tool main" id="rec">실험 기록하기</button></div>
    <p class="note">온도는 일정해요. 추를 올리면 압력이 커지고, <b>추를 내리면 압력이 작아져요.</b> 공장은 압력이 높은 곳, 산 위는 압력이 낮은 곳이에요.</p>
    <canvas id="g1"></canvas>
    <p class="note">과자 한 상자 판매가 ${won(PRICE)} · 질소 원가 10 mL당 ${won(UNIT)}<br>봉지가 헐렁하면 과자가 부서져 절반 값, 터지면 판매 못 하고 배상금 ${won(1000)}</p></div></div>`,
   `<h3>배송 주문서</h3><div id="orders" class="orders"></div><p class="msg" id="msg"></p>
    <div class="off" id="off">실험 기록을 3개 모으면<br>주문서가 열려요<b id="recN">0 / 3</b></div>`,
   ['주사기에서 추를 내려 2기압에서 1기압으로 바꿔 보세요. 부피가 몇 배가 되나요?','2기압 → 1기압이면 부피는 2배, 3기압 → 1기압이면 3배가 돼요. 도착했을 때 120 mL를 넘지 않으면서 가장 빵빵한 양을 고르세요.']);
  const c=setup($('c1'),300,370),g=setup($('g1'),320,200);
  let P=2,h=120;const X0=100,X1=200,BOT=340,rec={};
  const gas=new Gas(10,{x0:X0,x1:X1,y0:100,y1:BOT},1.4);
  function draw(){
    h+=(240/P-h)*.07;const top=BOT-h;
    c.fillStyle='#eef3f1';c.fillRect(0,0,300,370);
    c.font='12px "Gowun Dodum",sans-serif';c.fillStyle='#5b6a6f';c.strokeStyle='#9aa7ab';c.lineWidth=1.5;
    for(let m=0;m<=120;m+=20){const y=BOT-m*2;c.beginPath();c.moveTo(X1,y);c.lineTo(X1+10,y);c.stroke();c.fillText(m+' mL',X1+14,y+4)}
    c.fillStyle='#fff';c.fillRect(X0,40,X1-X0,BOT-40);
    gas.step({x0:X0,x1:X1,y0:top,y1:BOT},5);gas.draw(c,5);
    c.strokeStyle='#7d8b90';c.lineWidth=3;c.strokeRect(X0,40,X1-X0,BOT-40);
    c.fillStyle='#c9452f';c.fillRect(140,BOT+1,20,16);
    c.fillStyle='#8a979c';c.fillRect(X0+2,top-14,X1-X0-4,14);
    c.fillStyle='#b3bec2';c.fillRect(146,top-74,8,60);
    const pf=top-74;c.fillStyle='#5b6a6f';c.fillRect(105,pf-6,90,6);
    for(let k=0;k<P-1;k++){const y=pf-6-(k+1)*25;c.fillStyle='#2f5d73';c.fillRect(115,y,70,23);c.fillStyle='#fff';c.font='15px Jua,sans-serif';c.fillText('추',143,y+17)}
  }
  function graph(){
    g.fillStyle='#eef3f1';g.fillRect(0,0,320,200);
    const px=p=>44+p*80,py=v=>172-v*1.1;
    g.strokeStyle='#5b6a6f';g.lineWidth=2;g.beginPath();g.moveTo(44,20);g.lineTo(44,172);g.lineTo(312,172);g.stroke();
    g.font='12px "Gowun Dodum",sans-serif';g.fillStyle='#5b6a6f';
    for(let p=1;p<=3;p++)g.fillText(p,px(p)-3,188);
    for(let v=0;v<=120;v+=40)g.fillText(v,v<100?24:16,py(v)+4);
    g.fillText('부피(mL)',50,16);g.fillText('압력(기압)',250,160);
    g.fillStyle='#c9452f';Object.keys(rec).forEach(p=>{g.beginPath();g.arc(px(+p),py(rec[p]),6,0,Math.PI*2);g.fill()});
  }
  function readout(){$('rP').textContent=P+'기압';$('rV').textContent=Math.round(120/P)+' mL';$('up').disabled=P>=3;$('dn').disabled=P<=1}
  $('up').onclick=()=>{if(P<3){P++;sfx.click();readout()}};
  $('dn').onclick=()=>{if(P>1){P--;sfx.click();readout()}};
  $('rec').onclick=()=>{
    if(rec[P]){sfx.click();return}
    rec[P]=120/P;graph();const n=Object.keys(rec).length;sfx.click();
    if($('recN'))$('recN').textContent=n+' / 3';
    if(n>=3&&$('off')){$('off').remove();sfx.open();showOrder()}
  };
  let oi=0;
  function showOrder(){
    if(oi>=ORDERS.length){setTimeout(()=>openDoor(i),900);return}
    const o=ORDERS[oi];
    $('orders').insertAdjacentHTML('beforeend',`<div class="order" id="o${oi}"><p><b>주문 ${oi+1}. ${o.place}</b><br>${o.txt}예요. 봉지는 <b>${MAX} mL</b>까지 버텨요. 공장에서 질소를 몇 mL 넣을까요?</p>
      <div class="opt-row">${OPTS.map(v=>`<button class="pick-btn" data-v="${v}">${v} mL<small>원가 ${won(v/10*UNIT)}</small></button>`).join('')}</div></div>`);
    document.querySelectorAll(`#o${oi} .pick-btn`).forEach(b=>b.onclick=()=>decide(+b.dataset.v));
  }
  function decide(v){
    const o=ORDERS[oi],box=$('o'+oi);
    box.querySelectorAll('.pick-btn').forEach(b=>{b.disabled=true;if(+b.dataset.v===v)b.classList.add('chosen')});
    if(MODE===30&&oi===0){
      box.insertAdjacentHTML('beforeend',`<div class="risk" id="risk"><p><b>잠깐! 배송 위험</b> 날씨가 더우면 트럭 짐칸이 뜨거워질 수 있어요(3번 중 1번꼴). 그러면 봉지 속 기체 부피가 더 커져요.</p>
        <div class="opt-row"><button class="pick-btn" data-r="0">그대로 보내기<small>추가 비용 없음</small></button><button class="pick-btn" data-r="1">냉장 트럭 쓰기<small>추가 ${won(500)}</small></button></div></div>`);
      box.querySelectorAll('#risk .pick-btn').forEach(b=>b.onclick=()=>{box.querySelectorAll('#risk .pick-btn').forEach(x=>{x.disabled=true;if(x===b)x.classList.add('chosen')});settle(v,b.dataset.r==='1')});
    }else settle(v,null);
  }
  function settle(v,cool){
    const o=ORDERS[oi],box=$('o'+oi),best=MAX/o.ratio,cost=v/10*UNIT,coolCost=cool?500:0;
    const hot=cool===false&&Math.random()<1/3;
    const after=v*o.ratio*(hot?1.2:1);
    let sale,extra=0,why;
    if(after>MAX){sale=0;extra=1000;why=hot?`짐칸이 뜨거워져 봉지가 더 부풀었어요(샤를 법칙). ${Math.round(after)} mL가 되어 <b>봉지가 터졌어요!</b>`:`도착하니 ${after} mL로 부풀어 <b>봉지가 터졌어요!</b>`;if(!hot)S.wrong[i]++}
    else if(v<best){sale=PRICE/2;S.wrong[i]++;why=`도착하니 ${Math.round(after)} mL. 봉지가 헐렁해 과자가 부서져 절반 값에 팔았어요.`}
    else{sale=PRICE;why=cool?`냉장 트럭 덕분에 온도가 그대로라 딱 ${after} mL! 제값을 받았어요.`:cool===false?`다행히 날씨가 선선해 딱 ${after} mL! 제값을 받았어요.`:`도착하니 딱 ${after} mL! 과자가 멀쩡해 제값을 받았어요.`}
    const amt=sale-cost-extra-coolCost;
    let tip='';
    if(cool!==null)tip=`<span class="tip">${cool?'500원으로 위험을 막았어요. 위험에 대비하는 데 쓰는 돈도 비용이에요.':hot?'위험에 대비하지 않으면 운이 나쁠 때 크게 잃어요.':'이번엔 운이 좋았어요. 하지만 3번 중 1번은 터질 수 있었어요.'}</span>`;
    box.insertAdjacentHTML('beforeend',result(`${why}<div class="calc">매출 ${won(sale)} - 원가 ${won(cost)}${coolCost?` - 냉장 트럭 ${won(coolCost)}`:''}${extra?` - 배상금 ${won(extra)}`:''} = <b>${sgn(amt)}</b></div>${tip}`,v===best&&!hot));
    money(i,`${o.place} 배송`,amt);if(amt<0)hit($('door'));
    oi++;setTimeout(showOrder,900);
  }
  graph();readout();setLoops([draw]);
}

/* ===== 열기구 관광 (샤를) ===== */
function roomBalloon(i){
  const TOURS=[{name:'가족 관광 (4명)',need:54,rev:4000,opts:[10,20,30,40]},{name:'단체 관광 (8명)',need:58,rev:6000,opts:[20,30,40,50]}];
  const FUEL=500;
  scaffold(i,`<p class="story">열기구는 버너로 공기를 데워 부피를 키워서 떠요. 탑승 인원이 많을수록 풍선 부피가 더 커야 해요. 온도를 높일수록 연료비가 들어요. <b>떠오를 수 있는 가장 낮은 온도</b>를 고르면 이익이 가장 커요!</p>
   <div class="lab"><canvas id="c2"></canvas><div>
    <div class="readouts"><div class="readout"><span>지금 온도</span><b id="rT">0°C</b></div><div class="readout"><span>풍선 속 기체 부피</span><b id="rV2">50 mL</b></div></div>
    <p class="note">시험 비행 기록 (압력 일정)</p>
    <table class="data"><tr><th>온도(°C)</th><td>0</td><td>10</td></tr><tr><th>부피(mL)</th><td>50</td><td>52</td></tr></table>
    <p class="note">연료비: 온도 10°C마다 ${won(FUEL)} · 뜨지 못하면 매출 없이 연료비만 나가요.</p>
   </div></div>`,
   `<h3>관광 예약</h3><div id="tours" class="orders"></div><p class="msg" id="msg"></p>`,
   ['기록지를 보면 온도가 10°C 올라갈 때마다 부피가 2 mL씩 늘어나요.','54 mL는 50 mL보다 4 mL 커요. 2 mL에 10°C이니 20°C면 돼요. 58 mL는 몇 °C일까요?']);
  const c=setup($('c2'),340,372);
  let T=0,target=0,running=false,ti=0,cb=null;
  const gas=new Gas(10,{x0:134,x1:206,y0:232,y1:304},1);
  const vol=t=>50+t*.2,R=v=>16+(v-48)*5,NECK=170;
  function draw(){
    if(running){const d=target-T;if(Math.abs(d)<=.25){T=target;running=false;cb&&cb()}else T+=Math.sign(d)*.25;
      $('rT').textContent=Math.round(T)+'°C';$('rV2').textContent=(Math.round(vol(T)*10)/10)+' mL'}
    c.fillStyle='#eef3f1';c.fillRect(0,0,340,372);
    const v=vol(T),r=R(v);
    if(ti<TOURS.length){const ly=NECK-1.9*R(TOURS[ti].need);c.setLineDash([8,6]);c.strokeStyle='#2b8f60';c.lineWidth=3;c.beginPath();c.moveTo(22,ly);c.lineTo(318,ly);c.stroke();c.setLineDash([]);
      c.fillStyle='#2b8f60';c.font='13px Jua,sans-serif';c.fillText(`탑승 기준 ${TOURS[ti].need} mL`,10,ly-8)}
    c.fillStyle='#e8913a';c.beginPath();c.ellipse(170,NECK-r*.95,r*.88,r*.95,0,0,Math.PI*2);c.fill();
    c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2;for(let k=-1;k<=1;k++){c.beginPath();c.ellipse(170,NECK-r*.95,Math.abs(k)*r*.55+.1,r*.95,0,0,Math.PI*2);c.stroke()}
    c.strokeStyle='#7d8b90';c.lineWidth=3;c.fillStyle='#fff';
    c.fillRect(158,NECK,24,50);c.strokeRect(158,NECK,24,50);
    c.beginPath();c.arc(170,268,52,0,Math.PI*2);c.fill();c.stroke();
    gas.step({x0:134,x1:206,y0:230,y1:306},5,.4+T/18);gas.draw(c,5);
    const k=T/60;c.fillStyle=`rgba(${Math.round(110+135*k)},${Math.round(175-70*k)},${Math.round(235-150*k)},.45)`;c.fillRect(40,272,260,76);
    c.strokeStyle='#7d8b90';c.lineWidth=3;c.strokeRect(40,272,260,76);
    if(running&&target>T){c.fillStyle='#ff8a1f';for(let x=90;x<=250;x+=40){const f=8+Math.random()*8;c.beginPath();c.moveTo(x-8,370);c.lineTo(x,370-f-6);c.lineTo(x+8,370);c.fill()}}
  }
  function showTour(){
    if(ti>=TOURS.length){setTimeout(()=>openDoor(i),900);return}
    const t=TOURS[ti];
    $('tours').insertAdjacentHTML('beforeend',`<div class="order" id="t${ti}"><p><b>예약 ${ti+1}. ${t.name}</b><br>풍선 부피가 <b>${t.need} mL</b> 이상이어야 떠요. 매출 ${won(t.rev)}</p>
      <div class="opt-row">${t.opts.map(o=>`<button class="pick-btn" data-v="${o}">${o}°C<small>연료 ${won(o/10*FUEL)}</small></button>`).join('')}</div></div>`);
    document.querySelectorAll(`#t${ti} .pick-btn`).forEach(b=>b.onclick=()=>fly(+b.dataset.v));
  }
  function fly(temp){
    const t=TOURS[ti],box=$('t'+ti);
    box.querySelectorAll('.pick-btn').forEach(b=>{b.disabled=true;if(+b.dataset.v===temp)b.classList.add('chosen')});
    target=temp;running=true;
    cb=()=>{
      cb=null;const ok=vol(temp)>=t.need-.01,fuel=temp/10*FUEL,best=Math.min(...t.opts.filter(o=>vol(o)>=t.need-.01));
      const amt=ok?t.rev-fuel:-fuel;if(!ok)S.wrong[i]++;
      const rows=t.opts.map(o=>{const f=o/10*FUEL,fl=vol(o)>=t.need-.01,p=fl?t.rev-f:-f;return `<tr class="${o===temp?'me':''}"><td>${o}°C</td><td>${vol(o)} mL</td><td>${fl?'뜸':'못 뜸'}</td><td>${won(fl?t.rev:0)}</td><td>${won(f)}</td><td class="${p<0?'neg':'pos'}">${sgn(p)}</td></tr>`}).join('');
      box.insertAdjacentHTML('beforeend',result(`${ok?`부피 ${vol(temp)} mL로 떠올랐어요!`:`부피 ${vol(temp)} mL라 뜨지 못했어요.`} <b>${sgn(amt)}</b>
        <table class="pl"><tr><th>온도</th><th>부피</th><th>비행</th><th>매출</th><th>연료비</th><th>손익</th></tr>${rows}</table>
        <span class="tip">${ok&&temp===best?'가장 적은 연료로 떴어요. 최고의 선택!':`가장 이익이 큰 선택은 ${best}°C였어요.`}</span>`,ok&&temp===best));
      money(i,t.name,amt);if(!ok)hit($('door'));

    };
  }
  setLoops([draw]);showTour();
}

function roomPitch(i){

function tone(f,d,type='sine',v=.07,delay=0){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}

function setup(el,w,h){const d=Math.min(window.devicePixelRatio||1,2);el.width=w*d;el.height=h*d;el.style.width='100%';el.style.maxWidth=w+'px';el.style.height='auto';const c=el.getContext('2d');c.scale(d,d);return c}
class Gas{
  constructor(n,b,speed){this.p=[];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;this.p.push({x:b.x0+Math.random()*(b.x1-b.x0),y:b.y0+Math.random()*(b.y1-b.y0),vx:Math.cos(a)*speed,vy:Math.sin(a)*speed})}}
  step(b,r,mul=1){for(const p of this.p){p.x+=p.vx*mul;p.y+=p.vy*mul;
    if(p.x<b.x0+r){p.x=b.x0+r;p.vx=Math.abs(p.vx)}if(p.x>b.x1-r){p.x=b.x1-r;p.vx=-Math.abs(p.vx)}
    if(p.y<b.y0+r){p.y=b.y0+r;p.vy=Math.abs(p.vy)}if(p.y>b.y1-r){p.y=b.y1-r;p.vy=-Math.abs(p.vy)}}}
  draw(c,r,col='#2f5d73'){c.fillStyle=col;for(const p of this.p){c.beginPath();c.arc(p.x,p.y,r,0,Math.PI*2);c.fill()}}
}

  x.fillStyle='#1f2a2e';x.font='26px "Gowun Dodum", sans-serif';wrapLines(x,S.explain+(S.extra?'\n도전: '+S.extra:''),1040).slice(0,4).forEach((l,k)=>x.fillText(l,80,674+k*38));
  x.fillStyle='#5b6a6f';x.font='22px "Gowun Dodum", sans-serif';x.fillText('배운 금융 용어: '+PLAN.map(k=>TERMS[k][0]).join(', '),60,850);
  const d=new Date(S.end);x.textAlign='right';x.font='20px "Gowun Dodum", sans-serif';x.fillText(`${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,1140,850);
  return c;
}
async function certificate(){
  try{await document.fonts.ready}catch(e){}
  const profit=S.cash-START_CASH;
  app.innerHTML=`<section class="cert"><h2 style="font-size:40px">${profit>=0?'회사를 살려 냈어요!':'아쉽게 적자예요'}</h2><p>결산서를 저장해서 제출하세요.</p><div id="cv"></div>
    <div class="actions"><button class="btn" id="save">이미지 저장하기</button><button class="btn ghost" id="again">처음부터 다시</button></div><p class="msg" id="smsg"></p><div class="team" id="teamBox"></div>
    <details class="ledger"><summary>거래 내역 보기 (${S.ledger.length}건)</summary><table class="data"><tr><th>부서</th><th>내용</th><th>금액</th></tr>${S.ledger.map(l=>`<tr><td>${l.room+1}. ${ROOM_NAMES[l.room]}</td><td>${esc(l.label)}</td><td class="${l.amt<0?'neg':'pos'}">${sgn(l.amt)}</td></tr>`).join('')}</table></details></section>`;
  const c=drawCert();$('cv').appendChild(c);
  $('save').onclick=()=>{try{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`기체주식회사_${S.cls}반_${S.num}번_${S.name}.png`;document.body.appendChild(a);a.click();a.remove();$('smsg').textContent='저장했어요. 갤러리나 다운로드 폴더를 확인하세요.'}catch(e){$('smsg').textContent='저장하지 못했어요. 화면을 캡처해 제출하세요.'}};
  $('again').onclick=()=>{if(confirm('기록이 지워져요. 처음부터 다시 할까요?')){stopTeam();startScreen()}};
  watchTeam();
}
startScreen();
Net.init().then(()=>netState(Net.ok,Net.ok?'순위판 연결됨':'순위판 미연결'));
</script>
