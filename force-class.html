<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Force Class · 마무리 형성평가</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dfe5ef;--brand:#2563eb;--good:#16803c;--bad:#b42318;--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1080px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #1720330d}
h1,h2,h3{margin:.2em 0 .6em}.muted{color:var(--muted)}button,input,textarea,select{font:inherit}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer;background:#e9eef8;color:var(--ink)}
button.primary{background:var(--brand);color:#fff}button.good{background:var(--good);color:#fff}button.danger{background:#fee4e2;color:#912018}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hide{display:none!important}.pill{padding:6px 10px;border-radius:999px;background:#edf2ff;font-weight:700}.big{font-size:clamp(26px,5vw,48px);font-weight:900}
.option{display:block;width:100%;text-align:left;margin:8px 0;background:#f8fafc;border:2px solid var(--line)}.option.sel{border-color:var(--brand);background:#eff6ff}
.bar{height:22px;background:#e9eef8;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--brand);transition:.3s}.stat{font-size:28px;font-weight:900}
.qedit{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.small{font-size:13px}.ok{color:var(--good)}.err{color:var(--bad)}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Force Class</h1><div class="muted">익명 응답형 수업 마무리 · v3</div></div><span class="pill" id="net">Firebase 연결 준비</span></div>
<div id="home" class="card"><h2>시작하기</h2><div class="row"><button class="primary" id="teacherBtn">교사 모드</button><button id="studentBtn">학생 모드</button></div></div>

<section id="teacherSetup" class="hide">
<div class="card"><h2>문제 세트 관리</h2><div class="grid"><div><label>세트 이름</label><input id="setName" value="과학에서의 힘 · 마무리"></div><div><label>저장된 세트</label><select id="savedSets"></select></div></div>
<div class="row" style="margin-top:10px"><button id="loadSet">불러오기</button><button id="saveSet">이 브라우저에 저장</button><button id="newSet">새 세트</button><button id="addQ">문제 추가</button></div>
<div id="editor"></div></div>
<div class="card"><button class="primary" id="makeRoom">이 문제 세트로 수업방 만들기</button><div id="makeMsg" class="small muted"></div></div>
</section>

<section id="teacherLive" class="hide">
<div class="card"><div class="top"><div><div class="muted">수업방 코드</div><div class="big" id="roomCode"></div></div><div><img id="qr" width="150" height="150" alt="QR"></div></div><div class="small muted">학생은 QR 또는 같은 페이지의 학생 모드에서 방 코드를 입력합니다.</div></div>
<div class="card"><div class="top"><div><span class="pill" id="qnum"></span><h2 id="tq"></h2></div><div class="row"><button id="prevQ">이전</button><button id="reveal">정답 공개</button><button class="primary" id="nextQ">다음</button></div></div><div id="topts"></div></div>
<div class="card"><h3>익명 응답 분포</h3><div class="grid"><div><div class="muted">제출</div><div class="stat" id="submitted">0명</div></div><div><div class="muted">정답률</div><div class="stat" id="accuracy">—</div></div></div><div id="dist"></div><p class="small muted">학생 이름·번호·오답자 명단은 교사 화면에 표시하지 않습니다.</p></div>
</section>

<section id="studentJoin" class="hide"><div class="card"><h2>학생 입장</h2><label>방 코드</label><input id="joinRoom" maxlength="6"><button class="primary" id="joinBtn" style="margin-top:10px">입장하기</button><div id="joinMsg" class="small"></div></div></section>
<section id="studentLive" class="hide"><div class="card"><span class="pill" id="sqnum"></span><h2 id="sq"></h2><div id="sopts"></div><button class="primary" id="submit">답 제출하기</button><div id="smsg" style="margin-top:10px"></div></div><div class="card hide" id="resultCard"><h3>내 결과</h3><div id="myResult"></div><div id="myExp" class="muted"></div></div></section>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import{getFirestore,doc,setDoc,getDoc,collection,getDocs,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig={
 apiKey:"AIzaSyAis4MfE6-oamhQZ_iD7ND-qfcD2Dcr8BQ",
 authDomain:"sciencelab27-5b82f.firebaseapp.com",
 projectId:"sciencelab27-5b82f",
 storageBucket:"sciencelab27-5b82f.firebasestorage.app",
 messagingSenderId:"412075132650",
 appId:"1:412075132650:web:5630ae2484e7dcd1393993"
};
const app=initializeApp(firebaseConfig),db=getFirestore(app),$=id=>document.getElementById(id);
$("net").textContent="Firebase 연결됨 · v3";
const DEFAULT=[{"q": "과학에서 말하는 힘의 설명으로 옳은 것은?", "opts": ["사람의 능력이나 역량", "물체를 밀거나 당길 때 작용하며 물체의 모양이나 운동 상태를 변화시킬 수 있다.", "피곤하지 않은 상태", "다른 사람에게 미치는 영향력"], "a": 1, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘의 단위로 옳은 것은?", "opts": ["kg", "m", "N(뉴턴)", "℃"], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "다음 중 과학적 의미의 힘이 작용한 경우는?", "opts": ["아는 것이 힘이다.", "공부하니 힘들었다.", "책상을 밀었다.", "격려가 힘이 된다."], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘에 의해 주로 물체의 모양이 변한 예는?", "opts": ["수레를 밀었다.", "고무줄을 당겼다.", "농구공을 던졌다.", "창문을 밀어 열었다."], "a": 1, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘에 의해 주로 운동 상태가 변한 예는?", "opts": ["색종이를 접었다.", "밀가루 반죽을 눌렀다.", "수레를 밀었다.", "고무줄을 당겼다."], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘에 의해 모양과 운동 상태가 모두 변할 수 있는 예는?", "opts": ["책을 읽었다.", "물이 얼었다.", "테니스공을 쳤다.", "종이를 접었다."], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "다음 중 힘의 작용으로 보기 어려운 것은?", "opts": ["대리석을 깼다.", "수레를 밀었다.", "물이 얼었다.", "테니스공을 쳤다."], "a": 2, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "힘을 측정할 때 사용할 수 있는 도구는?", "opts": ["온도계", "용수철저울 또는 힘 센서", "초시계", "눈금실린더"], "a": 1, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "‘책을 들어 옮겼다.’에서 힘은 과학적 의미의 힘인가?", "opts": ["그렇다.", "아니다.", "상황에 따라 항상 다르다.", "판단할 수 없다."], "a": 0, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}, {"q": "야구공을 잡을 때 힘의 주요 효과는?", "opts": ["공의 온도가 변한다.", "공의 운동 상태가 변한다.", "공이 녹는다.", "공의 질량이 변한다."], "a": 1, "exp": "학습지의 ‘과학에서의 힘’ 개념을 확인하는 문제입니다."}]; let questions=structuredClone(DEFAULT),room="",qi=0,selected=null,studentId=localStorage.fc_sid||crypto.randomUUID();localStorage.fc_sid=studentId;
const show=id=>$(id).classList.remove("hide"),hide=id=>$(id).classList.add("hide");
function renderEditor(){$("editor").innerHTML="";questions.forEach((x,i)=>{let d=document.createElement("div");d.className="qedit";d.innerHTML=`<b>${i+1}번</b><textarea data-k="q">${x.q}</textarea>${x.opts.map((o,j)=>`<div class="row"><input data-o="${j}" value="${o.replaceAll('"','&quot;')}"><label style="width:auto"><input style="width:auto" type="radio" name="a${i}" data-a="${j}" ${x.a===j?"checked":""}> 정답</label></div>`).join("")}<textarea data-k="exp" placeholder="해설">${x.exp||""}</textarea><button class="danger" data-del>삭제</button>`;d.querySelector('[data-k=q]').oninput=e=>x.q=e.target.value;d.querySelector('[data-k=exp]').oninput=e=>x.exp=e.target.value;d.querySelectorAll("[data-o]").forEach(el=>el.oninput=e=>x.opts[+e.target.dataset.o]=e.target.value);d.querySelectorAll("[data-a]").forEach(el=>el.onchange=e=>x.a=+e.target.dataset.a);d.querySelector("[data-del]").onclick=()=>{questions.splice(i,1);renderEditor()};$("editor").append(d)})}
function sets(){return JSON.parse(localStorage.fc_sets||"{}")} function refreshSets(){let s=sets();$("savedSets").innerHTML='<option value="">선택</option>'+Object.keys(s).map(k=>`<option>${k}</option>`).join("")}
$("teacherBtn").onclick=()=>{hide("home");show("teacherSetup");renderEditor();refreshSets()};$("studentBtn").onclick=()=>{hide("home");show("studentJoin")};
$("addQ").onclick=()=>{questions.push({q:"새 문제",opts:["보기 1","보기 2","보기 3","보기 4"],a:0,exp:""});renderEditor()};
$("newSet").onclick=()=>{questions=[];$("setName").value="새 문제 세트";renderEditor()};
$("saveSet").onclick=()=>{let s=sets(),n=$("setName").value.trim()||"문제 세트";s[n]=questions;localStorage.fc_sets=JSON.stringify(s);refreshSets();$("savedSets").value=n;alert("저장했습니다. 이 브라우저에서 다시 사용할 수 있습니다.")};
$("loadSet").onclick=()=>{let s=sets(),n=$("savedSets").value;if(s[n]){questions=structuredClone(s[n]);$("setName").value=n;renderEditor()}};
$("makeRoom").onclick=async()=>{if(!questions.length)return alert("문제를 1개 이상 만들어 주세요.");room=String(Math.floor(100000+Math.random()*900000));await setDoc(doc(db,"live_classes",room),{room,setName:$("setName").value,questions,qIndex:0,revealed:false,active:true,createdAt:serverTimestamp()});hide("teacherSetup");show("teacherLive");$("roomCode").textContent=room;let u=location.href.split("?")[0]+"?room="+room;$("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+encodeURIComponent(u);listenTeacher();renderT()};
function renderT(){let x=questions[qi];$("qnum").textContent=`${qi+1} / ${questions.length}`;$("tq").textContent=x.q;$("topts").innerHTML=x.opts.map((o,i)=>`<div class="option">${i+1}. ${o}</div>`).join("");refreshStats()}
async function updateRoom(rev=false){await setDoc(doc(db,"live_classes",room),{qIndex:qi,revealed:rev},{merge:true})}
$("nextQ").onclick=async()=>{if(qi<questions.length-1)qi++;await updateRoom(false);renderT()};$("prevQ").onclick=async()=>{if(qi>0)qi--;await updateRoom(false);renderT()};$("reveal").onclick=()=>updateRoom(true);
async function refreshStats(){let s=await getDocs(collection(db,"live_class_responses")),docs=s.docs.map(d=>d.data()).filter(x=>String(x.room)===room&&Number(x.qIndex)===qi),x=questions[qi],cnt=x.opts.map((_,i)=>docs.filter(r=>Number(r.answer)===i).length);$("submitted").textContent=docs.length+"명";$("accuracy").textContent=docs.length?Math.round(100*docs.filter(r=>r.correct).length/docs.length)+"%":"—";$("dist").innerHTML=cnt.map((n,i)=>`<div style="margin:10px 0"><div>${i+1}. ${x.opts[i]} <b>${n}명</b></div><div class="bar"><div class="fill" style="width:${docs.length?100*n/docs.length:0}%"></div></div></div>`).join("")}
function listenTeacher(){setInterval(refreshStats,1200)}
async function join(){room=$("joinRoom").value.trim();let snap=await getDoc(doc(db,"live_classes",room));if(!snap.exists())return $("joinMsg").textContent="수업방을 찾을 수 없습니다.";questions=snap.data().questions;hide("studentJoin");show("studentLive");onSnapshot(doc(db,"live_classes",room),s=>{if(!s.exists())return;let d=s.data();qi=d.qIndex||0;renderS(d.revealed)})}
$("joinBtn").onclick=join;
function renderS(revealed){let x=questions[qi];selected=null;$("sqnum").textContent=`${qi+1} / ${questions.length}`;$("sq").textContent=x.q;$("sopts").innerHTML=x.opts.map((o,i)=>`<button class="option" data-i="${i}">${i+1}. ${o}</button>`).join("");$("sopts").querySelectorAll("button").forEach(b=>b.onclick=()=>{selected=+b.dataset.i;$("sopts").querySelectorAll("button").forEach(z=>z.classList.remove("sel"));b.classList.add("sel")});$("smsg").textContent="";hide("resultCard");if(revealed)showOwnResult()}
$("submit").onclick=async()=>{if(selected===null)return $("smsg").textContent="답을 먼저 선택하세요.";let x=questions[qi];await setDoc(doc(db,"live_class_responses",room+"_"+studentId+"_"+qi),{room,sid:studentId,qIndex:qi,answer:selected,correct:selected===x.a,submittedAt:serverTimestamp()});localStorage.setItem("fc_last_"+room+"_"+qi,JSON.stringify({answer:selected,correct:selected===x.a}));$("smsg").innerHTML='<span class="ok">제출 완료 ✓</span>'};
function showOwnResult(){let raw=localStorage.getItem("fc_last_"+room+"_"+qi);if(!raw)return;let r=JSON.parse(raw),x=questions[qi];show("resultCard");$("myResult").innerHTML=r.correct?'<b class="ok">정답입니다 ✓</b>':`<b class="err">다시 확인해 봅시다.</b><br>정답: ${x.a+1}번 ${x.opts[x.a]}`;$("myExp").textContent=x.exp||""}
let prm=new URLSearchParams(location.search);if(prm.get("room")){hide("home");show("studentJoin");$("joinRoom").value=prm.get("room")}
</script></body></html>
