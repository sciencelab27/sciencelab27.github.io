<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>QuizClass 학생</title></head><body>
<div class=student>
<div class=card id=joinbox><div class=logo>Quiz<b>Class</b></div><h2>수업 참여</h2>
<div id=joinError class=hidden style="margin:10px 0;padding:10px;background:#fff0f0;border:1px solid #ef5350;border-radius:10px;color:#9b1c1c;font-weight:750"></div>
<input id=room class=field inputmode=numeric placeholder="6자리 PIN"><input id=name class=field placeholder="이름 또는 번호">
<button class="ctl primary" id=joinBtn type=button>입장하기</button>
<p class=small id=jscheck>페이지 준비 중...</p></div>
<div class="card hidden" id=game><div class=small id=status></div><div class=hearts id=hearts></div><h2 id=sq>교사가 문제를 시작할 때까지 기다려 주세요.</h2><div id=sopts></div><div class=bigresult id=result></div><p id=explain></p></div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
(function(){

const QC_CONFIG={
 apiKey:"AIzaSyAis4MfE6-oamhQZ_iD7ND-qfcD2Dcr8BQ",
 authDomain:"sciencelab27-5b82f.firebaseapp.com",
 projectId:"sciencelab27-5b82f",
 storageBucket:"sciencelab27-5b82f.firebasestorage.app",
 messagingSenderId:"412075132650",
 appId:"1:412075132650:web:5630ae2484e7dcd1393993"
};
const QC_ROOT="quizclass_v2";

 const $=id=>document.getElementById(id); let db=null,who="",room="",state=null,player=null,last=-99,busy=false,key="";
 function err(e){console.error(e);let b=$("joinError");b.classList.remove("hidden");b.textContent="⚠️ "+(e&&e.message?e.message:e)}
 function safeKey(x){return x.replace(/[.~*/\[\]]/g,"_")}
 try{
   firebase.initializeApp(QC_CONFIG); db=firebase.firestore();
   $("jscheck").textContent="✓ 참여 준비 완료"; $("jscheck").style.color="#159447";
 }catch(e){$("jscheck").textContent="⚠️ Firebase 준비 실패";err(e)}
 async function join(){
   if(busy)return;
   room=$("room").value.trim();who=$("name").value.trim();
   if(!room||!who){err("PIN과 이름을 모두 입력해 주세요.");return}
   if(!db){err("Firebase가 아직 준비되지 않았습니다. 새로고침해 주세요.");return}
   busy=true;$("joinBtn").textContent="입장 중...";
   try{
     const ref=db.collection(QC_ROOT).doc(room), snap=await ref.get();
     if(!snap.exists)throw new Error("방을 찾을 수 없습니다. PIN을 확인해 주세요.");
     const d=snap.data(), ps=d.players||{}; key=safeKey(who);
     if(!ps[key])ps[key]={name:who,score:0,answer:null,correct:null,alive:true,lives:3,joinedAt:Date.now()};
     await ref.update({players:ps});
     $("joinbox").classList.add("hidden");$("game").classList.remove("hidden");
     ref.onSnapshot(s=>{if(s.exists){state=s.data();player=(state.players||{})[key]||null;render()}},err);
   }catch(e){err(e);busy=false;$("joinBtn").textContent="입장하기"}
 }
 $("joinBtn").addEventListener("click",join);
 async function answer(i){
   if(!state||!state.running||!player||player.answer!=null||player.alive===false)return;
   let q=state.questions[state.idx],correct=i===q.ans,score=player.score||0,lives=player.lives==null?3:player.lives,alive=player.alive!==false;
   if(correct){let bonus=state.mode==="스피드 퀴즈"?Math.max(0,Math.ceil((state.endAt-Date.now())/1000))*5:0;score+=100+bonus}
   if(!correct&&state.mode==="골든벨")alive=false;
   if(!correct&&state.mode==="서바이벌"){lives=Math.max(0,lives-1);if(lives===0)alive=false}
   let ps=Object.assign({},state.players||{});ps[key]=Object.assign({},player,{answer:i,correct,score,lives,alive,answeredAt:Date.now()});
   try{await db.collection(QC_ROOT).doc(room).update({players:ps})}catch(e){alert("답 제출 오류: "+e.message)}
 }
 window.answer=answer;
 function render(){
   if(!state||!player)return;let q=state.questions&&state.questions[state.idx];
   $("status").textContent=state.mode+" · "+who+" · "+(player.score||0)+"점";
   $("hearts").textContent=state.mode==="서바이벌"?"내 생명 "+"❤️".repeat(player.lives==null?3:player.lives):state.mode==="골든벨"?(player.alive===false?"🔔 탈락":"🔔 생존 중"):"";
   if(!q){$("sq").textContent="교사가 문제를 시작할 때까지 기다려 주세요.";$("sopts").innerHTML="";return}
   if(state.idx!==last){last=state.idx;$("result").textContent="";$("explain").textContent=""}
   $("sq").textContent=q.q;$("sopts").innerHTML=q.opts.map((x,i)=>'<button class="sopt a'+(i+1)+'" onclick="answer('+i+')" '+(player.alive===false?'disabled':'')+'>'+(i+1)+'. '+x+'</button>').join("");
   if(player.answer!=null&&!state.reveal)$("result").textContent="제출 완료 ✓";
   if(state.reveal&&player.answer!=null){$("result").textContent=player.correct?"⭕ 정답!":"❌ 오답";$("explain").textContent=q.ex||""}
   if(player.alive===false)$("result").textContent=state.mode==="서바이벌"?"💔 탈락":"❌ 골든벨 탈락";
 }
})();
</script></body></html>
