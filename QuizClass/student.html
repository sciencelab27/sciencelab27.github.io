<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>QuizClass 학생</title></head><body><div class=student>
<div class=card id=joinbox><div class=logo>Quiz<b>Class</b></div><h2>수업 참여</h2><div id="joinError" class="hidden" style="margin:10px 0;padding:10px;background:#fff0f0;border:1px solid #ef5350;border-radius:10px;color:#9b1c1c;font-weight:750"></div><input id=room class=field placeholder="6자리 PIN"><input id=name class=field placeholder="이름 또는 번호"><button class="ctl primary" id=joinBtn>입장하기</button></div>
<div class="card hidden" id=game><div class=small id=status></div><div class=hearts id=hearts></div><h2 id=sq>교사가 문제를 시작할 때까지 기다려 주세요.</h2><div id=sopts></div><div class=bigresult id=result></div><p id=explain></p></div></div>
<script type=module>
import {db,doc,setDoc,getDoc,updateDoc,onSnapshot,ROOT} from "./firebase.js";
const $=id=>document.getElementById(id);
let who="",room="",state=null,player=null,last=-99,busy=false;
function err(e){console.error(e);let b=$("joinError");b.classList.remove("hidden");b.textContent="⚠️ "+(e?.message||e)}
function safeKey(x){return x.replace(/[.~*/\[\]]/g,"_")}
$("joinBtn").onclick=async()=>{
 if(busy)return; room=$("room").value.trim(); who=$("name").value.trim();
 if(!room||!who)return err("PIN과 이름을 모두 입력해 주세요.");
 busy=true;$("joinBtn").textContent="입장 중...";
 try{
   let ref=doc(db,ROOT,room), snap=await getDoc(ref);
   if(!snap.exists())throw new Error("방을 찾을 수 없습니다. PIN을 확인해 주세요.");
   let d=snap.data(), key=safeKey(who), ps=d.players||{};
   if(!ps[key]) ps[key]={name:who,score:0,answer:null,correct:null,alive:true,lives:3,joinedAt:Date.now()};
   await updateDoc(ref,{players:ps});
   $("joinbox").classList.add("hidden");$("game").classList.remove("hidden");
   listen(key);
 }catch(e){err(e);busy=false;$("joinBtn").textContent="입장하기";}
};
function listen(key){
 onSnapshot(doc(db,ROOT,room),snap=>{
   if(!snap.exists())return;
   state=snap.data(); player=(state.players||{})[key]||null; render(key);
 },err);
}
async function answer(i){
 let key=safeKey(who);
 if(!state?.running||player?.answer!=null||player?.alive===false)return;
 let q=state.questions[state.idx],correct=i===q.ans,score=player.score||0,lives=player.lives??3,alive=player.alive!==false;
 if(correct){let bonus=state.mode==="스피드 퀴즈"?Math.max(0,Math.ceil((state.endAt-Date.now())/1000))*5:0;score+=100+bonus}
 if(!correct&&state.mode==="골든벨")alive=false;
 if(!correct&&state.mode==="서바이벌"){lives=Math.max(0,lives-1);if(lives===0)alive=false}
 let ps={...(state.players||{})};ps[key]={...player,answer:i,correct,score,lives,alive,answeredAt:Date.now()};
 try{await updateDoc(doc(db,ROOT,room),{players:ps})}catch(e){alert("답 제출 오류: "+(e?.message||e))}
}
window.answer=answer;
function render(key){
 if(!state||!player)return;
 let q=state.questions?.[state.idx];
 $("status").textContent=`${state.mode} · ${who} · ${player.score||0}점`;
 $("hearts").textContent=state.mode==="서바이벌"?"내 생명 "+"❤️".repeat(player.lives??3):state.mode==="골든벨"?(player.alive===false?"🔔 탈락":"🔔 생존 중"):"";
 if(!q){$("sq").textContent="교사가 문제를 시작할 때까지 기다려 주세요.";$("sopts").innerHTML="";return}
 if(state.idx!==last){last=state.idx;$("result").textContent="";$("explain").textContent=""}
 $("sq").textContent=q.q;
 $("sopts").innerHTML=q.opts.map((x,i)=>`<button class="sopt a${i+1}" onclick="answer(${i})" ${player.alive===false?'disabled':''}>${i+1}. ${x}</button>`).join("");
 if(player.answer!=null&&!state.reveal)$("result").textContent="제출 완료 ✓";
 if(state.reveal&&player.answer!=null){$("result").textContent=player.correct?"⭕ 정답!":"❌ 오답";$("explain").textContent=q.ex||""}
 if(player.alive===false)$("result").textContent=state.mode==="서바이벌"?"💔 탈락":"❌ 골든벨 탈락";
}
</script></body></html>
