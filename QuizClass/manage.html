<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>QuizClass 문제 관리</title></head><body><div class=setup>
<div class=card><div class=logo>Quiz<b>Class</b> 문제 관리</div><p class=small>현재 교사 방의 문제를 편집합니다. 먼저 교사 화면에서 방을 만든 뒤 사용하세요.</p><a href=teacher.html>← 교사 화면</a></div><div class=grid2>
<div class=card><h2>문제 추가</h2><textarea id=q class=field placeholder="문제"></textarea><input id=o0 class=field placeholder="① 보기"><input id=o1 class=field placeholder="② 보기"><input id=o2 class=field placeholder="③ 보기"><input id=o3 class=field placeholder="④ 보기"><select id=ans class=field><option value=0>정답 ①</option><option value=1>정답 ②</option><option value=2>정답 ③</option><option value=3>정답 ④</option></select><input id=sec type=number class=field value=15 min=5><textarea id=ex class=field placeholder="해설"></textarea><button class="ctl success" id=addBtn>+ 문제 추가</button></div><div class=card><h2>문제 목록 <span id=cnt></span></h2><div id=list></div></div></div></div>
<script type=module>
import {db,doc,getDoc,updateDoc,ROOT} from "./firebase.js";const $=id=>document.getElementById(id);let room=localStorage.getItem("qc2_room")||"",data=null;
async function load(){if(!room){$("list").innerHTML="교사 화면에서 먼저 새 방을 만들어 주세요.";return}let s=await getDoc(doc(db,ROOT,room));if(!s.exists())return;$("list").dataset.ok="1";data=s.data();render()}
function render(){let a=data?.questions||[];$("cnt").textContent=a.length+"개";$("list").innerHTML=a.map((x,i)=>`<div class=qitem><b>${i+1}. ${x.q}</b><div class=small>${x.opts.join(" / ")}</div><button class="ctl danger" data-del="${i}">삭제</button></div>`).join("");document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(+b.dataset.del))}
$("addBtn").onclick=async()=>{if(!data)return alert("교사 화면에서 먼저 방을 만드세요.");let opts=[$("o0").value,$("o1").value,$("o2").value,$("o3").value];if(!$("q").value||opts.some(x=>!x))return alert("문제와 보기 4개를 입력하세요.");let a=data.questions||[];a.push({q:$("q").value,opts,ans:+$("ans").value,sec:+$("sec").value||15,ex:$("ex").value});await updateDoc(doc(db,ROOT,room),{questions:a});data.questions=a;["q","o0","o1","o2","o3","ex"].forEach(x=>$(x).value="");render()}
async function del(i){let a=data.questions||[];a.splice(i,1);await updateDoc(doc(db,ROOT,room),{questions:a});data.questions=a;render()}load();
</script></body></html>
