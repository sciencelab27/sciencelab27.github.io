<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교실 속 1 N을 찾아라! (학생)</title>
<style>
:root{
  --bg:#0F2928; --surface:#153532; --surface2:#1B403C; --line:#2D5652;
  --text:#EAF3EF; --muted:#8DB0A8; --gold:#F5B841; --gold-soft:rgba(245,184,65,.13);
  --gold-ink:#241900; --pin:#7FD6C2; --danger:#F07A6A; --ok:#3FCB7F; --grid:rgba(255,255,255,.035);
  --ko:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --num:"Bahnschrift","DIN Alternate","Roboto Condensed","Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#ECF1ED; --surface:#FFFFFF; --surface2:#F3F7F4; --line:#C3D3CB;
    --text:#11302C; --muted:#52726B; --gold:#A86A00; --gold-soft:rgba(168,106,0,.09);
    --gold-ink:#FFFFFF; --pin:#16806B; --danger:#C2412F; --ok:#1E8E55; --grid:rgba(0,40,30,.05);
    color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px; color:var(--text); font-family:var(--ko); word-break:keep-all;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
input,textarea{font-family:var(--ko);color:var(--text)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* 시작 화면 */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:30px;text-align:center}
.lg-title{font-size:clamp(28px,4vw,46px);font-weight:800}
.lg-title .n{color:var(--gold);font-size:1.3em}
.lg-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 30px;display:flex;flex-direction:column;gap:20px;min-width:min(560px,92vw)}
.lg-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;font-size:20px;font-weight:700}
.lg-row .lb{color:var(--muted);min-width:60px;text-align:left}
.fixed{padding:10px 18px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.clsb{font-size:22px;font-weight:800;width:68px;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.clsb.on{border:3px solid var(--gold);background:var(--gold-soft)}
#noIn{font-size:26px;width:120px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:center;font-family:var(--num)}
.btn-main{font-size:22px;font-weight:800;padding:14px 40px;border-radius:999px;border:0;background:var(--gold);color:var(--gold-ink)}
.btn-main:disabled{opacity:.4}
.err{color:var(--danger);font-size:16px;min-height:22px}

/* 활동 화면 */
#main{padding:14px 18px 30px;max-width:1280px;margin:0 auto}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.who{font-size:20px;font-weight:800}
.who button{font-size:14px;font-weight:600;margin-left:8px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.conn{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.conn.on i{background:var(--ok)}
.conn.err i{background:var(--danger)}
.bar .sp{flex:1}
.btn-img{font-size:17px;font-weight:800;padding:10px 18px;border-radius:12px;border:2px solid var(--gold);background:var(--gold-soft)}
.banner{background:var(--gold-soft);border:2px solid var(--gold);border-radius:16px;padding:14px 20px;font-size:20px;font-weight:800;margin-bottom:12px;text-align:center}

.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.card h2{font-size:19px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2 small{font-size:14px;color:var(--muted);font-weight:600}

.goal{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.goal .lb{font-size:16px;color:var(--muted);font-weight:700}
.goal .v{font-family:var(--num);font-size:64px;font-weight:700;line-height:1;color:var(--gold)}
.tip{font-size:15px;color:var(--muted);margin-bottom:14px}
.field{display:block;font-size:15px;color:var(--muted);font-weight:700;margin-bottom:6px}
#objName{width:100%;font-size:24px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin-bottom:14px}
.inrow{display:grid;grid-template-columns:1fr 1.25fr;gap:14px;align-items:stretch}
.display{background:var(--bg);border:2px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:56px;font-weight:700;min-height:120px}
.display.empty{color:var(--muted);font-size:26px;font-family:var(--ko);font-weight:600}
.display small{font-size:.45em;margin-left:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font-family:var(--num);font-size:26px;font-weight:700;height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.pad button:active{transform:scale(.96)}
.acts{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}
.btn-sub{font-size:18px;font-weight:800;padding:14px;border-radius:14px;border:2px solid var(--line);background:transparent}
.btn-send{font-size:19px;font-weight:800;padding:14px;border-radius:14px;border:0;background:var(--gold);color:var(--gold-ink)}
.btn-send:disabled{opacity:.4}
.note{font-size:15px;min-height:22px;margin-top:8px;color:var(--muted)}
.note.bad{color:var(--danger)}
.note.good{color:var(--ok);font-weight:700}

.rec{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.rec:last-child{border-bottom:0}
.rec .nm{font-size:19px;font-weight:800;overflow-wrap:anywhere}
.rec .nm .tg{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.rec .val{font-family:var(--num);font-size:26px;font-weight:700;text-align:right}
.rec .df{font-size:14px;color:var(--muted)}
.rec .ops{display:flex;gap:6px;justify-content:flex-end}
.rec .ops button{font-size:14px;font-weight:700;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface2)}
.rec .ops .snd{border-color:var(--gold);background:var(--gold-soft)}
.rec .ops .sent{color:var(--ok);border-color:var(--ok);background:transparent;cursor:default}
.rec .ops .x{color:var(--danger)}
.recs-empty{color:var(--muted);font-size:16px;padding:16px 0;line-height:1.6}
.left3{font-size:14px;color:var(--muted)}

.closing{margin-top:16px}
.q{margin-bottom:14px}
.q p{font-size:19px;font-weight:800;margin-bottom:6px}
.q p .n{color:var(--gold);margin-right:6px}
.q textarea{width:100%;min-height:66px;font-size:19px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);resize:vertical;line-height:1.5}

/* 이미지 저장 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:50;padding:20px}
.modal.on{display:grid}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 26px;width:min(460px,94vw)}
.mbox h3{font-size:22px;margin-bottom:6px}
.mbox p{font-size:15px;color:var(--muted);margin-bottom:16px}
.chk{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--gold)}
.mbox .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.mbox .no{font-size:17px;font-weight:700;padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:transparent}
.mbox .ok{font-size:17px;font-weight:800;padding:10px 22px;border-radius:999px;border:0;background:var(--gold);color:var(--gold-ink)}

/* 저장용 보고서 (화면 밖에서 그림) */
#report{position:fixed;left:-10000px;top:0;width:900px;background:#FFFFFF;color:#11302C;padding:36px 40px;font-family:var(--ko)}
#report h1{font-size:30px;margin-bottom:4px}
#report .meta{font-size:18px;color:#52726B;margin-bottom:22px}
#report h2{font-size:21px;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid #C3D3CB}
#report table{width:100%;border-collapse:collapse;font-size:19px}
#report td,#report th{padding:8px 10px;border-bottom:1px solid #DDE7E2;text-align:left}
#report th{color:#52726B;font-size:15px}
#report .rq{font-size:18px;font-weight:800;margin-top:12px}
#report .ra{font-size:19px;padding:8px 12px;background:#F3F7F4;border-radius:8px;margin-top:4px;min-height:38px;white-space:pre-wrap}

@media (max-width:820px){ .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="../firebase-config.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<!-- 시작: 인적사항 -->
<section id="login">
  <h1 class="lg-title">🔎 교실 속 <span class="n">1 N</span>을 찾아라!</h1>
  <div class="lg-card">
    <div class="lg-row"><span class="lb">학년</span><span class="fixed">1학년</span></div>
    <div class="lg-row"><span class="lb">반</span><span id="clsBtns"></span></div>
    <div class="lg-row"><span class="lb">번호</span><input id="noIn" inputmode="numeric" maxlength="2" placeholder="번호" autocomplete="off"> 번</div>
    <div class="err" id="lgErr"></div>
    <div><button class="btn-main" id="btnGo">시작하기</button></div>
  </div>
</section>

<!-- 활동 -->
<section id="main" class="hide">
  <div class="bar">
    <span class="who" id="whoTxt"></span>
    <span class="conn" id="conn"><i></i><span id="connTxt">연결 중</span></span>
    <span class="sp"></span>
    <button class="btn-img" id="btnImg">📷 이미지 저장</button>
  </div>
  <div class="banner hide" id="banner"></div>

  <div class="grid">
    <div class="card">
      <div class="goal"><span class="lb">목표</span><span class="v" id="goalV">1 N</span></div>
      <p class="tip">저울은 들고 돌아다니며 재고, 입력은 자리에 돌아와서 해요.</p>
      <label class="field" for="objName">물체 이름</label>
      <input id="objName" maxlength="20" placeholder="예: 가위" autocomplete="off">
      <span class="field">측정값</span>
      <div class="inrow">
        <div class="display empty" id="disp">숫자를 눌러요</div>
        <div class="pad" id="pad">
          <button>7</button><button>8</button><button>9</button>
          <button>4</button><button>5</button><button>6</button>
          <button>1</button><button>2</button><button>3</button>
          <button>.</button><button>0</button><button data-k="back">⌫</button>
        </div>
      </div>
      <div class="acts">
        <button class="btn-sub" id="btnRec">기록만 하기</button>
        <button class="btn-send" id="btnSend">선생님께 보내기</button>
      </div>
      <p class="note" id="note"></p>
    </div>

    <div class="card">
      <h2>내 측정 기록 <small id="left3"></small></h2>
      <div id="recs"></div>
    </div>
  </div>

  <div class="card closing hide" id="closing">
    <h2>수업 마무리 <small>생각을 짧게 적어 보세요</small></h2>
    <div class="q"><p><span class="n">①</span>용수철저울로 측정한 것은 무엇인가?</p><textarea data-a="0"></textarea></div>
    <div class="q"><p><span class="n">②</span>1 N은 어느 정도의 힘이라고 느껴졌는가?</p><textarea data-a="1"></textarea></div>
    <div class="q"><p><span class="n">③</span>질량이 커지면 물체에 작용하는 중력의 크기는 어떻게 될까?</p><textarea data-a="2"></textarea></div>
  </div>
</section>

<div class="modal" id="imgModal">
  <div class="mbox">
    <h3>📷 이미지 저장</h3>
    <p>저장할 부분을 고르세요.</p>
    <label class="chk"><input type="checkbox" id="cRec" checked> 내 측정 기록</label>
    <label class="chk" id="cAnsWrap"><input type="checkbox" id="cAns" checked> 수업 마무리 답</label>
    <div class="row"><button class="no" id="imgNo">취소</button><button class="ok" id="imgOk">저장하기</button></div>
  </div>
</div>
<div id="report"></div>

<script>
/* =========================================================
   파이어베이스 설정 — 교사용 find_1N.html과 같은 값을 씁니다.
   깃허브 m1 폴더에 올리면 맨 위의 firebase-config.js를 자동으로 사용하고,
   안 되면 아래 칸에 직접 붙여 넣으세요.
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const COL = 'find1n', CTRL = 'find1n_ctrl';
const MAX_SEND = 3;
const SKEY = 'find1N-student-v1';
const KEEP_MS = 2*60*60*1000;   // 튕겨도 2시간 동안 이어서 쓰기

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const same = (a,b) => Math.abs(a-b) < 1e-9;
const fmtT = v => String(Math.round(v*100)/100);
const fmtV = v => { const s = (Math.round(v*100)/100).toFixed(2); return s.endsWith('0') ? s.slice(0,-1) : s; };

let st = loadSt();
let ctrl = {target:1, stage:'explore'};
let db = null, conn = 'wait', unsubA = null, unsubB = null;
let mine = [];      // 내가 보낸 결과(서버 기준)
let typed = '';     // 숫자 패드 입력값

function blank(){ return {cls:null, no:null, records:[], answers:['','',''], ts:Date.now(), seq:1}; }
function loadSt(){
  try{
    const s = JSON.parse(localStorage.getItem(SKEY));
    if(s && Date.now() - s.ts < KEEP_MS) return Object.assign(blank(), s);
  }catch(e){}
  return blank();
}
function saveSt(){ st.ts = Date.now(); try{ localStorage.setItem(SKEY, JSON.stringify(st)); }catch(e){} }

/* ---------- 시작 화면 ---------- */
let pickCls = st.cls;
function renderLogin(){
  $('#clsBtns').innerHTML = [1,2,3,4,5].map(c => `<button class="clsb ${pickCls===c?'on':''}" data-c="${c}">${c}</button>`).join(' ');
  if(st.no) $('#noIn').value = st.no;
}
$('#clsBtns').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if(b){ pickCls = +b.dataset.c; renderLogin(); } });
$('#noIn').addEventListener('keydown', e => { if(e.key === 'Enter') $('#btnGo').click(); });
$('#btnGo').onclick = () => {
  const no = parseInt($('#noIn').value, 10);
  if(!pickCls){ $('#lgErr').textContent = '반을 골라 주세요.'; return; }
  if(!(no >= 1 && no <= 40)){ $('#lgErr').textContent = '번호를 숫자로 입력해 주세요.'; $('#noIn').focus(); return; }
  if(st.cls !== pickCls || st.no !== no){ const keep = st.cls === null; st = keep ? Object.assign(st, {cls:pickCls, no}) : Object.assign(blank(), {cls:pickCls, no}); }
  saveSt(); enter();
};
function enter(){
  $('#login').classList.add('hide'); $('#main').classList.remove('hide');
  $('#whoTxt').innerHTML = `1학년 ${st.cls}반 ${st.no}번 <button id="btnChange">바꾸기</button>`;
  $('#btnChange').onclick = () => { $('#main').classList.add('hide'); $('#login').classList.remove('hide'); renderLogin(); };
  document.querySelectorAll('[data-a]').forEach(t => t.value = st.answers[+t.dataset.a] || '');
  listen(); render();
}

/* ---------- 파이어베이스 ---------- */
function initDb(){
  try{
    if(typeof firebase === 'undefined') return;
    if(!firebase.apps.length){
      const cfg = (typeof firebaseConfig !== 'undefined' && firebaseConfig && firebaseConfig.projectId) ? firebaseConfig
                : (FIREBASE_CONFIG.projectId ? FIREBASE_CONFIG : null);
      if(cfg) firebase.initializeApp(cfg);
    }
    if(firebase.apps.length) db = firebase.firestore();
  }catch(e){ db = null; }
}
function listen(){
  if(unsubA) unsubA(); if(unsubB) unsubB();
  if(!db){ conn = 'off'; render(); return; }
  conn = 'wait';
  unsubA = db.collection(CTRL).doc('c'+st.cls).onSnapshot(d => {
    if(d.exists){ const x = d.data(); ctrl = {target:+x.target || 1, stage:x.stage || 'explore'}; }
    conn = 'on'; render();
  }, () => { conn = 'err'; render(); });
  unsubB = db.collection(COL).where('cls','==',st.cls).onSnapshot(snap => {
    mine = snap.docs.map(d => Object.assign({docId:d.id}, d.data())).filter(x => x.no === st.no);
    if(!snap.metadata.fromCache){
      const ids = new Set(mine.map(x => x.docId));
      st.records.forEach(r => {
        if(r.docId && !ids.has(r.docId)) r.docId = null;               // 선생님이 지운 경우
        const m = r.docId && mine.find(x => x.docId === r.docId);
        if(m){ r.name = String(m.name); r.v = +m.v; }                  // 선생님이 고친 경우
      });
      saveSt();
    }
    conn = 'on'; render();
  }, () => { conn = 'err'; render(); });
}

/* ---------- 입력 ---------- */
$('#pad').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.k === 'back') typed = typed.slice(0,-1);
  else if(b.textContent === '.'){ if(!typed.includes('.')) typed = (typed || '0') + '.'; }
  else if(typed.length < 5){
    if(typed.includes('.') && typed.split('.')[1].length >= 2) return;
    typed = (typed === '0' ? '' : typed) + b.textContent;
  }
  renderDisp();
});
function renderDisp(){
  const d = $('#disp');
  d.classList.toggle('empty', !typed);
  d.innerHTML = typed ? `${esc(typed)}<small>N</small>` : '숫자를 눌러요';
}
let noteTimer;
function note(t, kind=''){
  const n = $('#note'); n.textContent = t; n.className = 'note ' + kind;
  clearTimeout(noteTimer); noteTimer = setTimeout(() => { n.textContent = ''; n.className = 'note'; }, 3500);
}
function readInput(){
  const name = $('#objName').value.trim();
  const v = parseFloat(typed);
  if(!name){ note('물체 이름을 적어 주세요.', 'bad'); $('#objName').focus(); return null; }
  if(!typed || !isFinite(v)){ note('측정값을 숫자 버튼으로 눌러 주세요.', 'bad'); return null; }
  return {name, v:Math.round(v*100)/100};
}
function clearInput(){ $('#objName').value = ''; typed = ''; renderDisp(); }
function sentCount(){ return mine.filter(x => same(+x.target, ctrl.target)).length; }

$('#btnRec').onclick = () => {
  const x = readInput(); if(!x) return;
  st.records.unshift({id:st.seq++, name:x.name, v:x.v, target:ctrl.target, docId:null, t:Date.now()});
  saveSt(); clearInput(); render(); note('기록했어요. 1 N에 가까우면 [보내기]를 눌러요.');
};
$('#btnSend').onclick = () => {
  const x = readInput(); if(!x) return;
  const r = {id:st.seq++, name:x.name, v:x.v, target:ctrl.target, docId:null, t:Date.now()};
  st.records.unshift(r); saveSt(); clearInput();
  send(r);
};
function send(r){
  if(!db || conn !== 'on'){ note('선생님 화면과 연결되지 않았어요. 기록은 저장되어 있어요.', 'bad'); render(); return; }
  if(!same(r.target, ctrl.target)){ note(`지금 목표는 ${fmtT(ctrl.target)} N이에요.`, 'bad'); return; }
  if(sentCount() >= MAX_SEND){ note(`보내기는 ${MAX_SEND}개까지예요. 보낸 것을 취소하면 다시 보낼 수 있어요.`, 'bad'); render(); return; }
  const ref = db.collection(COL).doc();
  r.docId = ref.id; saveSt(); render();
  ref.set({cls:st.cls, no:st.no, name:r.name, v:r.v, target:r.target, t:Date.now()})
    .then(() => note('선생님 화면으로 보냈어요!', 'good'))
    .catch(() => { r.docId = null; saveSt(); render(); note('보내지 못했어요. 다시 눌러 주세요.', 'bad'); });
}

/* ---------- 기록 목록 ---------- */
$('#recs').addEventListener('click', e => {
  const row = e.target.closest('.rec'); if(!row) return;
  const r = st.records.find(x => x.id === +row.dataset.id); if(!r) return;
  if(e.target.classList.contains('snd')) send(r);
  else if(e.target.classList.contains('cancel')){
    if(db && r.docId) db.collection(COL).doc(r.docId).delete().catch(() => note('취소하지 못했어요.', 'bad'));
    r.docId = null; saveSt(); render();
  }else if(e.target.classList.contains('x')){
    if(!e.target.dataset.arm){ e.target.dataset.arm = 1; e.target.textContent = '정말?'; return; }
    st.records = st.records.filter(x => x !== r); saveSt(); render();
  }
});

/* ---------- 화면 그리기 ---------- */
function render(){
  const t = ctrl.target;
  $('#goalV').textContent = `${fmtT(t)} N`;
  document.title = `교실 속 ${fmtT(t)} N을 찾아라! (학생)`;

  const c = $('#conn');
  c.classList.toggle('on', conn === 'on'); c.classList.toggle('err', conn === 'err' || conn === 'off');
  $('#connTxt').textContent = {wait:'연결 중', on:'선생님 화면과 연결됨', err:'연결 끊김', off:'연결 안 됨'}[conn];

  const left = Math.max(0, MAX_SEND - sentCount());
  $('#btnSend').textContent = `선생님께 보내기 (남은 ${left}번)`;
  $('#btnSend').disabled = conn !== 'on' || left === 0;
  $('#left3').textContent = `${fmtT(t)} N 목표 보내기 ${MAX_SEND - left}/${MAX_SEND}`;

  const many = new Set(st.records.map(r => r.target)).size > 1;
  $('#recs').innerHTML = st.records.length ? st.records.map(r => {
    const cur = same(r.target, t);
    const d = Math.round(Math.abs(r.v - r.target)*100)/100;
    let ops;
    if(r.docId) ops = `<button class="sent" disabled>보냄 ✓</button><button class="cancel">취소</button>`;
    else ops = (cur ? `<button class="snd" ${left===0||conn!=='on'?'disabled':''}>보내기</button>` : '') + `<button class="x">삭제</button>`;
    return `<div class="rec" data-id="${r.id}">
      <div class="nm">${esc(r.name)}${many ? `<span class="tg">${fmtT(r.target)} N 목표</span>` : ''}</div>
      <div class="val">${fmtV(r.v)} N</div>
      <div class="df">${d === 0 ? `정확히 ${fmtT(r.target)} N` : `${fmtT(r.target)} N과 차이 ${fmtV(d)}`}</div>
      <div class="ops">${ops}</div></div>`;
  }).join('') : `<p class="recs-empty">아직 기록이 없어요.<br>여러 물체를 재서 모두 기록해 보세요.<br>그중 ${fmtT(t)} N에 가장 가까운 것을 보내요.</p>`;

  const b = $('#banner');
  const stg = ctrl.stage;
  b.classList.toggle('hide', !(stg === 'mass' || stg === 'question' || stg === 'answer'));
  b.textContent = stg === 'mass' ? '⚖ 선생님 화면을 보세요. 저울에 올리기 전에 몇 g일지 먼저 예측해 보세요!'
                : stg === 'question' ? '🔓 선생님 화면을 보세요. 우리가 찾은 1 N 물체에는 어떤 공통점이 있을까요?'
                : stg === 'answer' ? '🔓 선생님 화면을 보세요.' : '';
  const showClose = stg === 'closing' || st.answers.some(a => a.trim());
  $('#closing').classList.toggle('hide', !showClose);
  $('#cAnsWrap').classList.toggle('hide', !showClose);
}

document.querySelectorAll('[data-a]').forEach(t => t.addEventListener('input', () => {
  st.answers[+t.dataset.a] = t.value; saveSt();
}));

/* ---------- 이미지 저장 ---------- */
$('#btnImg').onclick = () => $('#imgModal').classList.add('on');
$('#imgNo').onclick = () => $('#imgModal').classList.remove('on');
$('#imgOk').onclick = async () => {
  const wantRec = $('#cRec').checked;
  const wantAns = $('#cAns').checked && !$('#cAnsWrap').classList.contains('hide');
  if(!wantRec && !wantAns){ return; }
  if(typeof html2canvas === 'undefined'){ alert('이미지 저장 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
  const day = new Date();
  const ds = `${day.getFullYear()}.${day.getMonth()+1}.${day.getDate()}`;
  const Q = ['용수철저울로 측정한 것은 무엇인가?','1 N은 어느 정도의 힘이라고 느껴졌는가?','질량이 커지면 물체에 작용하는 중력의 크기는 어떻게 될까?'];
  let h = `<h1>🔎 교실 속 1 N을 찾아라!</h1><p class="meta">1학년 ${st.cls}반 ${st.no}번 ${ds}</p>`;
  if(wantRec){
    h += `<h2>내 측정 기록</h2>`;
    h += st.records.length
      ? `<table><tr><th>물체</th><th>측정값</th><th>목표</th><th>보냄</th></tr>${
          st.records.slice().reverse().map(r => `<tr><td>${esc(r.name)}</td><td>${fmtV(r.v)} N</td><td>${fmtT(r.target)} N</td><td>${r.docId?'✓':''}</td></tr>`).join('')}</table>`
      : '<p>기록 없음</p>';
  }
  if(wantAns){
    h += `<h2>수업 마무리</h2>` + Q.map((q,i) => `<p class="rq">${'①②③'[i]} ${q}</p><div class="ra">${esc(st.answers[i]||'')}</div>`).join('');
  }
  const rep = $('#report'); rep.innerHTML = h;
  $('#imgOk').disabled = true; $('#imgOk').textContent = '저장 중…';
  try{
    const cv = await html2canvas(rep, {scale:2, backgroundColor:'#FFFFFF'});
    const a = document.createElement('a');
    a.download = `1학년${st.cls}반${st.no}번_1N찾기.png`;
    a.href = cv.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
    $('#imgModal').classList.remove('on');
  }catch(e){ alert('이미지를 만들지 못했어요. 다시 눌러 주세요.'); }
  $('#imgOk').disabled = false; $('#imgOk').textContent = '저장하기';
};

/* ---------- 시작 ---------- */
renderLogin(); renderDisp();
window.addEventListener('DOMContentLoaded', () => {
  initDb();
  if(st.cls && st.no) enter();
});
</script>
</body>
</html>
